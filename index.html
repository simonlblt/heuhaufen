const AV_DATA_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/]+=*$/;
const AV_ICON_RE=/^icon:([a-z0-9]{1,16}):(\d{1,2})$/;
const avCache=new Map(), avAt=new Map();
const avBusy=new Set();
let avOff=false;
const AV_TTL=5*60*1000;
function avSet(pid, val){ avCache.set(pid, typeof val==="string" && val ? val : null); avAt.set(pid, Date.now()); }
const initials=name=>{ const s=String(name||"").replace(/[^A-Za-z0-9ÄÖÜäöüß]/g,""); return (s.slice(0,2)||"?").toUpperCase(); };
const avStyle=c=>`--avc:${AV_COLORS[c]};--avt:${AV_INK[c]}`;
const avSeed=name=>hashStr(String(name||"?").toLowerCase())%AV_COLORS.length;
function avParts(av, name){
  if (typeof av==="string" && av.length<=60000 && AV_DATA_RE.test(av)) return {style:"", html:`<img src="${av}" alt="" draggable="false">`};
  const m=typeof av==="string" ? AV_ICON_RE.exec(av) : null;
  if (m && AV_ICONS[m[1]]) return {style:avStyle((+m[2])%AV_COLORS.length), html:svg(AV_ICONS[m[1]])};
  if (m && m[1]==="abc") return {style:avStyle((+m[2])%AV_COLORS.length), html:esc(initials(name))};
  return {style:avStyle(avSeed(name)), html:esc(initials(name))};
}
function avatarHTML(pid, name, cls, av){
  const val = av!==undefined ? av : (pid && avCache.has(pid) ? avCache.get(pid) : null);
  const p=avParts(val, name);
  return `<span class="av${cls?" "+cls:""}" style="${p.style}"${pid?` data-av="${esc(pid)}" data-avn="${esc(name||"")}"`:""} aria-hidden="true">${p.html}</span>`;
}
function paintAvatars(pids){
  document.querySelectorAll("[data-av]").forEach(el=>{
    const p=el.dataset.av;
    if ((pids && !pids.includes(p)) || !avCache.has(p)) return;
    const r=avParts(avCache.get(p), el.dataset.avn);
    el.setAttribute("style", r.style); el.innerHTML=r.html;
  });
}
async function loadAvatars(root){
  if (avOff || !dailyAvailable()) return;
  const need=[...new Set([...(root||document).querySelectorAll("[data-av]")].map(e=>e.dataset.av))]
    .filter(p=>/^[0-9a-f]{12}$/.test(p) && !avBusy.has(p) && (!avCache.has(p) || Date.now()-(avAt.get(p)||0)>AV_TTL));
  if (!need.length) return;
  need.forEach(p=>avBusy.add(p));
  const got=[];
  try{
    for (let i=0;i<need.length;i+=40){
      const part=need.slice(i, i+40);
      let r=null;
      if (!looksOff){
        try{ r=await rpc("get_looks", {p_pids:part}); }
        catch(e){ if (e && e.status===404) looksOff=true; else throw e; }
      }
      if (looksOff) r=await rpc("get_avatars", {p_pids:part});
      part.forEach(p=>{ const old=avCache.get(p), v=r ? r[p] : null; lookSet(p, v==null ? null : v); if (old!==avCache.get(p)) got.push(p); });
    }
  }catch(e){ if (e && e.status===404) avOff=true; }
  finally{ need.forEach(p=>avBusy.delete(p)); }
  if (got.length) paintAvatars(got);
  paintNames(); paintCharms();
}

  if (bonus && Number(bonus.tokens)>0) toast(`Tagesrätsel vom ${esc(dayLabel(bonus.day))}: Platz ${Number(bonus.pos)||"?"} – <b>+${Number(bonus.tokens)} Token</b>`, I_COIN, 5200);

  zoomEl.oninput=()=>{ st.zoom=Math.max(1, Math.min(4, Number(zoomEl.value)||1)); st.dirty=true; redraw(); };
  const pts=new Map(); let pinch=0;
  const dist=()=>{ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); };
  crop.onpointerdown=ev=>{ if (!st.img) return; try{ crop.setPointerCapture(ev.pointerId); }catch(e){} pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY}); if (pts.size===2) pinch=dist(); };
  crop.onpointermove=ev=>{
    const p=pts.get(ev.pointerId); if (!p || !st.img) return;
    const size=crop.clientWidth||240;
    if (pts.size===1){ st.ox+=(ev.clientX-p.x)/size; st.oy+=(ev.clientY-p.y)/size; }
    p.x=ev.clientX; p.y=ev.clientY;
    if (pts.size===2){ const d=dist(); if (pinch>0){ st.zoom=Math.max(1, Math.min(4, st.zoom*d/pinch)); zoomEl.value=String(st.zoom); } pinch=d; }
    st.dirty=true; redraw();
  };
  crop.onpointerup=crop.onpointercancel=ev=>{ pts.delete(ev.pointerId); pinch=0; };
  crop.onwheel=ev=>{ if (!st.img) return; ev.preventDefault(); st.zoom=Math.max(1, Math.min(4, st.zoom*(ev.deltaY<0?1.08:.93))); zoomEl.value=String(st.zoom); st.dirty=true; redraw(); };
  const exportPhoto=()=>{
    const c=document.createElement("canvas"); c.width=c.height=192;
    draw(c.getContext("2d"), 192);
    for (const ql of [.86,.78,.68,.56,.44]){ const u=c.toDataURL("image/jpeg", ql); if (u.length<=45000 && AV_DATA_RE.test(u)) return u; }
    return null;
  };
  const send=async val=>{
    const save=q("avSave"), rem=q("avRemove");
    save.disabled=true; rem.disabled=true; err.textContent="";
    try{ await rpc("set_avatar", {p_player:local.playerId, p_avatar:val}); }
    catch(e){
      save.disabled=false; rem.disabled=false;
      err.textContent = e && e.status===404 ? "Profilbilder sind noch nicht eingerichtet: In Supabase muss einmal das Skript setup.sql laufen."
        : e && e.code==="need_account" ? "Bitte melde dich nochmal an."
        : e && e.code==="network" ? "Keine Verbindung. Prüf dein Internet und versuch es nochmal."
        : "Das hat nicht geklappt. Versuch es nochmal.";
      return;
    }
    const p=myPid();
    if (p){ avSet(p, val); paintAvatars([p]); }
    if (me) me.avatar=val||null;
    closeModal();
    toast(val ? "Profilbild gespeichert." : "Profilbild entfernt.", I_CHECK); sfx("point");
    if (!p) refreshMe(true);
    if (state.screen==="profile" && state.data && state.data.me){ state.data.avatar=val||null; render(); }
    else if (state.screen==="start") updateMeCard();
  };
  q("avSave").onclick=()=>{
    if (st.tab==="icon") return send(`icon:${st.icon}:${st.color}`);
    if (!st.img){ err.textContent="Such zuerst ein Foto aus."; return; }
    const val = st.dirty || !st.photo ? exportPhoto() : st.photo;
    if (!val){ err.textContent="Dieses Bild lässt sich nicht verkleinern. Nimm ein anderes."; return; }
    send(val);
  };
  q("avRemove").onclick=()=>send("");
  q("avClose").onclick=closeModal;
  wrap.onclick=ev=>{ if (ev.target===wrap) closeModal(); };
  modalKey=ev=>{ if (ev.key==="Escape") closeModal(); };
  document.addEventListener("keydown", modalKey);
  paint();
  try{ q("avClose").focus({preventScroll:true}); }catch(e){}
  if (st.photo) useImage(st.photo).then(img=>{ if (!st.img && $("avModal")===wrap){ st.img=img; redraw(); } }, ()=>{});
}

/* ======================= Namen ändern (einmal pro Woche) ======================= */
const fmtWhen=ts=>{ try{ return new Intl.DateTimeFormat("de-DE", {timeZone:TZ, weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"}).format(new Date(ts))+" Uhr"; }catch(e){ return ""; } };
function openNameEditor(next){
  if (!dailyAvailable() || !account()) return;
  closeModal();
  const cur=account().name;
  const wait=Number(next)>Date.now() ? Number(next) : 0;
  const wrap=document.createElement("div");
  wrap.className="modal"; wrap.id="nmModal"; wrap.setAttribute("role","dialog"); wrap.setAttribute("aria-modal","true"); wrap.setAttribute("aria-label","Name ändern");
  wrap.innerHTML=`<div class="mcard">
    <div class="mhead"><h2>Name ändern</h2><button class="iconbtn" id="nmClose" type="button" aria-label="Schließen">${I_X}</button></div>
    ${wait ? noteHTML(I_CLOCK, `Du hast deinen Namen vor Kurzem geändert. Das geht <b>einmal pro Woche</b> – wieder ab <b>${esc(fmtWhen(wait))}</b>.`)
      : `<form class="authform" id="nmForm" novalidate>
        <label for="nmIn">Neuer Name</label>
        <input id="nmIn" maxlength="10" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" value="${esc(cur)}">
        <span class="hint">2–10 Zeichen: Buchstaben, Zahlen, _ . oder -</span>
        <p class="fb bad" id="nmErr" role="alert" style="min-height:0"></p>
        <div class="row"><button class="btn" id="nmGo" type="submit">Namen ändern</button></div>
      </form>
      <p class="hint">Das geht <b>einmal pro Woche</b>. Der neue Name gilt überall – auch in alten Bestenlisten und Duellen. Danach meldest du dich mit dem neuen Namen an, dein Passwort bleibt gleich.</p>`}
  </div>`;
  document.body.appendChild(wrap);
  const q=id=>wrap.querySelector("#"+id);
  q("nmClose").onclick=closeModal;
  wrap.onclick=ev=>{ if (ev.target===wrap) closeModal(); };
  modalKey=ev=>{ if (ev.key==="Escape") closeModal(); };
  document.addEventListener("keydown", modalKey);
  if (wait){ try{ q("nmClose").focus({preventScroll:true}); }catch(e){} return; }
  const inp=q("nmIn"), err=q("nmErr"), btn=q("nmGo");
  inp.oninput=()=>{ const c=cleanName(inp.value); if (c!==inp.value) inp.value=c; };
  try{ inp.focus({preventScroll:true}); inp.select(); }catch(e){}
  q("nmForm").onsubmit=async ev=>{
    ev.preventDefault();
    if (btn.disabled) return;
    const name=cleanName(inp.value);
    if (!NAME_RE.test(name)){ err.textContent=AUTH_ERR.bad_name; return; }
    if (name===cur){ err.textContent="Das ist schon dein Name."; return; }
    btn.disabled=true; err.textContent="";
    const player=local.playerId;
    let r=null;
    try{ r=await rpc("change_name", {p_player:player, p_name:name}); }
    catch(e){
      btn.disabled=false;
      const code=e && e.code;
      err.textContent = code==="name_taken" ? "Diesen Namen gibt es schon. Nimm einen anderen."
        : code==="bad_name" ? AUTH_ERR.bad_name
        : code==="same_name" ? "Das ist schon dein Name."
        : code==="need_account" ? "Bitte melde dich nochmal an."
        : code==="network" ? AUTH_ERR.network
        : e && e.status===404 ? "Namen ändern ist noch nicht eingerichtet: In Supabase muss einmal das Skript setup.sql laufen."
        : "Das hat nicht geklappt. Versuch es nochmal.";
      return;
    }
    if (!r || !r.ok){
      btn.disabled=false;
      err.textContent = r && r.error==="too_soon" ? `Du kannst deinen Namen erst wieder ab ${fmtWhen(r.next)} ändern.` : "Das hat nicht geklappt. Versuch es nochmal.";
      return;
    }
    if (!account() || local.playerId!==player){ closeModal(); return; }
    const neu=cleanName(r.name)||name;
    local.account.name=neu;
    Object.values(local.days).forEach(e=>{ if (e && e.name) e.name=neu; });
    saveLocal();
    if (me) me.name=neu;
    closeModal(); updateHeader();
    toast(`Du heißt jetzt <b>${esc(neu)}</b>.`, I_CHECK); sfx("point");
    if (state.screen==="profile") openProfile(state.pid||null);
    else if (state.screen==="start") render();
  };
}

async function shopBuy(id){
  const s=state; if (s.screen!=="shop" || s.busy) return;
  if (s.confirm!==id){ s.confirm=id; s.msg=""; sfx("tap"); render(); return; }
  s.busy=true; s.confirm=null;
  const it=STYLE_BY.get(id)||CHARM_BY.get(id);
  let r=null, err=null;
  try{ r=await rpc("buy_item", {p_player:local.playerId, p_item:id}); }catch(e){ err=e||{code:"unknown"}; }
  s.busy=false;
  if (r && r.ok) adoptShop(r);
  if (state!==s) return;
  if (err){ s.msg=SHOP_ERR[err.code] || "Das hat nicht geklappt. Versuch es nochmal."; render(); return; }
  if (!r || !r.ok){
    if (r && s.data) s.data.tokens=Number(r.tokens)||0;
    s.msg = r && r.error==="too_poor" ? `Dafür fehlen dir noch ${fmtNum((Number(r.price)||0)-(Number(r.tokens)||0))} Token.` : "Das hat nicht geklappt. Versuch es nochmal.";
    render(); return;
  }
  s.data=r; s.msg=""; render();
  toast(`Gekauft: <b>${esc(it ? it.name : "")}</b>`, I_COIN); sfx("win"); buzz([20,30,50]);
  confetti($("it_"+id), 36); cheerCharms();
}
async function shopEquip(slot, id){
  const s=state; if (s.screen!=="shop" || s.busy) return;
  s.busy=true;
  let r=null, err=null;
  try{ r=await rpc("equip_item", {p_player:local.playerId, p_slot:slot, p_item:id||""}); }catch(e){ err=e||{code:"unknown"}; }
  s.busy=false;
  if (r && r.ok) adoptShop(r);
  if (state!==s) return;
  if (err || !r || !r.ok){ s.msg=SHOP_ERR[err && err.code] || "Das hat nicht geklappt. Versuch es nochmal."; render(); return; }
  s.data=r; s.msg=""; sfx("tap"); render();
}

async function startRound(){
  if (source==="ai" && sampleOK()){
    state={screen:"loading", abort:false};
    render();
    const token=state;
    try{
      const qs=await drawAI();
      if (token.abort || state!==token) return;
      beginWith(qs);
    }catch(e){
      if (token.abort || state!==token) return;
      const code=e && e.code;

      <div class="cat" aria-hidden="true">${catIcon(Q.k)}</div>
      <div class="qtext">${questionHTML(Q.q)}</div>
      ${ringHTML(leftNow, state.phase==="ask"?"":"frozen")}
    </div>
    <p class="known">${I_BOOK}<span>Wir kennen ${known} richtige Antworten${aiCheckOn()?" – alle anderen prüft Claude":""}.</span></p>
    </div>
    ${body}
    </div>
  </section>`;
  if (state.phase==="ask"){
    const inp=$("ans");
    inp.focus({preventScroll:true});
    $("ansForm").onsubmit=ev=>{ ev.preventDefault(); submit(inp.value); };
    $("pass").onclick=()=>finish(null,"pass");
    tick(); timerId=setInterval(tick,100);
  } else {
    $("next").onclick=next;
    if (state.animDone){
      const nx=$("next");
      nx.focus({preventScroll:true});
      try{ if (nx.getBoundingClientRect().bottom>window.innerHeight-12) nx.scrollIntoView({behavior:REDUCED?"auto":"smooth", block:"end"}); }catch(e){}
      if (state.celebrate){ state.celebrate=false; celebrate(state.results[state.i].tier); }
    } else runDig(state.results[state.i]);
  }
}

function tick(){
  if (state.screen!=="play" || state.phase!=="ask" || state.checking) return;
  const left=Math.max(0, deadline-Date.now());
  const ring=$("ring"), fg=$("rfg"), num=$("tnum"), sec=Math.ceil(left/1000);
  if (fg) fg.setAttribute("stroke-dashoffset", (CIRC*(1-left/(SECONDS*1000))).toFixed(2));
  if (num) num.textContent=sec;
  if (ring) ring.classList.toggle("low", left<8000);
  if (left>0 && sec<=5 && sec!==state.tickSec){ state.tickSec=sec; sfx("tick"); }
  if (left<=0) finish(null,"timeout");
}

function bad(msg, tried){
  state.fb=msg; state.fbBad=true;
  sfx("wrong"); buzz(50);
  if (tried && !state.tries.includes(tried)) state.tries.push(tried);
  const fb=$("fb"), inp=$("ans"), tries=$("tries");
  if (fb){ fb.className="fb bad"; fb.textContent=msg; }
  if (tries) tries.innerHTML=state.tries.map(t=>`<span class="try">${esc(t)}</span>`).join("");
  if (inp){ inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.focus({preventScroll:true}); inp.select(); }
}

function setChecking(on, raw){
  const inp=$("ans"), send=$("send"), ring=$("ring"), fb=$("fb"), num=$("tnum");
  if (inp) inp.disabled=on;
  if (send) send.disabled=on;
  if (ring) ring.classList.toggle("paused", on);
  if (on){
    if (num) num.textContent="II";
    if (fb){ fb.className="fb"; fb.innerHTML=`<span class="spin" aria-hidden="true"></span><span>Claude prüft „${esc(raw)}“ … Die Uhr ist angehalten.</span>`; }
  } else {
    if (fb){ fb.className="fb"; fb.textContent=""; }
    if (inp) inp.focus({preventScroll:true});
    tick();
  }
}

function submit(val){
  if (state.phase!=="ask" || state.checking) return;
  const Q=state.qs[state.i];
  const typed=String(val).trim();
  const res=judge(Q, typed);
  if (res.type==="empty") return;
  if (res.type==="ok") return finish({e:res.e, typed, fuzzy:!!res.fuzzy, via:"list"}, "ok");
  if (res.type==="nope") return bad(res.msg+" Versuch’s nochmal.", typed);
  const n=norm(typed);
  if (Q.aiNo.has(n)) return bad(Q.aiNo.get(n)+" Versuch’s nochmal.", typed);
  if (aiCheckOn()) return aiCheck(Q, typed);
  bad(`„${typed}“ steht nicht auf unserer Liste. Probier was anderes.`, typed);
}

async function aiCheck(Q, typed){
  const tok={}; state.checkTok=tok; state.checking=true;
  const remaining=Math.max(1000, deadline-Date.now());
  setChecking(true, typed);
  let v=null, err=null;
  try{ v=await sample.json(checkPrompt(Q, typed), {modelTier:"default", cache:false}); }catch(e){ err=e||{}; }
  if (state.checkTok!==tok || state.screen!=="play" || state.phase!=="ask") return;
  state.checking=false; state.checkTok=null;
  deadline=Date.now()+remaining;
  setChecking(false);
  if (err){
    if (err.code==="not_granted"){ aiDenied=true; return bad("Die KI-Prüfung wurde nicht erlaubt. Ohne sie zählen nur Antworten von unserer Liste.", typed); }
    if (err.code==="rate_limited") return bad("Claude braucht gerade eine Pause. Diese Antwort steht nicht auf unserer Liste – probier eine andere.", typed);
    return bad("Die Prüfung hat nicht geklappt. Diese Antwort steht nicht auf unserer Liste – probier eine andere.", typed);
  }
  const verdict=interpret(Q, typed, v);
  if (verdict.type==="ok") return finish(verdict.hit, "ok");
  if (verdict.type==="nope") return bad(verdict.msg+" Versuch’s nochmal.", typed);
  Q.aiNo.set(norm(typed), verdict.msg);
  bad(verdict.msg+" Versuch’s nochmal.", typed);
}

function interpret(Q, typed, v){
  if (!v || typeof v!=="object") return {type:"no", msg:"Claude konnte die Antwort nicht einordnen."};
  const grund=typeof v.grund==="string" ? v.grund.trim().slice(0,220) : "";
  const meant=typeof v.gemeint==="string" ? v.gemeint.trim().slice(0,60) : "";
  if (typeof v.liste==="string" && v.liste.trim()){
    const e=Q.exact.get(norm(v.liste));
    if (e) return {type:"ok", hit:{e, typed, fuzzy:true, via:"ai-match"}};
  }
  if (meant){
    const r2=judge(Q, meant);
    if (r2.type==="ok") return {type:"ok", hit:{e:r2.e, typed, fuzzy:true, via:"ai-match"}};
    if (r2.type==="nope") return {type:"nope", msg:r2.msg};
  }
  if (v.richtig===true){
    let tier=Math.round(Number(v.stufe)); if (!Number.isFinite(tier)) tier=3;
    tier=Math.min(4, Math.max(0, tier));
    const name=meant || typed;
    const ns=[...new Set([norm(name), norm(typed)].filter(Boolean))];
    const e={name, tier, ns, ai:true};
    Q.entries.push(e); ns.forEach(n=>{ if (!Q.exact.has(n)) Q.exact.set(n,e); });
    return {type:"ok", hit:{e, typed, fuzzy:norm(name)!==norm(typed), via:"ai-new", grund}};
  }
  return {type:"no", msg:"Claude sagt: "+(grund || "Das ist keine richtige Antwort auf diese Frage.")};
}

function finish(hit, how){
  if (state.phase!=="ask") return;
  clearInterval(timerId); timerId=null;
  state.checking=false; state.checkTok=null;
  const Q=state.qs[state.i];
  state.left = how==="timeout" ? 0 : Math.max(0, Math.ceil((deadline-Date.now())/1000));
  const r = hit ? {tier:hit.e.tier, pts:TIERS[hit.e.tier].pts, name:hit.e.name, typed:hit.typed, fuzzy:!!hit.fuzzy, via:hit.via||"list", grund:hit.grund||"", how}
                : {tier:-1, pts:0, name:null, typed:null, via:"", grund:"", how};
  r.q=Q.q;
  r.rarer=rarerPicks(Q, r.tier, hit && hit.e);
  if (r.tier===-1) r.classics=shuffle(Q.entries.filter(e=>e.tier===0 && !e.ai)).slice(0,3).map(e=>e.name);
  state.results[state.i]=r;
  if (state.daily) queueOwn(state.daily.key, {score:state.results.reduce((s,x)=>s+x.pts,0), tiers:state.results.map(x=>x.tier)});
  if (state.duel) saveDuel(state.duel, state.results, false);
  state.phase="reveal"; state.fb=""; state.fbBad=false;
  state.animDone = r.tier<0 || REDUCED;
  state.celebrate = !REDUCED && r.tier>=3;
  if (r.tier<0){ sfx(how==="timeout" ? "timeout" : "pass"); if (how==="timeout") buzz([60,50,60]); }
  else if (state.animDone) sfx("land", r.tier);
  revealAt=Date.now();
  render();
}

function rarerPicks(Q, tier, own){
  const pool=Q.entries.filter(e=>e!==own && !e.ai && e.tier>tier);
  if (!pool.length) return [];
  const top=Math.max(...pool.map(e=>e.tier));
  return shuffle(pool.filter(e=>e.tier>=Math.max(tier+1, top-1))).slice(0,4).map(e=>({name:e.name, tier:e.tier}));
}

/* ---------- Animation ---------- */
const easeInOut=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const easeOut=p=>1-Math.pow(1-p,3);
const easeOutBack=p=>{ const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2); };
function tween(from,to,ms,ease,update,tok){
  return new Promise(res=>{
    const t0=performance.now();
    (function f(now){
      if (tok.skip){ update(to); return res(); }
      const p=Math.min(1,Math.max(0,(now-t0)/ms)); update(from+(to-from)*ease(p));
      if (p<1) requestAnimationFrame(f); else res();
    })(t0);
  });
}
function pause(ms,tok){ return new Promise(res=>{ const t0=performance.now(); (function f(now){ if (tok.skip || now-t0>=ms) return res(); requestAnimationFrame(f); })(t0); }); }

function strawBurst(host, y, n){
  if (REDUCED || !host) return;
  for (let k=0;k<n;k++){
    const s=document.createElement("i"); s.className="straw";
    s.style.left=(18+Math.random()*74)+"%"; s.style.top=(y*20)+"%";
    s.style.setProperty("--dx",(Math.random()*70-35).toFixed(0)+"px");
    s.style.setProperty("--dy",(-12-Math.random()*34).toFixed(0)+"px");
    s.style.setProperty("--r",(Math.random()*540-270).toFixed(0)+"deg");
    s.style.setProperty("--c",`var(--t${Math.floor(Math.random()*2)})`);
    host.appendChild(s); setTimeout(()=>s.remove(), 900);
  }
}
function celebrate(tier){
  if (REDUCED) return;
  cheerCharms();
  const card=$("vcard"); if (!card) return;
  const b=card.getBoundingClientRect();
  const fx=document.createElement("div"); fx.className="fx"; fx.setAttribute("aria-hidden","true");
  const n=tier===4?70:28;
  for (let k=0;k<n;k++){
    const s=document.createElement("i");
    s.style.left=(b.left+b.width*(.15+Math.random()*.7))+"px"; s.style.top=(b.top+b.height*.5)+"px";
    const ang=Math.random()*Math.PI*2, dist=60+Math.random()*(tier===4?220:140);
    s.style.setProperty("--dx",(Math.cos(ang)*dist).toFixed(0)+"px");
    s.style.setProperty("--dy",(Math.sin(ang)*dist-40).toFixed(0)+"px");
    s.style.setProperty("--r",(Math.random()*720-360).toFixed(0)+"deg");
    s.style.setProperty("--c",`var(--t${[0,1,3,4][Math.floor(Math.random()*4)]})`);
    s.style.animationDelay=(Math.random()*120).toFixed(0)+"ms";
    fx.appendChild(s);
  }
  document.body.appendChild(fx); setTimeout(()=>fx.remove(), 1500);
}

async function runDig(r){
  const tok={skip:false}; digTok=tok;
  const digEl=$("dig"), probe=$("probe"), shaft=$("shaft");
  const bands=[...digEl.querySelectorAll(".band")], pts=$("digPts"), lbl=$("digLbl"), depth=$("digDepth");
  let entered=-1;
  const set=y=>{ probe.style.top=(y*20)+"%"; depth.textContent=Math.max(0,Math.round(y*40))+" cm"; };
  const enter=i=>{
    if (i<=entered) return; entered=i;
    bands.forEach((b,j)=>{ b.classList.toggle("active", j===i); b.classList.toggle("passed", j<i); });
    pts.textContent="+"+TIERS[i].pts; lbl.textContent=TIERS[i].name;
    pts.classList.remove("bump"); void pts.offsetWidth; pts.classList.add("bump");
    if (i>0 && !tok.skip) strawBurst(shaft, i, 12);
    if (!tok.skip) sfx("layer", i);
  };
  const track=y=>{ set(y); if (y>0.02) enter(Math.min(4,Math.floor(y))); };
  const skip=()=>{ tok.skip=true; };
  const onKey=ev=>{ if (ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); skip(); } };
  digEl.addEventListener("click", skip);
  document.addEventListener("keydown", onKey);
  let y=0;
  try{
    for (let i=0;i<=r.tier;i++){
      await tween(y, i+.5, i===0?450:280, i===0?easeInOut:easeOut, track, tok); y=i+.5;
      if (i===4) break;
      await tween(y, i+.9, 340, easeOut, track, tok); y=i+.9;
      probe.classList.add("strain");
      await pause(180+Math.random()*480, tok);
      probe.classList.remove("strain");
      if (i===r.tier){ await tween(y, i+.5, 450, easeOutBack, set, tok); y=i+.5; }
    }
    if (digTok===tok){
      sfx("land", r.tier); buzz(r.tier>=3 ? [20,40,70] : 18);
      if (!tok.skip && r.tier>=2){ shaft.classList.remove("shake"); void shaft.offsetWidth; shaft.classList.add("shake"); }
    }
    if (!tok.skip) await pause(r.tier===4?650:300, tok);
  } finally {
    document.removeEventListener("keydown", onKey);
  }
  if (digTok!==tok || state.screen!=="play" || state.phase!=="reveal") return;
  digTok=null;
  state.animDone=true; state.bumpPts=true; revealAt=Date.now();
  render();
}

function next(){
  if (Date.now()-revealAt<350) return;
  if (state.i<state.qs.length-1){ state.i++; startQuestion(); }
  else endRound();
}

/* ---------- Rundenende ---------- */
function endRound(){
  const total=state.results.reduce((s,r)=>s+r.pts,0);
  const prevBest=stats.best, first=stats.rounds===0;
  stats.rounds++; stats.best=Math.max(stats.best,total);
  stats.needles+=state.results.filter(r=>r.tier===4).length;
  saveStats();
  const dly=state.daily, dl=state.duel;
  state={screen:"end", results:state.results, qs:state.qs, total, newBest:!first && total>prevBest, daily:dly, duel:dl, fresh:true};
  render();
  if (dly) saveDailyDone();
  else if (dl) saveDuelDone();
  else saveFreeDone();
}

function saveDailyDone(){

    const w=$("saveWarn"); if (w) w.hidden = res===true;

}

}

  view.innerHTML=`
  <section class="card stack end">
    <span class="label">${dly?"Tagesrätsel "+dayLabel(dly.key)+" · geschafft":dl?"Duell "+dl.code+" · geschafft":"Classic · Runde vorbei"}${state.newBest?" · neuer Bestwert!":""}</span>
    <div class="endtop">
      <div><div class="total"><b id="totalNum">${fresh?0:state.total}</b><span> / ${ROUND_LEN*100}</span></div>${acc?`<div class="xprow"><span class="xpchip" id="xpGain"${xpNow?"":" hidden"}>+${xpNow} XP</span><span class="xpchip tok" id="tokGain" hidden></span></div>`:""}</div>
      <div class="badge">${ticonHTML(ri)}<div><h2>${title}</h2><p class="hint">${sub}</p></div></div>
    </div>
    <div class="chart" role="img" aria-label="Wie tief jede Antwort eingesunken ist">
      ${state.results.map((r,j)=>`<div class="col">
        <div class="cpts">${r.pts}</div>
        <div class="cells">${[0,1,2,3,4].map(t=>`<div class="cell${t<=r.tier?" on":""}" style="${tierVars(t)};--c:${j};--t:${t}">${t===r.tier?tierIcon(t):""}</div>`).join("")}</div>
        <div class="cq">Frage ${j+1}</div></div>`).join("")}
    </div>
    <ul class="sum">${state.results.map(r=>`
      <li>${r.tier>=0?ticonHTML(r.tier):`<span class="ticon" style="--tc:var(--bg);--tt:var(--muted)">${r.how==="pass"?I_FLAG:I_CLOCK}</span>`}
        <span class="sq">${esc(r.q)}</span>
        <span class="sp">${r.pts}</span>
        <span class="sa">${r.tier>=0?`${esc(r.name)} · ${TIERS[r.tier].name}${r.via==="ai-new"?`<span class="tagai">von Claude geprüft</span>`:""}`:(r.how==="pass"?"gepasst":"Zeit abgelaufen")}</span></li>`).join("")}
    </ul>
    <div class="endacts stack">${actions}</div>
    <div id="shareBox" hidden><textarea class="share" id="shareTxt" rows="2" readonly aria-label="Ergebnis zum Kopieren">${esc(shareText)}</textarea></div>
  </section>`;
  $("again").onclick=startRound;
  if ($("endReg")) $("endReg").onclick=()=>openAuth({to:"start"}, "register");
  if (fresh){
    const s0=state;
    countUp($("totalNum"), state.total, 900);
    sfx(ri>=3 ? "win" : "point");
    if (ri>=3 || state.newBest) setTimeout(()=>{ if (state===s0) confetti($("totalNum"), ri>=4?80:46); }, 520);
  }
  if ($("menu")) $("menu").onclick=()=>{ state={screen:"start"}; render(); };
  if (dly){
    $("toBoard").onclick=()=>openBoard(dly.key);
    $("saveRetry").onclick=()=>{ $("saveWarn").hidden=true; saveDailyDone(); };
  }
  if (dl){
    $("toDuel").onclick=()=>openDuel(dl.code);
    $("saveRetry").onclick=()=>{ $("saveWarn").hidden=true; saveDuelDone(); };
    if (dl.role==="a") wireShare(dl.code, dl.me);
  }
  if ($("share")) $("share").onclick=ev=>{
    const btn=ev.currentTarget;
    const fallback=()=>{ $("shareBox").hidden=false; const ta=$("shareTxt"); ta.focus(); ta.select(); btn.textContent="Markiert – jetzt kopieren"; };
    try{ navigator.clipboard.writeText(shareText).then(()=>{ btn.textContent="Kopiert"; }, fallback); }catch(e){ fallback(); }
  };
}

$("home").onclick=ev=>{ ev.preventDefault(); if (state.screen!=="loading"){ state={screen:"start"}; render(); } };

/* ======================= Start ======================= */
function start(data){
  const s=data && data.state;
  paintThemeColor();
  updateHeader();
  if (account()) refreshMe(true);
  const dq=duelParam();
  if (dq){ openDuel(dq); return; }
  const pq=profileParam();
  if (pq){ openProfile(pq); return; }
  if (s && s.screen==="board" && typeof s.key==="string"){
    if (dbReady){ openBoard(s.key); return; }
    pendingBoard=s.key; render(); return;
  }
  if (s && s.screen==="play" && Array.isArray(s.qsIdx)){
    try{
      const qs=s.qsIdx.map(getQ).filter(Boolean);
      if (qs.length===s.qsIdx.length && qs.length){
        state={screen:"play", qs, i:s.i|0, results:Array.isArray(s.results)?s.results:[], phase:"ask", fb:"", fbBad:false, tries:[], checking:false, daily:s.daily||null};
        if (state.results[state.i]){ state.phase="reveal"; state.animDone=true; state.left=0; revealAt=0; render(); return; }
        startQuestion(); return;
      }
    }catch(e){}
  }
  render();
}
try{
  window.claude?.hot?.snapshot?.(()=>{
    if (state.screen==="play" && state.qs.every(q=>q.src==="bank")) return {state:{screen:"play", qsIdx:state.qs.map(q=>q.idx), i:state.i, results:state.results, daily:state.daily}};
    if (state.screen==="board") return {state:{screen:"board", key:state.key}};
    return {};
  });
}catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
