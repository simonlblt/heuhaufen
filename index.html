<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Heuhaufen – das Ratespiel, bei dem seltene Antworten die meisten Punkte bringen. Mit Tagesrätsel und Bestenliste.">
<title>Heuhaufen</title>
<meta name="theme-color" content="#F5D55E">
<script>try{var t=localStorage.getItem("heuhaufen:theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M4 34C8 18 14 12 20 11c6 1 12 7 16 23Z' fill='%23F7C948' stroke='%231D1705' stroke-width='2.2'/%3E%3Cpath d='M8 6L30 27' stroke='%233046D8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<style id="pageStyle">
/* Layout: eine Spielsäule auf Strohgrund. Leitmotiv ist der Schnitt durch den Heuhaufen: fünf Schichten von Heuballen (oben) bis Nadel (unten). */
:root{
  --bg:#F5D55E; --bg-deep:#E6BD3A; --surface:#FFF8DE; --surface-2:#FFEEB2; --ink:#1D1705; --muted:#6A5A20; --line:#D8BC55;
  --thread:#3046D8; --thread-2:#6A3FE0; --thread-ink:#FFFFFF; --accent:#3046D8;
  --hot:#EE6A1F; --gold:#F7C948; --shade:#1D1705;
  --warn:#C23A1E; --ok:#2E8540;
  --t0:#E3BC3F; --t1:#D9961D; --t2:#6FA034; --t3:#11998B; --t4:#3046D8;
  --tt0:#1D1705; --tt1:#1D1705; --tt2:#FFFFFF; --tt3:#FFFFFF; --tt4:#FFFFFF;
  --halo:rgba(255,248,214,.85); --cardglow:0 0 0 rgba(0,0,0,0);
  --mode-off:5px; --mode-glow:0; --mode-border:#1D1705;
  --font-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#100D06; --bg-deep:#060401; --surface:#1C170B; --surface-2:#282110; --ink:#FFF0C0; --muted:#BBAA6A; --line:#4A3E1D;
    --thread:#5262F0; --thread-2:#8A55EE; --thread-ink:#FFFFFF; --accent:#9AA8FF;
    --hot:#FF8A3D; --gold:#FFD45E; --shade:#B98A1C;
    --warn:#FF8366; --ok:#6FD487;
    --t0:#CDA93B; --t1:#E6A92C; --t2:#8FC653; --t3:#29C4B2; --t4:#8390FF;
    --tt0:#1A1405; --tt1:#1A1405; --tt2:#10210A; --tt3:#04211E; --tt4:#0A0F33;
    --halo:rgba(247,201,72,.16); --cardglow:0 0 90px rgba(247,201,72,.07);
    --mode-off:0px; --mode-glow:1; --mode-border:rgba(255,255,255,.18);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#100D06; --bg-deep:#060401; --surface:#1C170B; --surface-2:#282110; --ink:#FFF0C0; --muted:#BBAA6A; --line:#4A3E1D;
  --thread:#5262F0; --thread-2:#8A55EE; --thread-ink:#FFFFFF; --accent:#9AA8FF;
  --hot:#FF8A3D; --gold:#FFD45E; --shade:#B98A1C;
  --warn:#FF8366; --ok:#6FD487;
  --t0:#CDA93B; --t1:#E6A92C; --t2:#8FC653; --t3:#29C4B2; --t4:#8390FF;
  --tt0:#1A1405; --tt1:#1A1405; --tt2:#10210A; --tt3:#04211E; --tt4:#0A0F33;
  --halo:rgba(247,201,72,.16); --cardglow:0 0 90px rgba(247,201,72,.07);
  --mode-off:0px; --mode-glow:1; --mode-border:rgba(255,255,255,.18);
  color-scheme:dark;
}
:root[data-theme="light"]{ color-scheme:light }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 48px;
  background-image:
    repeating-linear-gradient(115deg, transparent 0 22px, color-mix(in srgb, var(--bg-deep) 55%, transparent) 22px 23px),
    repeating-linear-gradient(68deg, transparent 0 37px, color-mix(in srgb, var(--bg-deep) 40%, transparent) 37px 38px);
}
.app{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink)}
.brand svg{width:34px; height:34px; flex:none}
.brand b{font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:-.02em}
.best{font-family:var(--font-mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.best strong{color:var(--ink)}
.card{background:var(--surface); border:2px solid var(--ink); border-radius:var(--r); padding:24px; box-shadow:5px 5px 0 var(--shade); min-width:0}
@media (max-width:480px){ .card{padding:18px; box-shadow:4px 4px 0 var(--shade)} }
h1,h2{font-family:var(--font-display); text-wrap:balance; margin:0; letter-spacing:-.02em}
h1{font-size:clamp(34px, 7vw, 52px); line-height:1.02; font-weight:800}
h2{font-size:clamp(24px, 5vw, 32px); line-height:1.12; font-weight:700}
p{margin:0}
ul{margin:0; padding:0}
.lede{font-size:18px; color:var(--muted); max-width:52ch}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.label{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.hint{font-size:13px; color:var(--muted)}

/* Buttons */
button{font:inherit; cursor:pointer}
.btn{appearance:none; border:2px solid var(--ink); background:var(--thread); color:var(--thread-ink); font-family:var(--font-display); font-weight:700; font-size:18px; padding:12px 22px; border-radius:999px; box-shadow:3px 3px 0 var(--shade); transition:transform .08s ease, box-shadow .08s ease}
.btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shade)}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shade)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:none}
.btn.ghost:hover{background:color-mix(in srgb, var(--ink) 8%, transparent); transform:none}
.btn.small{font-size:15px; padding:8px 16px}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none; box-shadow:3px 3px 0 var(--shade)}
:focus-visible{outline:3px solid var(--thread); outline-offset:3px}

/* Symbole */
.ti{display:block}
.ticon{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--tc); color:var(--tt); border:2px solid var(--ink); flex:none}
.ticon svg{width:20px; height:20px}
.mini{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--tc); color:var(--tt); flex:none}
.mini svg{width:14px; height:14px}

/* Start */
.hero-grid{display:grid; grid-template-columns:minmax(0,1fr) 190px; gap:20px; align-items:center}
.hero-art svg{width:100%; height:auto; display:block}
@media (max-width:560px){ .hero-grid{grid-template-columns:1fr} .hero-art{order:-1; width:150px} }
.hay .spark{transform-box:fill-box; transform-origin:center; animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.55); opacity:.5}50%{transform:scale(1.15); opacity:1}}
.hay .fly{animation:float 3s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.example{border:2px dashed var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; background:var(--bg)}
.ex-q{font-family:var(--font-display); font-weight:700; font-size:19px}
.ex-row{display:grid; grid-template-columns:34px minmax(0,1fr) minmax(0,1.1fr) 52px; gap:12px; align-items:center}
.ex-ans{font-weight:700; line-height:1.2; min-width:0}
.ex-ans small{display:block; font-weight:500; font-size:12px; color:var(--muted)}
.meter{height:10px; border:1.5px solid var(--ink); border-radius:999px; overflow:hidden; background:var(--surface)}
.meter i{display:block; height:100%; background:var(--tc); width:var(--w)}
.ex-pts{font-family:var(--font-mono); font-weight:700; text-align:right; font-variant-numeric:tabular-nums}
@media (max-width:480px){ .ex-row{grid-template-columns:34px minmax(0,1fr) 48px} .ex-row .meter{display:none} }
.rules{display:grid; gap:12px}
.rules li{list-style:none; display:grid; grid-template-columns:30px minmax(0,1fr); gap:10px; align-items:start}
.rules svg{width:26px; height:26px; color:var(--ink)}
.settings{display:flex; flex-direction:column; gap:14px; border-top:2px solid var(--ink); padding-top:16px}
.seg{display:inline-flex; border:2px solid var(--ink); border-radius:999px; overflow:hidden; flex-wrap:wrap}
.seg button{border:0; background:transparent; color:var(--ink); padding:8px 14px; font-weight:600; font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.switch{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:start; cursor:pointer; position:relative}
.switch input{position:absolute; opacity:0; width:1px; height:1px}
.sw{width:46px; height:26px; border-radius:999px; border:2px solid var(--ink); background:var(--surface); position:relative; transition:background .2s; margin-top:1px}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--ink); transition:transform .2s}
.switch input:checked + .sw{background:var(--thread)}
.switch input:checked + .sw::after{transform:translateX(20px); background:var(--thread-ink)}
.switch input:focus-visible + .sw{outline:3px solid var(--thread); outline-offset:3px}
.switch small{display:block; color:var(--muted); font-size:13px}
.stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.stat{border-top:2px solid var(--ink); padding-top:8px; min-width:0}
.stat b{display:block; font-family:var(--font-mono); font-size:22px; font-variant-numeric:tabular-nums}
.stat span{font-size:13px; color:var(--muted)}

/* Spiel */
.qhead{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--ink); border-radius:999px; padding:2px 12px 2px 8px; font-size:13px; font-weight:700}
.chip svg{width:16px; height:16px}
.prog{font-family:var(--font-mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.pips{display:flex; gap:5px}
.pip{width:22px; height:8px; border-radius:4px; border:1.5px solid var(--ink)}
.pip.done{background:var(--ink)} .pip.now{background:var(--thread)}
.qrow{display:grid; grid-template-columns:56px minmax(0,1fr) 68px; gap:14px; align-items:center}
.cat{width:56px; height:56px; border-radius:16px; border:2px solid var(--ink); display:grid; place-items:center; background:var(--bg)}
.cat svg{width:30px; height:30px}
.qtext{display:flex; flex-direction:column; gap:10px; align-items:flex-start; min-width:0}
.cond{display:inline-flex; align-items:center; gap:8px; padding:6px 14px 6px 10px; border-radius:12px; background:var(--thread); color:var(--thread-ink); font-weight:700; font-size:15px; line-height:1.3; border:2px solid var(--ink)}
.cond svg{width:16px; height:16px; flex:none}
.question{font-family:var(--font-display); font-weight:800; font-size:clamp(24px, 5.5vw, 36px); line-height:1.08; letter-spacing:-.02em; text-wrap:balance; min-width:0}
.ring{position:relative; width:68px; height:68px}
.ring svg{width:100%; height:100%; display:block}
.ring circle{fill:none; stroke-width:6}
.ring .rbg{stroke:color-mix(in srgb, var(--ink) 14%, transparent)}
.ring .rfg{stroke:var(--thread); stroke-linecap:round; transition:stroke .2s}
.ring.low .rfg{stroke:var(--warn)}
.ring.paused .rfg,.ring.frozen .rfg{stroke:var(--muted)}
.ring span{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--font-mono); font-weight:700; font-size:20px; font-variant-numeric:tabular-nums}
.ring.low span{color:var(--warn)}
.ring.paused span{font-size:14px}
@media (max-width:480px){ .qrow{grid-template-columns:minmax(0,1fr) 60px} .cat{display:none} .ring{width:60px; height:60px} }
.known{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted)}
.known svg{width:16px; height:16px; flex:none}
form.ans{display:flex; gap:10px; flex-wrap:wrap}
form.ans input{flex:1 1 220px; min-width:0; font:inherit; font-size:20px; font-weight:600; padding:12px 16px; border:2px solid var(--ink); border-radius:12px; background:var(--bg); color:var(--ink)}
form.ans input::placeholder{color:var(--muted); font-weight:500}
form.ans input:disabled{opacity:.6}
.fb{min-height:24px; display:flex; gap:10px; align-items:center; font-weight:600}
.fb.bad{color:var(--warn)}
.tries{display:flex; flex-wrap:wrap; gap:6px; min-width:0; flex:1}
.try{font-size:13px; padding:2px 8px; border-radius:6px; border:1px dashed var(--muted); color:var(--muted); text-decoration:line-through; overflow-wrap:anywhere}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.spin{width:20px; height:20px; flex:none; border:3px solid var(--line); border-top-color:var(--thread); border-radius:50%; animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Einsinken */
.reveal{border-top:2px dashed var(--ink); padding-top:18px}
.your{font-size:17px}
.your q{font-weight:700; quotes:"„" "“"}
.dig{border:2px solid var(--ink); border-radius:12px; overflow:hidden; background:var(--surface); cursor:pointer; user-select:none; -webkit-user-select:none}
.digtop{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 14px; border-bottom:2px solid var(--ink); background:var(--bg)}
.dd{display:flex; flex-direction:column; min-width:0}
.dd.right{align-items:flex-end; text-align:right}
.dd b{font-family:var(--font-mono); font-weight:700; font-size:22px; line-height:1.15; font-variant-numeric:tabular-nums; display:inline-block}
.dd b.bump{animation:bump .3s ease-out}
@keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.shaft{position:relative}
.band{height:52px; display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center; padding:0 14px 0 56px; border-top:1.5px dashed var(--line);
  background-color:color-mix(in srgb, var(--tc) 16%, var(--surface));
  background-image:repeating-linear-gradient(104deg, transparent 0 11px, color-mix(in srgb, var(--ink) 7%, transparent) 11px 12px);
  color:var(--muted); transition:background-color .2s ease, color .2s ease}
.band:first-child{border-top:0}
.band svg{width:22px; height:22px}
.band .bn{font-family:var(--font-display); font-weight:700; font-size:16px}
.band .bp{font-family:var(--font-mono); font-size:14px; font-variant-numeric:tabular-nums}
.band.passed{color:var(--ink)}
.band.active{background-color:var(--tc); color:var(--tt); animation:flash .45s ease-out}
@keyframes flash{0%{filter:brightness(1.35) saturate(1.2)}100%{filter:none}}
.probe{position:absolute; left:0; top:0; width:56px; height:0; pointer-events:none; z-index:2}
.probe svg{position:absolute; left:4px; top:-9px; width:46px; height:18px; overflow:visible}
.probe.strain svg{animation:strain .09s linear infinite alternate}
@keyframes strain{from{transform:translate(-1px,-1px) rotate(-4deg)}to{transform:translate(1px,1px) rotate(4deg)}}
.dig.found .band[data-i="4"]{animation:glow 1s ease-in-out 3}
@keyframes glow{0%,100%{box-shadow:inset 0 0 0 0 var(--surface)}50%{box-shadow:inset 0 0 0 5px var(--surface)}}
.dig .skip{text-align:center; padding:6px 10px; border-top:1px solid var(--line); margin:0}
.straw{position:absolute; width:3px; height:13px; border-radius:2px; background:var(--c); pointer-events:none; z-index:3; animation:burst .8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0deg); opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)); opacity:0}}
.fx{position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden}
.fx i{position:absolute; width:5px; height:16px; border-radius:2px; background:var(--c); animation:burst 1.2s cubic-bezier(.15,.7,.3,1) forwards}

/* Ergebnis einer Frage */
.vcard{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center; padding:16px; border:2px solid var(--ink); border-radius:14px; background:var(--tc); color:var(--tt)}
.vcard.miss{background:var(--bg); color:var(--ink)}
.vicon{width:64px; height:64px; border-radius:50%; background:var(--surface); color:var(--ink); display:grid; place-items:center; border:2px solid var(--ink)}
.vicon svg{width:38px; height:38px}
.vlabel{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.85}
.vname{font-family:var(--font-display); font-weight:800; font-size:clamp(28px, 6vw, 40px); line-height:1.02}
.vpts{font-family:var(--font-mono); font-weight:700; font-size:19px}
.crowdbox{display:flex; flex-direction:column; gap:6px; max-width:128px}
.crowdbox small{font-size:12px; line-height:1.25; font-weight:600}
.crowd{display:grid; grid-template-columns:repeat(10, 8px); gap:3px}
.crowd i{width:8px; height:8px; border-radius:50%; background:color-mix(in srgb, var(--tt) 22%, transparent)}
.crowd i.on{background:var(--tt)}
.crowd i.you{background:var(--surface); box-shadow:0 0 0 2px var(--tt)}
@media (max-width:560px){ .vcard{grid-template-columns:auto minmax(0,1fr)} .crowdbox{grid-column:1 / -1; flex-direction:row; align-items:center; max-width:none; gap:12px} }
.note{display:flex; gap:10px; align-items:flex-start; font-size:15px; padding:10px 12px; border-radius:10px; background:var(--bg); border:1.5px solid var(--line)}
.note svg{flex:none; width:20px; height:20px; color:var(--thread); margin-top:2px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.ach{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--ink); border-radius:999px; padding:3px 10px 3px 3px; font-size:14px; background:var(--bg)}
.ach small{font-family:var(--font-mono); color:var(--muted)}

/* Rundenende */
.endtop{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.total{font-family:var(--font-mono); font-weight:700; font-size:clamp(48px, 14vw, 84px); line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.04em}
.total span{font-size:.4em; color:var(--muted); letter-spacing:0}
.badge{display:flex; align-items:center; gap:10px}
.chart{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px; padding:14px; border:2px solid var(--ink); border-radius:12px; background:var(--bg)}
.col{display:flex; flex-direction:column; gap:4px; min-width:0}
.cpts{font-family:var(--font-mono); font-weight:700; text-align:center; font-size:14px; font-variant-numeric:tabular-nums}
.cells{display:flex; flex-direction:column; gap:3px}
.cell{height:24px; border-radius:5px; border:1.5px solid color-mix(in srgb, var(--ink) 22%, transparent); background:var(--surface); display:grid; place-items:center; color:var(--tt)}
.cell.on{background:var(--tc); border-color:var(--ink)}
.cell svg{width:15px; height:15px}
.cq{text-align:center; font-size:12px; color:var(--muted); font-weight:700}
.sum{display:flex; flex-direction:column; border-top:2px solid var(--ink)}
.sum li{list-style:none; display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:4px 12px; padding:10px 0; border-bottom:1px solid var(--line); align-items:center}
.sum .ticon{grid-row:1 / span 2}
.sum .sq{font-weight:600; font-size:15px; min-width:0}
.sum .sa{font-size:14px; color:var(--muted); min-width:0; overflow-wrap:anywhere}
.sum .sp{grid-row:1 / span 2; grid-column:3; font-family:var(--font-mono); font-weight:700; text-align:right; font-variant-numeric:tabular-nums}
.tagai{display:inline-block; font-size:11px; font-weight:700; padding:0 6px; border-radius:999px; border:1px solid var(--thread); color:var(--thread); margin-left:6px; vertical-align:1px}

.dnote{grid-column:1 / -1; font-size:13px; color:var(--muted)}
.sharebox{display:flex; flex-direction:column; gap:8px; padding:16px; border:2px dashed var(--ink); border-radius:14px; background:var(--bg)}
.linkrow{display:flex; gap:10px; flex-wrap:wrap}
.linkrow input{flex:1 1 220px; min-width:0; font-family:var(--font-mono); font-size:15px; padding:10px 12px; border:2px solid var(--ink); border-radius:10px; background:var(--surface); color:var(--ink)}

/* Kopfzeile: Profil-Knopf */
.topright{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.profbtn{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--ink); border-radius:999px; background:var(--surface); color:var(--ink); padding:4px 12px 4px 8px; font-weight:700; font-size:14px; box-shadow:2px 2px 0 var(--shade)}
.profbtn svg{width:18px; height:18px}
.profbtn:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--shade)}
/* Profil */
.plink{font:inherit; font-family:var(--font-mono); font-weight:700; letter-spacing:.06em; color:inherit; background:none; border:0; padding:0; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; cursor:pointer}
.plink:hover{color:var(--thread)}
.vside.won .plink:hover,.brow.me .plink:hover{color:inherit; opacity:.8}
.phead{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px 18px; align-items:center}
.phead h2 .tagname{font-size:1.15em}
.ptiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(118px,1fr)); gap:10px}
.ptile{border:2px solid var(--ink); border-radius:12px; padding:10px 12px; background:var(--bg); display:flex; flex-direction:column; gap:2px; min-width:0}
.ptile b{font-family:var(--font-mono); font-size:26px; line-height:1.15; font-variant-numeric:tabular-nums}
.ptile span{font-size:13px; color:var(--muted)}

.ptile.hl span{color:inherit; opacity:.85}
.ptiles.small{grid-template-columns:repeat(auto-fit, minmax(96px,1fr))}
.ptiles.small .ptile b{font-size:21px}
.wlbar{display:flex; height:14px; border:2px solid var(--ink); border-radius:999px; overflow:hidden; background:var(--surface)}
.wlbar i{display:block; min-width:0}
.wlbar .w,.wllegend .w{background:var(--ok)}
.wlbar .d,.wllegend .d{background:var(--t0)}
.wlbar .l,.wllegend .l{background:var(--warn)}
.wllegend{display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.wllegend i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; border:1px solid var(--ink)}
.pcols{display:grid; gap:24px}
.pcols h3{font-family:var(--font-display); font-size:21px; margin:0 0 10px; letter-spacing:-.01em}
.pcols h3 small{font-family:var(--font-body); font-weight:500; font-size:13px}
.mhist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.mrow{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:6px 12px; align-items:center; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--bg)}
.mres{font-weight:800; font-size:12px; letter-spacing:.04em; text-transform:uppercase; padding:3px 10px; border-radius:999px; border:2px solid var(--ink); background:var(--surface); white-space:nowrap; text-align:center; min-width:96px}
.r-win .mres{background:var(--ok); color:var(--surface)}
.r-loss .mres{background:var(--warn); color:var(--surface)}
.r-draw .mres{background:var(--t0); color:var(--tt0)}
.mvs{display:flex; flex-direction:column; min-width:0; font-weight:600}
.mvs small{font-weight:500; color:var(--muted); font-size:13px}
.mdate{font-size:13px; color:var(--muted); white-space:nowrap}
.mopen{grid-column:2 / -1; justify-self:start; padding:5px 12px; font-size:14px}
.rivals{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.rivals li{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:12px; align-items:center; padding:8px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--bg)}
.rivals b{font-family:var(--font-mono); font-size:16px}
.rivals .plink{justify-self:start; text-align:left}
@media (max-width:560px){ .ptiles.small{grid-template-columns:repeat(2, minmax(0,1fr))} }
.brow .tag.plink{font-size:22px; letter-spacing:.12em; text-decoration-thickness:2px}

/* Anmeldung */
.authform{display:flex; flex-direction:column; gap:8px; max-width:440px}
.authform label{font-weight:700; margin-top:6px}
.authform input{font:inherit; font-size:20px; font-weight:600; padding:11px 14px; border:2px solid var(--ink); border-radius:12px; background:var(--bg); color:var(--ink); min-width:0}
.authform .row{margin-top:8px}
.brow .tag{font-size:19px; letter-spacing:.04em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}
.brow .tag.plink{font-size:19px; letter-spacing:.04em}
.vside .tagname{font-size:clamp(16px, 4.6vw, 24px); overflow-wrap:anywhere; letter-spacing:.03em}
.drecent .chipbtn{letter-spacing:.06em}

/* Desktop: die Breite nutzen */
@media (min-width: 960px){
  body{padding-block:28px 56px}
  .app{max-width:1180px; gap:24px}
  .card{padding:32px}
  .card.narrow{max-width:820px; width:100%; margin-inline:auto}
  /* Frage: links Frage und Eingabe, rechts der Schacht */
  .playgrid{display:grid; grid-template-columns:minmax(0,1fr) 340px; grid-template-areas:"pq side" "your side" "body side" "after side"; grid-template-rows:auto auto auto 1fr; column-gap:40px; row-gap:0; align-items:start}
  .pq{grid-area:pq; display:flex; flex-direction:column; gap:16px}
  .pyour{grid-area:your; margin-top:20px}
  .pbody{grid-area:body; margin-top:20px}
  .pafter{grid-area:after; margin-top:20px}
  .playgrid > .pside{grid-area:side; display:block; position:sticky; top:20px}
  .pside .band{height:68px}
  .pside .band .bn{font-size:18px}
  .question{font-size:46px}
  form.ans input{font-size:22px; padding:14px 18px}
  /* Rundenende: links Ergebnis und Diagramm, rechts die Antworten */
  .card.end{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); grid-template-areas:"lab lab" "top sum" "chart sum" "acts sum" "share share"; column-gap:40px; row-gap:18px; align-items:start}
  .card.end > .label{grid-area:lab}
  .card.end > .endtop{grid-area:top}
  .card.end > .chart{grid-area:chart}
  .card.end > .sum{grid-area:sum}
  .card.end > .endacts{grid-area:acts}
  .card.end > #shareBox{grid-area:share}
  .card.end .cell{height:30px}
  /* Bestenliste: links die Liste, rechts dein Ergebnis und die Knöpfe */
  .bgrid{display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:32px; align-items:start}
  .bmain,.bside{display:flex; flex-direction:column; gap:16px}

  .pcols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); align-items:start; gap:36px}
  .mrow{grid-template-columns:auto minmax(0,1fr) auto auto}
  .mopen{grid-column:auto}
}
.hero-art{-webkit-user-select:none; user-select:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.hero-art .egg{display:block; width:100%; max-width:210px; margin-inline:auto; aspect-ratio:1 / 1; object-fit:cover; object-position:50% 35%; border-radius:50%; border:3px solid var(--ink); box-shadow:5px 5px 0 var(--shade); background:var(--surface); animation:eggpop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes eggpop{0%{transform:scale(.3) rotate(-25deg); opacity:0}100%{transform:none; opacity:1}}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(1000px 460px at 50% -80px, var(--halo), transparent 72%),
    repeating-linear-gradient(115deg, transparent 0 22px, color-mix(in srgb, var(--bg-deep) 55%, transparent) 22px 23px),
    repeating-linear-gradient(68deg, transparent 0 37px, color-mix(in srgb, var(--bg-deep) 40%, transparent) 37px 38px);
  background-repeat:no-repeat, repeat, repeat;
}
.app{gap:22px}
.card{border-radius:var(--r); box-shadow:6px 6px 0 var(--shade), var(--cardglow)}
@media (max-width:480px){ .card{border-radius:18px; box-shadow:4px 4px 0 var(--shade), var(--cardglow)} }
h1{position:relative; z-index:0}
h1 .hl{position:relative; color:var(--accent); white-space:nowrap}
h1 .hl::after{content:""; position:absolute; left:-3%; right:-3%; bottom:.05em; height:.17em; border-radius:999px; background:linear-gradient(90deg, var(--gold), var(--hot)); z-index:-1; transform:scaleX(0); transform-origin:left center; animation:underline .7s .35s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes underline{to{transform:scaleX(1)}}
h3{font-family:var(--font-display); letter-spacing:-.01em}

/* Bildschirmwechsel */
#view.enter > *{animation:rise .5s cubic-bezier(.2,.9,.3,1.12) both}
#view.enter > *:nth-child(2){animation-delay:.07s}
#view.enter > *:nth-child(3){animation-delay:.14s}
#view.enter > *:nth-child(4){animation-delay:.2s}
#view.enter > *:nth-child(5){animation-delay:.26s}
@keyframes rise{from{opacity:0; transform:translateY(16px) scale(.985)}to{opacity:1; transform:none}}

/* Knöpfe */
.btn{background:linear-gradient(135deg, var(--thread), var(--thread-2)); position:relative; overflow:hidden; isolation:isolate}
.btn::after{content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(110deg, transparent 32%, rgba(255,255,255,.38) 48%, transparent 64%); transform:translateX(-130%); transition:transform .65s ease; pointer-events:none}
.btn:hover::after{transform:translateX(130%)}
.btn.ghost::after,.btn[disabled]::after{display:none}
.btn.big{font-size:20px; padding:14px 28px}
.iconbtn{width:38px; height:38px; flex:none; border-radius:50%; border:2px solid var(--ink); background:var(--surface); color:var(--ink); display:grid; place-items:center; box-shadow:2px 2px 0 var(--shade); padding:0; transition:transform .08s ease, box-shadow .08s ease}
.iconbtn svg{width:19px; height:19px}
.iconbtn:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--shade)}
.iconbtn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--shade)}

/* Kopfzeile */
.brand b{white-space:nowrap}
.topright{flex-wrap:nowrap; gap:8px; min-width:0}
.profbtn{padding:3px 12px 3px 3px; gap:8px; min-width:0; max-width:180px; min-height:38px}
.profbtn.guest{padding:3px 12px 3px 8px}
@media (max-width:620px){ .best{display:none} }

/* Profilbilder */
.av{--s:36px; width:var(--s); height:var(--s); border-radius:50%; flex:none; display:inline-grid; place-items:center; overflow:hidden; background:var(--avc, var(--t0)); color:var(--avt, #1D1705); border:2px solid var(--ink); font-family:var(--font-display); font-weight:800; font-size:calc(var(--s) * .38); line-height:1; letter-spacing:-.02em; -webkit-user-select:none; user-select:none; vertical-align:middle}
.av img{width:100%; height:100%; object-fit:cover; display:block}
.av svg{width:58%; height:58%}
.av.s{--s:28px; border-width:1.5px}
.av.m{--s:40px}
.av.l{--s:62px}
.av.xl{--s:108px; border-width:3px}
.avring{--p:0; position:relative; display:inline-grid; place-items:center; padding:5px; border-radius:50%; border:0; background:conic-gradient(from -90deg, var(--gold) 0, var(--hot) calc(var(--p) * 1%), color-mix(in srgb, var(--ink) 16%, transparent) 0); flex:none; color:inherit; font:inherit}
button.avring{cursor:pointer; transition:transform .15s ease}
button.avring:hover{transform:scale(1.04) rotate(-2deg)}
.avring .lvl{position:absolute; right:-4px; bottom:-4px; min-width:26px; height:26px; padding:0 6px; border-radius:999px; display:grid; place-items:center; background:var(--ink); color:var(--surface); border:2px solid var(--surface); font-family:var(--font-mono); font-weight:700; font-size:13px; line-height:1}
.avring .avpen{position:absolute; left:-2px; bottom:-2px; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--ink); border:2px solid var(--ink)}
.avring .avpen svg{width:15px; height:15px}
.titlechip{display:inline-flex; align-items:center; padding:2px 10px; border-radius:999px; background:linear-gradient(135deg, var(--gold), var(--hot)); color:#1D1705; border:2px solid var(--ink); font-weight:800; font-size:12px; letter-spacing:.03em; white-space:nowrap}
.xpbar{height:13px; border:2px solid var(--ink); border-radius:999px; background:var(--surface); overflow:hidden; max-width:420px}
.xpbar i{display:block; height:100%; width:var(--w, 0%); background:linear-gradient(90deg, var(--gold), var(--hot)); border-radius:999px; animation:xpgrow 1s cubic-bezier(.2,.9,.3,1) both}

/* Start: Kopfbereich */
.card.hero{display:flex; flex-direction:column; gap:20px; position:relative; overflow:hidden}
.hero-art{position:relative}
.hero-art::before{content:""; position:absolute; inset:6% 0 -4%; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--gold) 60%, transparent), transparent); filter:blur(10px); z-index:0; opacity:.9}
.hero-art svg,.hero-art .egg{position:relative; z-index:1}
.hero-art .hay{animation:bob 5.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-6px) rotate(.6deg)}}
.mecard{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px 18px; align-items:center; padding:14px 18px; border:2px solid var(--ink); border-radius:18px; background:var(--surface-2); box-shadow:4px 4px 0 var(--shade)}
.mename{font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.menamerow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-width:0}
.mebtns{justify-content:flex-end}
@media (max-width:620px){ .mecard{grid-template-columns:auto minmax(0,1fr)} .mecard .mebtns{grid-column:1 / -1; justify-content:flex-start} }

/* Start: die drei Spielarten */
.modes{display:grid; gap:18px}
.mode{position:relative; overflow:hidden; isolation:isolate; display:flex; flex-direction:column; gap:10px; padding:20px 20px 22px; border:2px solid var(--ink); border-radius:22px; color:#fff; min-height:218px; transition:transform .16s ease, box-shadow .16s ease}
.mode:hover{transform:translate(-2px,-4px) rotate(-.4deg)}
.mode.m-daily{background:linear-gradient(140deg, #3046D8, #6A3FE0)}
.mode.m-duel{background:linear-gradient(140deg, #0E9485, #0A6079)}
.mode.m-free{background:linear-gradient(140deg, #F08A24, #E6B93E); color:#1D1705}
.mode .mart{position:absolute; right:-22px; bottom:-26px; width:170px; height:170px; opacity:.2; transform:rotate(-14deg); pointer-events:none; z-index:-1; transition:transform .3s ease}
.mode:hover .mart{transform:rotate(-6deg) scale(1.08)}
.mode .mart svg{width:100%; height:100%}
.mode .label{color:inherit; opacity:.88}
.mode h3{font-size:30px; line-height:1.02; margin:0; letter-spacing:-.02em}
.mode p{font-size:15px; line-height:1.4; max-width:34ch}
.mode .acts{margin-top:auto; padding-top:6px; display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.mode .acts .tiers{display:flex; gap:4px}
.mode .btn.light{background:#FFF8DE; color:#1D1705; border-color:#1D1705; box-shadow:3px 3px 0 #1D1705}
.mode .btn.light:hover{box-shadow:4px 4px 0 #1D1705}
.mode .drecent{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.mode .chipbtn{font-size:12px; padding:4px 9px}

/* Start: So funktioniert's */
.howgrid{display:grid; gap:20px}
.howgrid .example{background:var(--surface-2); border-style:solid; border-color:var(--ink); border-radius:16px}
.ex-row .meter i{animation:xpgrow .9s cubic-bezier(.2,.9,.3,1) both}
.rankstrip{width:100%; display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:14px; align-items:center; text-align:left; padding:12px 16px; border:2px solid var(--ink); border-radius:18px; background:var(--surface); color:var(--ink); box-shadow:4px 4px 0 var(--shade), var(--cardglow); transition:transform .12s ease, box-shadow .12s ease; font:inherit}
.rankstrip:hover{transform:translate(-1px,-2px); box-shadow:6px 7px 0 var(--shade), var(--cardglow)}
.rk-ic{width:46px; height:46px; border-radius:14px; display:grid; place-items:center; background:linear-gradient(135deg, var(--gold), var(--hot)); color:#1D1705; border:2px solid var(--ink)}
.rk-ic svg{width:26px; height:26px}
.rk-txt{display:flex; flex-direction:column; min-width:0}
.rk-txt b{font-family:var(--font-display); font-size:20px; letter-spacing:-.01em}
.rk-txt small{color:var(--muted); font-size:13px}
.rk-top{display:flex; align-items:center}
.rk-top .av{margin-left:-10px; box-shadow:0 0 0 2px var(--surface)}
.rk-top .av:first-child{margin-left:0}
.rk-arrow{font-family:var(--font-display); font-weight:800; font-size:22px}
@media (max-width:480px){ .rk-top{display:none} .rankstrip{grid-template-columns:auto minmax(0,1fr) auto} }

/* Spiel */
.chip{background:var(--surface-2)}
.pip{height:9px; transition:background .3s}
.pip.now{background:linear-gradient(90deg, var(--thread), var(--thread-2)); animation:pipnow 1.2s ease-in-out infinite}
@keyframes pipnow{50%{transform:scaleY(1.35)}}
.prog b{color:var(--ink); display:inline-block}
.prog b.bump{animation:bump .5s ease-out}
.cat{background:linear-gradient(135deg, var(--gold), var(--t1)); color:#1D1705; box-shadow:3px 3px 0 var(--shade)}
.playcard.qenter .pq,.playcard.qenter .pbody{animation:slidein .42s cubic-bezier(.2,.9,.3,1.1) both}
.playcard.qenter .pbody{animation-delay:.06s}
@keyframes slidein{from{opacity:0; transform:translateX(26px)}to{opacity:1; transform:none}}
.ring.low{animation:heartbeat .5s ease-in-out infinite}
@keyframes heartbeat{50%{transform:scale(1.09)}}
form.ans input{background:var(--surface-2); border-radius:14px; transition:box-shadow .15s ease, transform .15s ease}
form.ans input:focus{outline:none; box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent), 4px 4px 0 var(--shade)}
.try{background:color-mix(in srgb, var(--warn) 10%, transparent)}

/* Einsinken */
.dig{border-radius:16px; box-shadow:4px 4px 0 var(--shade)}
.digtop{background:var(--surface-2)}
.band{transition:background-color .2s ease, color .2s ease, transform .2s ease}
.band.active{box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--tt) 35%, transparent), inset 0 -18px 30px -18px rgba(0,0,0,.25)}
.band.active .bn{animation:bump .4s ease-out}
.shaft.shake{animation:shaftshake .28s linear}
@keyframes shaftshake{20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,2px)}80%{transform:translate(2px,0)}}
.dig.found{box-shadow:4px 4px 0 var(--shade), 0 0 0 4px color-mix(in srgb, var(--t4) 55%, transparent), 0 0 42px color-mix(in srgb, var(--t4) 70%, transparent)}
.vcard{position:relative; overflow:hidden; border-radius:18px; box-shadow:4px 4px 0 var(--shade); background:linear-gradient(135deg, var(--tc), color-mix(in srgb, var(--tc) 72%, #000))}
.vcard.miss{background:var(--surface-2)}
#after:not([hidden]) .vcard{animation:vpop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes vpop{from{transform:scale(.86) rotate(-1.5deg); opacity:0}to{transform:none; opacity:1}}
.vcard:not(.miss)::after{content:""; position:absolute; inset:0; background:linear-gradient(110deg, transparent 35%, rgba(255,255,255,.3) 50%, transparent 65%); transform:translateX(-120%); animation:sweep 1.1s .35s ease forwards; pointer-events:none}
@keyframes sweep{to{transform:translateX(120%)}}
.vicon{box-shadow:3px 3px 0 var(--shade)}
#after:not([hidden]) .vicon{animation:spinin .6s .1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes spinin{from{transform:scale(.3) rotate(-90deg)}to{transform:none}}
.ach{background:var(--surface-2); animation:rise .4s both}
.chips .ach:nth-child(2){animation-delay:.05s} .chips .ach:nth-child(3){animation-delay:.1s} .chips .ach:nth-child(4){animation-delay:.15s}

/* Rundenende */
.total b{font-weight:700; background:linear-gradient(120deg, var(--ink) 35%, var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent}
.xpchip{display:inline-flex; align-items:center; gap:6px; padding:3px 12px; border-radius:999px; background:linear-gradient(135deg, var(--gold), var(--hot)); color:#1D1705; border:2px solid var(--ink); font-family:var(--font-mono); font-weight:700; font-size:14px; animation:vpop .5s .9s both}
.end .chart{background:var(--surface-2); border-radius:16px}
.end .cell.on{animation:cellin .34s cubic-bezier(.2,1.4,.4,1) both; animation-delay:calc(.25s + var(--c, 0) * .1s + var(--t, 0) * .06s)}
@keyframes cellin{from{transform:scaleY(.2); opacity:0}to{transform:none; opacity:1}}
.end .badge .ticon{animation:stamp .5s .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.4) rotate(-25deg); opacity:0}to{transform:none; opacity:1}}

/* Bestenliste und Rangliste */
.brow{background:var(--surface-2); transition:transform .12s ease}
.brow:hover{transform:translateX(3px)}
.brow .rank.r1{background:linear-gradient(135deg, #FFE27A, #F2A51B); color:#1D1705}
.brow .rank.r2{background:linear-gradient(135deg, #EDEFF3, #AEB6C2); color:#1D1705}
.brow .rank.r3{background:linear-gradient(135deg, #F0B27C, #C2703A); color:#1D1705}
.brow.me{background:linear-gradient(135deg, var(--thread), var(--thread-2))}
.brow .namec{gap:10px}
.board.fresh .brow{animation:rise .35s both}
.board.fresh .brow:nth-child(2){animation-delay:.04s} .board.fresh .brow:nth-child(3){animation-delay:.08s} .board.fresh .brow:nth-child(4){animation-delay:.12s} .board.fresh .brow:nth-child(5){animation-delay:.16s} .board.fresh .brow:nth-child(n+6){animation-delay:.2s}
.minebox{background:var(--surface-2); border-radius:16px}
.rkmeta{display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-size:12px}
.rkmeta small{opacity:.8}
.lvlchip{font-family:var(--font-mono); font-weight:700; font-size:12px; padding:1px 8px; border-radius:999px; border:1.5px solid currentColor; white-space:nowrap}
.brow .score small{font-size:11px; font-weight:500; opacity:.75}
@media (max-width:480px){ .brow .rkmeta{grid-column:2; grid-row:2; flex-direction:row; align-items:center; gap:8px} }

/* Duell */
.vs{gap:12px}
.vside{position:relative; gap:4px; padding:16px 10px 14px; border-radius:18px; background:var(--surface-2); transition:transform .3s ease, background .3s ease}
.vside.won{background:linear-gradient(135deg, var(--thread), var(--thread-2)); transform:translateY(-4px) scale(1.03)}
.vside.won::before{content:"Sieg"; position:absolute; top:-12px; left:50%; transform:translateX(-50%) rotate(-3deg); padding:1px 12px; border-radius:999px; background:linear-gradient(135deg, var(--gold), var(--hot)); color:#1D1705; border:2px solid var(--ink); font-family:var(--font-display); font-weight:800; font-size:13px}
.vside .av{margin-bottom:2px}
.vscore.bump,.vmid b.bump{animation:bump .4s ease-out}
.vsbadge{font-family:var(--font-display); font-weight:800; font-size:13px; letter-spacing:.08em; padding:2px 9px; border-radius:999px; background:var(--ink); color:var(--surface)}
.drow{background:var(--surface-2); border-radius:14px}
.duelcard.anim .drow{opacity:0; animation:rowin .45s cubic-bezier(.2,.9,.3,1.15) forwards; animation-delay:calc(.45s + var(--i, 0) * .52s)}
@keyframes rowin{from{opacity:0; transform:translateY(14px) scale(.97)}to{opacity:1; transform:none}}
.duelcard.anim .dans.win{animation:winpop .45s cubic-bezier(.2,1.6,.4,1) both; animation-delay:calc(.72s + var(--i, 0) * .52s)}
@keyframes winpop{from{transform:scale(.8); border-color:transparent; background:transparent}to{transform:none}}
#duelHead.pop{animation:vpop .5s cubic-bezier(.2,1.5,.4,1) both}
.sharebox{background:var(--surface-2); border-radius:16px}

/* Profil */
.phead{grid-template-columns:auto minmax(0,1fr) auto; gap:14px 22px}
.pacts{display:flex; flex-direction:column; gap:8px; align-items:flex-end}
@media (max-width:620px){ .phead{grid-template-columns:auto minmax(0,1fr)} .pacts{grid-column:1 / -1; flex-direction:row; flex-wrap:wrap; align-items:center} .av.xl{--s:84px} }
.ptile{background:var(--surface-2); border-radius:14px; position:relative; overflow:hidden}
.ptile.hl{background:linear-gradient(135deg, var(--thread), var(--thread-2))}
.sech{font-family:var(--font-display); font-size:21px; margin:0 0 10px; letter-spacing:-.01em; display:flex; align-items:baseline; gap:10px}
.sech small{font-family:var(--font-body); font-weight:500; font-size:13px}
.bdgs{display:grid; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr)); gap:10px}
.bdg{display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px; padding:12px 8px; border:2px dashed var(--line); border-radius:14px; color:var(--muted); min-width:0}
.bdg .bico{--avc:var(--surface); width:46px; height:46px; border-radius:50%; display:grid; place-items:center; background:color-mix(in srgb, var(--ink) 10%, transparent); border:2px solid currentColor; margin-bottom:2px}
.bdg .bico svg{width:26px; height:26px}
.bdg b{font-size:14px; line-height:1.2}
.bdg small{font-size:12px; line-height:1.25}
.bdg.ok{border-style:solid; border-color:var(--ink); background:var(--surface-2); color:var(--ink); box-shadow:3px 3px 0 var(--shade)}
.bdg.ok .bico{--avc:#F9B33C; background:linear-gradient(135deg, var(--gold), var(--hot)); color:#1D1705; border-color:var(--ink)}
.mrow{background:var(--surface-2); border-radius:14px}
.mvs .mline{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.rivals li{background:var(--surface-2); border-radius:12px; grid-template-columns:auto minmax(0,1fr) auto auto}

/* Meldungen und Fenster */
#toasts{position:fixed; left:0; right:0; bottom:max(18px, env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; align-items:center; gap:8px; z-index:80; pointer-events:none; padding:0 16px}
.toast{display:flex; align-items:center; gap:10px; padding:10px 18px; border-radius:999px; background:var(--ink); color:var(--surface); border:2px solid var(--surface); font-weight:700; box-shadow:0 8px 30px rgba(0,0,0,.35); animation:toastin .45s cubic-bezier(.2,1.4,.4,1) both; max-width:min(92vw, 520px)}
.toast svg{width:20px; height:20px; flex:none}
.toast.out{animation:toastout .35s ease forwards}
@keyframes toastin{from{transform:translateY(30px) scale(.9); opacity:0}to{transform:none; opacity:1}}
@keyframes toastout{to{transform:translateY(20px); opacity:0}}
.modal{position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:16px; background:rgba(8,6,2,.62); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); animation:fadein .2s ease both; overflow:auto}
@keyframes fadein{from{opacity:0}}
.mcard{width:min(100%, 480px); background:var(--surface); color:var(--ink); border:2px solid var(--ink); border-radius:22px; box-shadow:7px 7px 0 var(--shade); padding:22px; display:flex; flex-direction:column; gap:14px; animation:vpop .35s cubic-bezier(.2,1.3,.4,1) both; max-height:calc(100vh - 32px); overflow:auto}
.mhead{display:flex; align-items:center; justify-content:space-between; gap:12px}
.avprev{display:grid; place-items:center; padding:4px 0}
.avicons{display:grid; grid-template-columns:repeat(auto-fill, minmax(52px, 1fr)); gap:8px}
.avicons button{aspect-ratio:1; border-radius:14px; border:2px solid var(--line); background:var(--surface-2); color:var(--ink); display:grid; place-items:center; padding:0}
.avicons button svg{width:26px; height:26px}
.avicons button[aria-pressed="true"]{border-color:var(--ink); box-shadow:3px 3px 0 var(--shade); background:var(--gold); color:#1D1705}
.avcolors{display:flex; gap:8px; flex-wrap:wrap}
.avcolors button{width:34px; height:34px; border-radius:50%; border:2px solid var(--ink); background:var(--c); padding:0}
.avcolors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface), 0 0 0 6px var(--ink)}
.cropwrap{display:flex; flex-direction:column; align-items:center; gap:12px}
.cropper{width:240px; height:240px; border-radius:50%; border:3px solid var(--ink); overflow:hidden; touch-action:none; cursor:grab; background:#000; box-shadow:4px 4px 0 var(--shade)}
.cropper:active{cursor:grabbing}
.cropper canvas{display:block; width:240px; height:240px}
.cropwrap input[type=range]{width:240px; accent-color:var(--accent)}
.filebtn{position:relative; overflow:hidden}
.filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0}

/* Desktop */
@media (min-width: 960px){
  .card.hero{padding:34px 36px}
  .card.hero .hero-grid{grid-template-columns:minmax(0,1fr) 300px; gap:40px}
  .card.hero h1{font-size:70px}
  .card.hero .lede{font-size:20px}
  .modes{grid-template-columns:repeat(3, minmax(0,1fr)); gap:22px}
  .mode{min-height:250px; padding:24px 24px 26px}
  .mode h3{font-size:34px}
  .howgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:32px; align-items:start}
  .question{font-size:46px}
  .bdgs{grid-template-columns:repeat(6, minmax(0,1fr))}
}

/* Akzentfarbe für Linien und Text (im Dunklen heller als die Knopf-Farbe) */
:focus-visible{outline-color:var(--accent)}
.switch input:focus-visible + .sw{outline-color:var(--accent)}
.ring .rfg{stroke:var(--accent)}
.spin{border-top-color:var(--accent)}
.note svg{color:var(--accent)}
.note{background:var(--surface-2); border-radius:12px}
.tagai{border-color:var(--accent); color:var(--accent)}
.plink:hover{color:var(--accent)}
.cond{background:linear-gradient(135deg, var(--thread), var(--thread-2))}
.authform input{background:var(--surface-2)}
textarea.share{background:var(--surface-2)}
.tagname{font-family:var(--font-display); letter-spacing:-.01em; font-weight:800}
.plink{font-family:var(--font-display); letter-spacing:0; font-weight:800}
.brow .tag,.brow .tag.plink{font-family:var(--font-display); font-weight:800; letter-spacing:0; font-size:18px}
.rivals .plink,.mvs .plink{font-size:16px}

/* Kopfzeile: Name und Level im Profil-Knopf */
.profbtn .pbname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.profbtn .pblvl{font-family:var(--font-mono); font-weight:700; font-size:11px; line-height:1; padding:3px 7px; border-radius:999px; background:linear-gradient(135deg, var(--gold), var(--hot)); color:#1D1705; flex:none}
.profbtn{transition:transform .08s ease, box-shadow .08s ease}
@media (max-width:480px){
  .themebtn{display:none}
  .profbtn:not(.guest){padding:3px 8px 3px 3px; gap:6px}
  .profbtn:not(.guest) .pbname{display:none}
  .iconbtn{width:36px; height:36px}
}
@media (max-width:380px){ .brand b{font-size:22px} .brand svg{width:28px; height:28px} }

/* Spielarten: feste Farben, im Dunklen mit Leuchten statt hartem Schatten */
.mode{--mg:#3046D8; border-color:var(--mode-border); box-shadow:var(--mode-off) var(--mode-off) 0 #1D1705, 0 18px 46px -18px color-mix(in srgb, var(--mg) calc(var(--mode-glow) * 85%), transparent)}
.mode:hover{box-shadow:calc(var(--mode-off) + 3px) calc(var(--mode-off) + 4px) 0 #1D1705, 0 22px 54px -16px color-mix(in srgb, var(--mg) calc(var(--mode-glow) * 100%), transparent)}
.mode.m-daily{--mg:#5B5BF0}
.mode.m-duel{--mg:#12A090}
.mode.m-free{--mg:#F08A24}
.mode .mtop{display:flex; align-items:center; gap:10px}
.mode .cal{width:46px; background:#FFF8DE; color:#1D1705; border-color:#1D1705; border-radius:9px}
.mode .cal small{background:#F7C948; color:#1D1705; font-size:9px}
.mode .cal b{font-size:18px; line-height:1.45}
.mode .mini{box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.mode.m-free .mini{box-shadow:0 0 0 1.5px #1D1705}
.mode p b{font-weight:800}
.mecard.guest .av{--avc:var(--surface); --avt:var(--ink)}
.mecard .av svg{width:56%; height:56%}
.vside.ghost{border-style:dashed; color:var(--muted)}
.vside.ghost .av{border-style:dashed; border-color:var(--muted)}
.dwait{display:flex; align-items:center; gap:10px; font-weight:600}
.invhead{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.endtop .xprow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:6px}
.rkhint{display:flex; gap:6px; align-items:center}
.rkhint svg{width:16px; height:16px}
.rankcard .brow{grid-template-columns:34px minmax(0,1fr) auto auto}
.streak{display:inline-flex; align-items:center; gap:4px; font-weight:700; color:var(--ink)}
.streak svg{width:15px; height:15px; color:var(--hot)}
.who{display:inline-flex; align-items:center; gap:6px; min-width:0}
@media (max-width:560px){
  .mrow{grid-template-columns:auto minmax(0,1fr)}
  .mrow .mres{grid-column:1; grid-row:1; min-width:0}
  .mrow .mdate{grid-column:2; grid-row:1; justify-self:end}
  .mrow .mvs{grid-column:1 / -1; grid-row:2}
  .mrow .mopen{grid-column:1 / -1; grid-row:3}
}
.band{background-color:color-mix(in srgb, var(--tc) 24%, var(--surface))}
.band.active{background-color:var(--tc)}
#next{scroll-margin-bottom:28px}
.mode .mart.num{display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:200px; line-height:1; right:2px; bottom:-2px; opacity:.2}
/* Token und Shop */
.coin{width:22px; height:22px; flex:none}
.tokbtn{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--ink); border-radius:999px; background:var(--surface); color:var(--ink); padding:3px 12px 3px 5px; min-height:38px; font-family:var(--font-mono); font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; box-shadow:2px 2px 0 var(--shade); transition:transform .08s ease, box-shadow .08s ease}
.tokbtn:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--shade)}
.tokbtn .coin{width:24px; height:24px}
.tokbox{display:inline-flex; align-items:center; gap:8px; padding:6px 16px 6px 8px; border:2px solid var(--ink); border-radius:999px; background:var(--surface-2); box-shadow:3px 3px 0 var(--shade); font-weight:600}
.tokbox b{font-family:var(--font-mono); font-size:22px; font-variant-numeric:tabular-nums}
.tokbox .coin{width:30px; height:30px}
.strips{display:grid; gap:14px}
@media (min-width:760px){ .strips{grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px} }
.rk-ic.shop{background:var(--surface-2)}
.rk-ic.shop .coin{width:32px; height:32px}
.shopgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(146px, 1fr)); gap:12px}
.shopgrid.charms{grid-template-columns:repeat(auto-fill, minmax(168px, 1fr))}
.sgroup{grid-column:1 / -1; margin-top:8px}
.sitem{display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:14px 8px; border:2px solid var(--line); border-radius:16px; background:var(--surface-2); min-width:0}
.sitem.owned{border-color:var(--ink)}
.sitem.on{border-color:var(--ink); box-shadow:3px 3px 0 var(--shade), 0 0 0 3px color-mix(in srgb, var(--accent) 60%, transparent)}
.sitem > b{font-size:15px; line-height:1.2}
.sitem .hint{font-size:12px; line-height:1.3}
.sitem .btn{margin-top:auto; display:inline-flex; align-items:center; gap:6px}
.sitem .btn .coin{width:20px; height:20px}
.sitem .btn.sure{background:linear-gradient(135deg, var(--gold), var(--hot)); color:#1D1705}
.sprev{height:48px; width:100%; display:grid; place-items:center; min-width:0}
.sprev.ch{height:112px}
.sprev.ch svg{height:112px; width:auto; display:block}
.nmprev{font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:-.01em; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.stag{margin-top:auto; font-size:12px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:4px 12px; border-radius:999px; background:var(--ink); color:var(--surface)}
.sides{margin-top:auto; display:flex; gap:5px; flex-wrap:wrap; justify-content:center}
.sides .chipbtn{font-family:var(--font-body); letter-spacing:0; font-size:12px; padding:5px 8px; white-space:nowrap}
.sides .chipbtn[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.tokrules{margin:8px 0 0; padding-left:20px; display:grid; gap:4px; font-size:14px}
.xpchip.tok{background:var(--surface); color:var(--ink); gap:5px; padding-left:5px}
.xpchip.tok .coin{width:20px; height:20px}
/* Glücksbringer links und rechts */
.sidecharm{--m:calc((100vw - 1180px) / 2); --w:clamp(60px, calc(var(--m) - 44px), 150px); position:fixed; bottom:16px; width:var(--w); pointer-events:none; z-index:0; display:none}
.sidecharm.l{left:calc((var(--m) - var(--w)) / 2)}
.sidecharm.r{right:calc((var(--m) - var(--w)) / 2)}
.sidecharm svg,.footcharm svg{width:100%; height:auto; display:block; transform-origin:50% 100%; animation:charmbob 4.5s ease-in-out infinite}
.sidecharm.r svg,.footcharm.r svg{animation-name:charmbob2; animation-delay:-1.6s; transform:scaleX(-1)}
@keyframes charmbob{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg) translateY(-3px)}}
@keyframes charmbob2{0%,100%{transform:scaleX(-1) rotate(-2.5deg)}50%{transform:scaleX(-1) rotate(2.5deg) translateY(-3px)}}
.cheer{animation:charmjump .55s ease-out 3}
@keyframes charmjump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
.footrow{display:flex; align-items:flex-end; justify-content:center; gap:10px; width:100%; max-width:720px; margin:0 auto}
.footrow footer{flex:1 1 auto; min-width:0; margin:0}
.footcharm{width:54px; flex:none}
.footcharm:empty{display:none}
@media (min-width:1340px){ .sidecharm{display:block} .footcharm{display:none} }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sidecharm svg, :root:not([data-theme="light"]) .footcharm svg, :root:not([data-theme="light"]) .sprev.ch svg{filter:drop-shadow(0 0 1.3px rgba(255,240,192,.85))} }
:root[data-theme="dark"] .sidecharm svg, :root[data-theme="dark"] .footcharm svg, :root[data-theme="dark"] .sprev.ch svg{filter:drop-shadow(0 0 1.3px rgba(255,240,192,.85))}
@media (max-width:480px){ .shopgrid,.shopgrid.charms{grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px} .sprev.ch,.sprev.ch svg{height:92px} .nmprev{font-size:19px} .profbtn .pblvl{display:none} .tokbtn{padding:3px 9px 3px 4px; font-size:13px; min-height:36px} .tokbtn .coin{width:22px; height:22px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} .duelcard.anim .drow{opacity:1} }

function haystackSVG(){
  let seed=11; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const top = x => 40 + Math.pow((x-100)/82,2)*104;
  let d="";
  for (let i=0;i<90;i++){
    const x=24+rnd()*152, t=top(x)+7; if (t>136) continue;
    const y=t+rnd()*(140-t), a=(rnd()-.5)*.9, L=8+rnd()*10;
    const x2=x+Math.sin(a)*L, y2=y-Math.cos(a)*L;
    if (y2<top(x2)+4 || y>142) continue;
    d+=`M${x.toFixed(1)} ${y.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`;
  }
  return `<svg viewBox="0 0 200 160" class="hay" aria-hidden="true">
    <ellipse cx="100" cy="149" rx="92" ry="8" fill="var(--bg-deep)"/>
    <path d="M118 118 L164 38" stroke="var(--surface)" stroke-width="7" stroke-linecap="round"/>

/* ======================= Hilfen ======================= */
function norm(s){
  s = String(s||"").toLowerCase().trim();
  s = s.replace(/\+\+/g,"pp").replace(/#/g,"sharp").replace(/&/g,"und");
  s = s.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  s = s.normalize("NFD").replace(/[̀-ͯ]/g,"");
  s = s.replace(/^(der|die|das|den|dem|ein|eine|einen|the|vom|von dem)\s+/,"");
  s = s.replace(/[^a-z0-9]/g,"");
  return s;
}
function lev(a,b,max){
  if (a===b) return 0;
  if (Math.abs(a.length-b.length)>max) return max+1;
  let prev=[]; for (let j=0;j<=b.length;j++) prev[j]=j;
  for (let i=1;i<=a.length;i++){
    const cur=[i]; let rowMin=i;
    for (let j=1;j<=b.length;j++){
      const v=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
      cur.push(v); if (v<rowMin) rowMin=v;
    }
    if (rowMin>max) return max+1;
    prev=cur;
  }
  return prev[b.length];
}
const tolFor = n => n<=4?0 : n<=8?1 : n<=14?2 : 3;
const shuffle = a => { a=a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

function prepare(raw){
  const tiers = raw.t.map(t => Array.isArray(t) ? t : String(t).split("|"));
  const entries=[], exact=new Map();
  tiers.forEach((list,tier)=>{
    list.forEach(item=>{
      item=String(item);
      if (/\?|\bdup\b/.test(item)) return;
      const aliases=item.split("/").map(s=>s.trim()).filter(Boolean);
      const ns=aliases.map(norm).filter(Boolean);
      if (!ns.length || ns.some(n=>exact.has(n))) return;
      const e={name:aliases[0], tier, ns};
      entries.push(e); ns.forEach(n=>exact.set(n,e));
    });
  });
  if (raw.p){
    entries.forEach(e=>{ const parts=e.name.split(/\s+/); if (parts.length>1){ const last=norm(parts[parts.length-1]); if (last.length>2 && !exact.has(last)) exact.set(last,e); } });
  }
  const nope=[], nopeMap=new Map();
  parseX(raw.x).forEach(o=>{
    o.a.split("/").forEach(a=>{ const n=norm(a); if (n && !exact.has(n) && !nopeMap.has(n)){ nopeMap.set(n,o.m.trim()); nope.push({n,msg:o.m.trim()}); } });
  });
  return {k:raw.k||"Allgemein", q:raw.q, p:!!raw.p, g:!!raw.g, entries, exact, nope, nopeMap, aiNo:new Map(), src:raw.src||"bank"};
}

function judge(Q, input){
  const n=norm(input);
  if (!n) return {type:"empty"};
  const cands=[n];
  if (Q.p){ const parts=String(input).trim().split(/\s+/); if (parts.length>1) cands.push(norm(parts[parts.length-1])); }
  if (Q.g && n.length>5){ const m=n.replace(/(innen|in)$/,""); if (m!==n) cands.push(m); }
  for (const c of cands){
    if (Q.exact.has(c)) return {type:"ok", e:Q.exact.get(c)};
    if (Q.nopeMap.has(c)) return {type:"nope", msg:Q.nopeMap.get(c)};
  }
  const tol=tolFor(n.length);
  if (tol===0) return {type:"unknown"};
  let best=null, bd=tol+1;
  for (const e of Q.entries){ for (const en of e.ns){ const d=lev(n,en,tol); if (d<bd || (d===bd && best && e.tier<best.tier)){ bd=d; best=e; } } }
  let bx=tol+1, bm=null;
  for (const x of Q.nope){ const d=lev(n,x.n,tol); if (d<bx){ bx=d; bm=x.msg; } }
  if (best && bd<=tol && bd<=bx) return {type:"ok", e:best, fuzzy:true};
  if (bm && bx<=tol) return {type:"nope", msg:bm};
  return {type:"unknown"};
}

/* Erklärungen zu typischen Fehlantworten lesen */
function parseX(x){
  if (Array.isArray(x)) return x.filter(o=>o && typeof o.a==="string" && typeof o.m==="string" && o.m.trim());
  return String(x||"").split("|").map(part=>{ const i=part.indexOf(":"); return i<0 ? null : {a:part.slice(0,i), m:part.slice(i+1).trim()}; }).filter(o=>o && o.m);
}

function drawBank(){
  // Fragen nach Text merken, heutige Tagesfragen auslassen, möglichst verschiedene Themen.
  // Keine Frage kommt doppelt, bis alle dran waren; danach beginnt ein neuer Durchlauf.
  const qid=i=>hashStr(BANK[i].q).toString(36);
  const daily=new Set(dailyPick(dayKey()));
  const all=BANK.map((_,i)=>i).filter(i=>!daily.has(i));
  let seen=Array.isArray(stats.seen) ? stats.seen.filter(x=>typeof x==="string") : [];
  let seenSet=new Set(seen);
  let left=all.filter(i=>!seenSet.has(qid(i)));
  let rest=[];
  if (left.length < ROUND_LEN){
    // Durchlauf fertig: Reste zuerst, dann alle anderen außer den zuletzt gespielten.
    const recent=new Set(seen.slice(-ROUND_LEN*3));
    seen=seen.filter(x=>recent.has(x));
    seenSet=new Set(seen);
    const leftSet=new Set(left);
    rest=all.filter(i=>!leftSet.has(i) && !seenSet.has(qid(i)));
  }
  const cand=shuffle(left).concat(shuffle(rest));
  const pick=[], cats=new Set();
  for (const i of cand){ if (pick.length>=ROUND_LEN) break; if (!cats.has(BANK[i].k)){ pick.push(i); cats.add(BANK[i].k); } }
  for (const i of cand){ if (pick.length>=ROUND_LEN) break; if (!pick.includes(i)) pick.push(i); }
  const order=shuffle(pick);
  stats.seen=seen.concat(order.map(qid)).slice(-3000);
  delete stats.fams;
  stats.bag=[]; saveStats();
  return order.map(getQ);
}

  Stufe 1: 6–15 beliebte Antworten.

- Nur sachlich korrekte Antworten. Lieber weglassen als raten.
- Gleiche Sache, andere Schreibweise: im selben Eintrag mit "/" trennen, z. B. "Karotte/Möhre".
- Füge 2–6 typische Fehlantworten mit kurzer, freundlicher Erklärung auf Deutsch hinzu.

Antworte nur mit JSON in dieser Form:
{"fragen":[{"k":"Thema","q":"Nenne …","t":[["…"],["…"],["…"],["…"],["…"]],"x":[{"a":"Fehlantwort/Schreibweise","m":"Erklärung"}]}]}`;
  const data=await sample.json(prompt, {modelTier:"default", cache:false});
  const list=(data && Array.isArray(data.fragen)) ? data.fragen : [];
  const qs=[];

    if (t.some(l=>!l.length)) continue;
    const Q=prepare({k:String(f.k||"Claude").slice(0,40), q:f.q.slice(0,200), t, x:Array.isArray(f.x)?f.x.filter(o=>o && typeof o.a==="string" && typeof o.m==="string"):[], src:"ai"});
    if (Q.entries.length>=12) qs.push(Q);
  }
  if (qs.length<3) throw {code:"few"};
  qs.forEach(Q=>recentAI.push(Q.q)); recentAI=recentAI.slice(-40);
  return qs.slice(0,ROUND_LEN);
}

function berlinParts(){ const o={}; new Intl.DateTimeFormat("en-GB",{timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"}).formatToParts(new Date()).forEach(p=>{ o[p.type]=p.value; }); return o; }
function dayKey(){ const p=berlinParts(); return `${p.year}-${p.month}-${p.day}`; }
function dayLabel(key){ const [,m,d]=key.split("-").map(Number); return `${d}. ${MONTHS[m-1]}`; }
function untilNext(){ const p=berlinParts(); const s=Math.max(60, 86400-((+p.hour)*3600+(+p.minute)*60+(+p.second))); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h>0 ? `${h} Std. ${m} Min.` : `${m} Min.`; }
function hashStr(s){ let h=2166136261; for (const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function dailyPick(key){
  const order=BANK.map((b,i)=>({i, h:hashStr(key+"|"+b.q)})).filter(o=>!BANK[o.i].since || BANK[o.i].since<=key).sort((a,b)=>a.h-b.h || a.i-b.i);
  const pick=[], cats=new Set();
  for (const o of order){
    if (pick.length>=ROUND_LEN) break;
    const k=BANK[o.i].k;
    if (cats.has(k)) continue;
    pick.push(o.i); cats.add(k);
  }
  for (const o of order){ if (pick.length===ROUND_LEN) break; if (!pick.includes(o.i)) pick.push(o.i); }
  return pick;
}

async function openDuel(raw){
  const code=cleanCode(raw);
  if (!dailyAvailable()){ state={screen:"duelnew"}; render(); return; }
  state={screen:"duelload", code}; render();
  await dchain;
  let d=null, err=null;
  try{ d=await fetchDuel(code); }catch(e){ err=e; }
  if (state.screen!=="duelload" || state.code!==code) return;
  if (err || !d){ state={screen:"duelerr", msg:duelErr(err||{code:"not_found"})}; render(); return; }
  // Abgebrochener eigener Versuch: zählt mit dem bisherigen Stand.
  const mine=duelLocal[code], side=d.role && d[d.role];
  if (mine && mine.secret && mine.status!=="done" && side && side.status==="playing"){
    const tiers=(side.tiers||[]).slice(0,ROUND_LEN), answers=(side.answers||[]).slice(0,ROUND_LEN);
    while (tiers.length<ROUND_LEN){ tiers.push(-1); answers.push(""); }
    try{ await rpc("save_duel", {p_code:code, p_secret:mine.secret, p_tiers:tiers, p_answers:answers, p_done:true}); mine.status="done"; saveDuelLocal(); d=await fetchDuel(code); }catch(e){}
    if (state.screen!=="duelload" || state.code!==code) return;
  }
  if (!d.role && !d.b){ state={screen:"duelinvite", code, data:d}; render(); return; }
  if (d.role && !duelLocal[code]){ duelLocal[code]={role:d.role, secret:null, at:Date.now(), status:"done"}; saveDuelLocal(); }
  showDuel(d);
}
function showDuel(d){
  stopDuelPoll();
  state={screen:"duel", code:d.code, data:d}; render();
  if (d.final) return;
  duelPoll=setInterval(async()=>{
    if (state.screen!=="duel" || state.code!==d.code){ stopDuelPoll(); return; }

      const n=await fetchDuel(d.code);
      if (n && state.screen==="duel" && state.code===d.code && JSON.stringify(n)!==JSON.stringify(state.data)) showDuel(n);
    }catch(e){}
  }, 12000);
}

/* Auswertung */
function duelOutcome(d){
  const A=d.a, B=d.b||{};
  const rows=d.qids.map((id,j)=>{
    const i=qIndex(id);
    const ta=Number.isInteger(A.tiers?.[j])?A.tiers[j]:-1, tb=Number.isInteger(B.tiers?.[j])?B.tiers[j]:-1;
    const aa=String(A.answers?.[j]||""), ab=String(B.answers?.[j]||"");
    const same=ta>=0 && tb>=0 && !!aa && norm(aa)===norm(ab);
    const pa=(same||ta<0)?0:TIERS[ta].pts, pb=(same||tb<0)?0:TIERS[tb].pts;
    const win=same?0:(ta>tb?1:tb>ta?2:0);
    return {q:i===undefined?"(Diese Frage gibt es nicht mehr)":BANK[i].q, ta, tb, aa, ab, same, pa, pb, win};
  });
  const wa=rows.filter(r=>r.win===1).length, wb=rows.filter(r=>r.win===2).length;
  const sa=rows.reduce((s,r)=>s+r.pa,0), sb=rows.reduce((s,r)=>s+r.pb,0);
  const winner=wa>wb?"a":wb>wa?"b":sa>sb?"a":sb>sa?"b":null;
  return {rows, wa, wb, sa, sb, winner};
}

/* Auswertung Frage für Frage aufdecken, die Zähler laufen mit */
async function animateDuel(an, d){
  const s=state, o=an.o, tok={skip:false}, card=$("duelCardBox");
  const bump=el=>{ if (el){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); } };
  if (card) card.addEventListener("click", ()=>{ tok.skip=true; card.classList.remove("anim"); }, {once:true});
  let wa=0, wb=0, sa=0, sb=0;
  await pause(450, tok);
  for (const r of o.rows){
    await pause(270, tok);
    if (state!==s) return;
    if (r.win===1) wa++; if (r.win===2) wb++;
    sa+=r.pa; sb+=r.pb;
    const vr=$("vrounds"), va=$("vscore_a"), vb=$("vscore_b");
    if (vr) vr.textContent=wa+":"+wb;
    if (va) va.textContent=sa;
    if (vb) vb.textContent=sb;
    if (r.win){ bump(vr); bump(r.win===1?va:vb); }
    if (!tok.skip){
      const mine = d.role==="a" ? r.win===1 : d.role==="b" ? r.win===2 : r.win>0;
      sfx(r.win && mine ? "point" : "nopoint");
    }
    await pause(250, tok);
  }
  await pause(350, tok);
  if (state!==s) return;
  const h=$("duelHead"); if (h){ h.innerHTML=an.head; h.classList.add("pop"); }
  const wside=o.winner ? $("vside_"+o.winner) : null;
  if (wside) wside.classList.add("won");
  const won=!!o.winner && o.winner===d.role;
  sfx(!o.winner ? "draw" : (won || !d.role) ? "win" : "lose");
  if (wside && (won || !d.role)) confetti(wside, 64);
  buzz(won ? [30,40,80] : 20);
}

function openAuth(after, mode, msg){ state={screen:"auth", mode:mode||"register", after:after||null, msg:msg||""}; render(); }
function adoptIdentity(player, name, pid){
  if (player!==local.playerId){ local.playerId=player; local.days={}; duelLocal={}; saveDuelLocal(); }
  local.account={name};
  if (typeof pid==="string" && /^[0-9a-f]{12}$/.test(pid)) local.account.pid=pid;
  me=null; shopData=null; saveLocal(); updateHeader(); refreshMe(true);
}
function logout(){
  local.playerId=newId(); local.account=null; local.days={}; saveLocal();
  duelLocal={}; saveDuelLocal(); me=null; shopData=null; meTok++; updateHeader();
  goStart();
}
function continueAfterAuth(after){
  const to=after && after.to;
  if (to==="daily") return openDaily();
  if (to==="duelnew"){ state={screen:"duelnew"}; render(); return; }
  if (to==="join") return openDuel(after.code);
  if (to==="profile") return openProfile(null);
  if (to==="shop") return openShop();
  goStart();
}
const AUTH_ERR={name_taken:"Diesen Namen gibt es schon. Nimm einen anderen – oder melde dich an, wenn es deiner ist.",
  bad_name:"Der Name braucht 2–10 Zeichen: Buchstaben, Zahlen, _ . oder -.", bad_password:"Das Passwort braucht mindestens 6 Zeichen.",
  wrong_login:"Name oder Passwort stimmt nicht.", network:"Keine Verbindung. Prüf dein Internet und versuch es nochmal."};
function renderAuth(){
  const reg=state.mode!=="login";
  view.innerHTML=`<section class="card stack narrow">
    <span class="label">Profil</span>
    <h2>${reg?"Erstell dein Profil.":"Willkommen zurück!"}</h2>

    <form class="authform" id="authForm" novalidate>
      <label for="auName">Name</label>
      <input id="auName" name="username" maxlength="10" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
      ${reg?`<span class="hint">2–10 Zeichen: Buchstaben, Zahlen, _ . oder -</span>`:""}
      <label for="auPw">Passwort</label>
      <input id="auPw" name="password" type="password" maxlength="72" autocomplete="${reg?"new-password":"current-password"}" enterkeyhint="go">
      ${reg?`<span class="hint">Mindestens 6 Zeichen. Merk es dir gut – ohne E-Mail lässt es sich nicht zurücksetzen.</span>`:""}
      <div class="row"><button class="btn" id="auGo" type="submit">${reg?"Profil erstellen":"Anmelden"}</button></div>
      <p class="fb bad" id="auErr" role="alert"></p>
    </form>
    <p class="hint">${reg?"Mit Profil spielst du Tagesrätsel und Duelle unter deinem Namen und kannst dich auf jedem Gerät anmelden. Was du auf diesem Gerät schon gespielt hast, wird übernommen."
      :"Danach spielst du auf diesem Gerät mit deinem Profil – mit all deinen Statistiken und Duellen."}</p>
    <div class="row"><button class="btn ghost small" id="menu3" type="button">Zurück</button></div>
  </section>`;
  $("menu3").onclick=goStart;
  $("auReg").onclick=()=>{ state.mode="register"; render(); };
  $("auLog").onclick=()=>{ state.mode="login"; render(); };
  const nm=$("auName"), pw=$("auPw"), err=$("auErr"), btn=$("auGo");
  nm.oninput=()=>{ const c=cleanName(nm.value); if (c!==nm.value) nm.value=c; };
  nm.focus({preventScroll:true});
  $("authForm").onsubmit=async ev=>{
    ev.preventDefault();
    const name=cleanName(nm.value), pass=pw.value;
    if (!NAME_RE.test(name)){ err.textContent=reg ? AUTH_ERR.bad_name : AUTH_ERR.wrong_login; return; }
    if (pass.length<6){ err.textContent=reg ? AUTH_ERR.bad_password : AUTH_ERR.wrong_login; return; }
    btn.disabled=true; err.textContent="";
    const tok=state;
    try{
      if (reg){
        let r;
        try{ r=await rpc("register", {p_player:local.playerId, p_name:name, p_password:pass}); }
        catch(e){
          if (e.code!=="device_has_account") throw e;
          local.playerId=newId(); local.days={}; saveLocal();
          r=await rpc("register", {p_player:local.playerId, p_name:name, p_password:pass});
        }
        if (state!==tok) return;
        adoptIdentity(local.playerId, (r && r.name) || name, r && r.pid);
      } else {
        const r=await rpc("login", {p_name:name, p_password:pass});
        if (state!==tok) return;
        if (!r || !r.ok){
          btn.disabled=false;
          err.textContent = r && r.error==="locked" ? `Zu viele falsche Versuche. Versuch es in ${Number(r.wait)||15} Minuten nochmal.` : AUTH_ERR.wrong_login;
          return;
        }
        adoptIdentity(r.player, r.name, r.pid);
      }
      continueAfterAuth(tok.after);
    }catch(e){
      if (state!==tok) return;
      btn.disabled=false;
      const code=e && e.code;
      err.textContent = AUTH_ERR[code]
        || (e && e.status===404 ? "Die Datenbank ist noch nicht fertig eingerichtet: In Supabase muss einmal das Skript setup.sql laufen."
        : `Das hat nicht geklappt. (${String(code||"unbekannter Fehler").slice(0,140)})`);
    }
  };
}

let actx=null;
const soundOn=()=>stats.sound!==false;
function audio(){
  if (!soundOn()) return null;
  try{
    if (!actx){ const C=window.AudioContext||window.webkitAudioContext; if (!C) return null; actx=new C(); }
    if (actx.state==="suspended") actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(f, at, dur, type, vol, to){
  const c=audio(); if (!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+(at||0);
    o.type=type||"sine"; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t+dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||.1, t+.015);
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
const SFX={
  tap:()=>tone(520,0,.06,"triangle",.05),
  go:()=>{ tone(392,0,.1,"triangle",.09); tone(523,.08,.1,"triangle",.09); tone(784,.16,.18,"triangle",.1); },
  layer:i=>tone(250+i*75,0,.14,"sine",.09,170+i*60),
  land:t=>{
    const seq=[[262],[262,330],[262,330,392],[330,392,523,659],[392,523,659,784,1047]][t]||[262];
    seq.forEach((f,k)=>tone(f, k*.085, t===4?.34:.22, "triangle", .1));
    if (t===4){ tone(1568,.46,.5,"sine",.06); tone(2093,.58,.6,"sine",.05); }
  },
  wrong:()=>tone(170,0,.17,"sawtooth",.07,115),
  tick:()=>tone(880,0,.05,"square",.03),
  timeout:()=>{ tone(330,0,.2,"triangle",.09,262); tone(220,.18,.34,"triangle",.09,160); },
  pass:()=>tone(294,0,.18,"sine",.07,215),
  win:()=>{ [523,659,784,1047].forEach((f,k)=>tone(f, k*.11, .24, "triangle", .11)); tone(1319,.46,.55,"triangle",.1); },
  lose:()=>{ [392,349,311,262].forEach((f,k)=>tone(f, k*.14, .26, "triangle", .09)); },
  draw:()=>{ tone(392,0,.2,"triangle",.09); tone(392,.22,.3,"triangle",.09); },
  up:()=>{ [523,784,1047,1568].forEach((f,k)=>tone(f, k*.07, .22, "sine", .09)); },
  point:()=>tone(659,0,.11,"triangle",.08,880),
  nopoint:()=>tone(330,0,.11,"triangle",.06,262)
};
function sfx(name, arg){ try{ if (soundOn() && SFX[name]) SFX[name](arg); }catch(e){} }
function buzz(p){ try{ if (soundOn() && navigator.vibrate) navigator.vibrate(p); }catch(e){} }

const THKEY="heuhaufen:theme";
function curTheme(){
  const t=document.documentElement.getAttribute("data-theme");
  if (t==="dark" || t==="light") return t;
  try{ return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }catch(e){ return "light"; }
}
function paintThemeColor(){ const m=document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", curTheme()==="dark" ? "#100D06" : "#F5D55E"); }
function toggleTheme(){
  const t=curTheme()==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem(THKEY, t); }catch(e){}

}

/* ======================= Kleine Meldungen ======================= */
function toast(html, icon, ms){
  let box=$("toasts");
  if (!box){ box=document.createElement("div"); box.id="toasts"; box.setAttribute("role","status"); box.setAttribute("aria-live","polite"); document.body.appendChild(box); }
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=(icon||"")+`<span>${html}</span>`;
  box.appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(), 420); }, ms||3200);
}
function confetti(el, n){
  if (REDUCED || !el) return;
  const b=el.getBoundingClientRect();
  const fx=document.createElement("div"); fx.className="fx"; fx.setAttribute("aria-hidden","true");
  for (let k=0;k<n;k++){
    const s=document.createElement("i");
    s.style.left=(b.left+b.width*(.1+Math.random()*.8))+"px"; s.style.top=(b.top+b.height*.5)+"px";
    const ang=Math.random()*Math.PI*2, dist=70+Math.random()*230;
    s.style.setProperty("--dx",(Math.cos(ang)*dist).toFixed(0)+"px");
    s.style.setProperty("--dy",(Math.sin(ang)*dist-50).toFixed(0)+"px");
    s.style.setProperty("--r",(Math.random()*720-360).toFixed(0)+"deg");
    s.style.setProperty("--c",["var(--gold)","var(--hot)","var(--t3)","var(--t4)","var(--t2)"][Math.floor(Math.random()*5)]);
    s.style.animationDelay=(Math.random()*160).toFixed(0)+"ms";
    fx.appendChild(s);
  }
  document.body.appendChild(fx); setTimeout(()=>fx.remove(), 1600);
}
function countUp(el, to, ms){
  if (!el) return;
  if (REDUCED || !(to>0)){ el.textContent=to; return; }
  const t0=performance.now();
  (function f(now){
    if (!el.isConnected) return;
    const p=Math.min(1, Math.max(0, (now-t0)/ms));
    el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
    if (p<1) requestAnimationFrame(f);
  })(t0);
}

/* ======================= Level & Titel ======================= */
const lvlNeed=L=>50*(L-1)*(L+2);
function levelOf(xp){
  xp=Math.max(0, Math.round(Number(xp)||0));
  let L=1; while (L<99 && lvlNeed(L+1)<=xp) L++;
  const a=lvlNeed(L), b=lvlNeed(L+1);
  return {lvl:L, xp, into:xp-a, span:b-a, left:b-xp, pct:Math.max(0, Math.min(100, Math.round((xp-a)*100/(b-a))))};
}

const AV_INK=["#1D1705","#1D1705","#FFFFFF","#FFFFFF","#FFFFFF","#FFFFFF","#1D1705","#FFFFFF","#1D1705","#FFFFFF"];
