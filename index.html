async function drawAI(){
  const themes=shuffle(THEMES).slice(0,ROUND_LEN);
  const avoid=BANK.map(b=>b.q).concat(recentAI).slice(-80);
  const prompt=`Du erstellst Fragen für ein deutschsprachiges Ratespiel. Prinzip: Jede Frage hat sehr viele richtige Antworten. Wer eine seltene, aber korrekte Antwort nennt, bekommt mehr Punkte.

Regeln für jede Frage:
- Formuliere sie auf Deutsch als Aufforderung, die mit "Nenne" beginnt, z. B. "Nenne ein Säugetier, das in Afrika lebt."
- Die Menge der richtigen Antworten muss klar abgegrenzt und überprüfbar sein (keine Meinungsfragen, nichts, was sich ständig ändert).
- Die Fragen dürfen diesen bereits verwendeten nicht ähneln: ${avoid.join(" | ")}
- Liste die richtigen Antworten in genau 5 Stufen nach geschätzter Häufigkeit, mit der Leute sie spontan nennen würden:
  Stufe 0: die 3–8 naheliegendsten Antworten.
  Stufe 1: 6–15 beliebte Antworten.
  Stufe 2: 10–30 seltenere Antworten.
  Stufe 3: 10–30 Raritäten, die nur Kenner nennen.
  Stufe 4: 5–30 sehr obskure, aber nachweislich korrekte Antworten.
- Nur sachlich korrekte Antworten. Lieber weglassen als raten.
- Gleiche Sache, andere Schreibweise: im selben Eintrag mit "/" trennen, z. B. "Karotte/Möhre".
- Füge 2–6 typische Fehlantworten mit kurzer, freundlicher Erklärung auf Deutsch hinzu.

Antworte nur mit JSON in dieser Form:
{"fragen":[{"k":"Thema","q":"Nenne …","t":[["…"],["…"],["…"],["…"],["…"]],"x":[{"a":"Fehlantwort/Schreibweise","m":"Erklärung"}]}]}`;
  const data=await sample.json(prompt, {modelTier:"default", cache:false});
  const list=(data && Array.isArray(data.fragen)) ? data.fragen : [];
  const qs=[];
  for (const f of list){
    if (!f || typeof f.q!=="string" || !Array.isArray(f.t) || f.t.length!==5) continue;
    const t=f.t.map(l=>Array.isArray(l) ? l.filter(s=>typeof s==="string" && s.trim()).map(s=>s.replace(/[|?]/g," ")) : []);
    if (t.some(l=>!l.length)) continue;
    const Q=prepare({k:String(f.k||"Claude").slice(0,40), q:f.q.slice(0,200), t, x:Array.isArray(f.x)?f.x.filter(o=>o && typeof o.a==="string" && typeof o.m==="string"):[], src:"ai"});
    if (Q.entries.length>=12) qs.push(Q);
  }
  if (qs.length<3) throw {code:"few"};
  qs.forEach(Q=>recentAI.push(Q.q)); recentAI=recentAI.slice(-40);
  return qs.slice(0,ROUND_LEN);
}

function berlinParts(){ const o={}; new Intl.DateTimeFormat("en-GB",{timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"}).formatToParts(new Date()).forEach(p=>{ o[p.type]=p.value; }); return o; }

function hashStr(s){ let h=2166136261; for (const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function dailyPick(key){
  const order=BANK.map((b,i)=>({i, h:hashStr(key+"|"+b.q)})).filter(o=>!BANK[o.i].since || BANK[o.i].since<=key).sort((a,b)=>a.h-b.h || a.i-b.i);

}

function qIndex(id){ if (!QIDX){ QIDX=new Map(); BANK.forEach((_,i)=>QIDX.set(qidOf(i), i)); } return QIDX.get(id); }
function duelParam(){ try{ return cleanCode(new URLSearchParams(location.search).get("duell")); }catch(e){ return ""; } }
function clearDuelParam(){ try{ const q=new URLSearchParams(location.search); if (q.has("duell") || q.has("spieler")) history.replaceState(null, "", location.pathname+location.hash); }catch(e){} }
function duelLink(code){ let base=""; try{ base=location.origin+location.pathname; }catch(e){} return base+"?duell="+code; }
function pickDuelQs(n){
  n=n||ROUND_LEN;
  const daily=new Set(dailyPick(dayKey()));
  const cand=shuffle(BANK.map((_,i)=>i).filter(i=>!daily.has(i)));
  const pick=[], cats=new Set();
  for (const i of cand){ if (pick.length>=n) break; if (!cats.has(BANK[i].k)){ pick.push(i); cats.add(BANK[i].k); } }
  for (const i of cand){ if (pick.length>=n) break; if (!pick.includes(i)) pick.push(i); }
  return pick;
}

let dchain=Promise.resolve();
function saveDuel(du, results, done){
  const tiers=results.map(r=>r.tier);
  const answers=results.map(r=>r.tier>=0 && r.name ? String(r.name).slice(0,60) : "");
  const p=dchain.then(()=>rpc("save_duel", {p_code:du.code, p_secret:du.secret, p_tiers:tiers, p_answers:answers, p_done:!!done}))
    .then(()=>{ if (done && duelLocal[du.code]){ duelLocal[du.code].status="done"; saveDuelLocal(); } return true; },
          e=>{ console.warn("Duell speichern fehlgeschlagen", e); return e||{code:"unknown"}; });
  dchain=p.then(()=>{});
  return p;
}
function saveDuelDone(){
  const s=state;
  saveDuel(s.duel, s.results, true).then(res=>{ if (res===true) refreshMe(); if (state!==s) return; const w=$("saveWarn"); if (w) w.hidden = res===true; });
}

/* Duell öffnen – über den Link oder die Startseite */
let duelPoll=null;
function stopDuelPoll(){ clearInterval(duelPoll); duelPoll=null; }
const fetchDuel=code=>rpc("get_duel", {p_code:code, p_player:local.playerId});
async function openDuel(raw){
  const code=cleanCode(raw);
  if (!dailyAvailable()){ state={screen:"duelnew"}; render(); return; }
  if (roomOk(code)) return joinRoom(code);          // vier Ziffern: der Raum-Code eines Live-Duells
  state={screen:"duelload", code}; render();
  await dchain;
  let d=null, err=null;
  try{ d=await fetchDuel(code); }catch(e){ err=e; }
  if (state.screen!=="duelload" || state.code!==code) return;
  if (!err && !d){                                  // kein Duell-Ergebnis: eine Lobby oder ein laufendes Spiel?
    let lb=null;
    try{ lb=await rpc("lobby_poll", {p_code:code, p_player:local.playerId, p_here:false}); }catch(e){ if (!(e && e.status===404)) err=e; }
    if (state.screen!=="duelload" || state.code!==code) return;
    if (lb && Array.isArray(lb.players)){
      if (lb.final && lb.phase==="done") return showLobbyResult(lb);
      if (lb.in) return openLive(lb.code);          // läuft noch und ich bin dabei: wieder hinein
      if (lb.phase==="open" && !lb.kicked) return joinRoom(lb.room);
      return showLobbyWatch(lb);                    // nur zuschauen
    }
  }
  if (err || !d){ state={screen:"duelerr", msg:duelErr(err||{code:"not_found"})}; render(); return; }
  // Abgebrochener eigener Versuch: zählt mit dem bisherigen Stand.
  const mine=duelLocal[code], side=d.role && d[d.role];
  if (mine && mine.secret && mine.status!=="done" && side && side.status==="playing"){
    const tiers=(side.tiers||[]).slice(0,ROUND_LEN), answers=(side.answers||[]).slice(0,ROUND_LEN);
    while (tiers.length<ROUND_LEN){ tiers.push(-1); answers.push(""); }
    try{ await rpc("save_duel", {p_code:code, p_secret:mine.secret, p_tiers:tiers, p_answers:answers, p_done:true}); mine.status="done"; saveDuelLocal(); d=await fetchDuel(code); }catch(e){}
    if (state.screen!=="duelload" || state.code!==code) return;
  }
  if (!d.role && !d.b){ state={screen:"duelinvite", code, data:d}; render(); return; }
  if (d.role && !duelLocal[code]){ duelLocal[code]={role:d.role, secret:null, at:Date.now(), status:"done"}; saveDuelLocal(); }
  showDuel(d);
}
function showDuel(d){
  stopDuelPoll();
  state={screen:"duel", code:d.code, data:d}; render();
  if (d.final){
    if (!(d.live && d.role)) return;
    let n=0;                                        // nach einem Live-Duell: Will der andere eine Revanche?
    duelPoll=setInterval(async()=>{
      if (state.screen!=="duel" || state.code!==d.code || ++n>90){ stopDuelPoll(); return; }
      try{
        const x=await fetchDuel(d.code);
        if (x && state.screen==="duel" && state.code===d.code && JSON.stringify(x.rematch||null)!==JSON.stringify(state.data.rematch||null)){ state.data.rematch=x.rematch||null; paintRematch(); }
      }catch(e){}
    }, 2500);
    return;
  }
  duelPoll=setInterval(async()=>{
    if (state.screen!=="duel" || state.code!==d.code){ stopDuelPoll(); return; }
    try{
      const n=await fetchDuel(d.code);
      if (n && state.screen==="duel" && state.code===d.code && JSON.stringify(n)!==JSON.stringify(state.data)) showDuel(n);
    }catch(e){}
  }, 12000);
}

async function joinDuel(d, tag){
  const qi=d.qids.map(qIndex);
  if (qi.some(i=>i===undefined)) return duelErr({code:"gone"});
  let secret;
  try{ secret=await rpc("join_duel", {p_code:d.code, p_player:local.playerId, p_name:tag}); }
  catch(e){
    if (e.code==="own_duel" || e.code==="already_joined"){ openDuel(d.code); return ""; }
    return duelErr(e);
  }
  if (typeof secret!=="string") return duelErr(null);
  duelLocal[d.code]={role:"b", secret, at:Date.now(), status:"playing"}; saveDuelLocal();
  beginWith(qi.map(getQ), "", null, {code:d.code, role:"b", secret, me:tag});
  return "";
}

/* Auswertung */
function duelOutcome(d){
  const A=d.a, B=d.b||{};
  const rows=d.qids.map((id,j)=>{
    const i=qIndex(id);
    const ta=Number.isInteger(A.tiers?.[j])?A.tiers[j]:-1, tb=Number.isInteger(B.tiers?.[j])?B.tiers[j]:-1;
    const aa=String(A.answers?.[j]||""), ab=String(B.answers?.[j]||"");
    const same=ta>=0 && tb>=0 && !!aa && norm(aa)===norm(ab);
    const pa=(same||ta<0)?0:TIERS[ta].pts, pb=(same||tb<0)?0:TIERS[tb].pts;
    const win=same?0:(ta>tb?1:tb>ta?2:0);
    return {q:i===undefined?"(Diese Frage gibt es nicht mehr)":BANK[i].q, ta, tb, aa, ab, same, pa, pb, win};
  });
  const wa=rows.filter(r=>r.win===1).length, wb=rows.filter(r=>r.win===2).length;
  const sa=rows.reduce((s,r)=>s+r.pa,0), sb=rows.reduce((s,r)=>s+r.pb,0);
  const winner=wa>wb?"a":wb>wa?"b":sa>sb?"a":sb>sa?"b":null;
  return {rows, wa, wb, sa, sb, winner};
}

const duelSeen=new Set();
function renderDuel(){
  const d=state.data, role=d.role, A=d.a, B=d.b;
  const other=role==="a"?B:role==="b"?A:null;
  sideOverride={pids:[A.pid, B ? B.pid : null]};
  let head, body, anim=null;
  if (d.final){
    const o=duelOutcome(d), wn=o.winner==="a"?A.name:o.winner==="b"?B.name:"";
    head=!o.winner ? "Unentschieden!" : o.winner===role ? "Du gewinnst!" : `${esc(wn)} gewinnt!`;
    const play=!REDUCED && !duelSeen.has(d.code);
    duelSeen.add(d.code);
    if (play) anim={o, head};
    const side=(x,k,score)=>`<div class="vside${!play && o.winner===k?" won":""}${role===k?" me":""}" id="vside_${k}">${avatarHTML(x.pid, x.name, "l")}${pidBtn(x.pid, x.name, "tagname")}${role===k?`<span class="you">Du</span>`:""}<b class="vscore" id="vscore_${k}">${play?0:score}</b><small>Punkte</small></div>`;
    body=`<div class="vs">${side(A,"a",o.sa)}<div class="vmid"><span class="vsbadge">VS</span><b id="vrounds">${play?"0:0":o.wa+":"+o.wb}</b><small>Fragen</small></div>${side(B,"b",o.sb)}</div>
      <ol class="drows" lang="de">${o.rows.map((r,j)=>`<li class="drow" style="--i:${j}">
        <div class="dq"><span>${j+1}.</span> ${esc(r.q)}</div>
        ${duelAnsHTML(r.ta, r.aa, r.win===1, r.same)}

        ${duelAnsHTML(r.tb, r.ab, r.win===2, r.same)}

      </li>`).join("")}</ol>`;
  } else {

      : role && other && other.status==="playing" ? `${esc(other.name)} hat ${other.n} von ${ROUND_LEN} Fragen beantwortet. Die Seite aktualisiert sich von selbst.`

    const wside=(x,k)=> x ? `<div class="vside${role===k?" me":""}">${avatarHTML(x.pid, x.name, "l")}${pidBtn(x.pid, x.name, "tagname")}${role===k?`<span class="you">Du</span>`:""}<small>${x.status==="done"?"fertig":`${Number(x.n)||0} von ${ROUND_LEN} Fragen`}</small></div>`
      : `<div class="vside ghost"><span class="av l" style="--avc:transparent;--avt:var(--muted)" aria-hidden="true">?</span><span class="tagname">???</span><small>noch niemand</small></div>`;
    body=`<div class="vs">${wside(A,"a")}<div class="vmid"><span class="vsbadge">VS</span></div>${wside(B,"b")}</div>
      ${sub?`<p class="lede" style="font-size:17px">${sub}</p>`:""}
      ${role==="a" && !B ? sharePanelHTML(d.code) : ""}
      ${mine && Array.isArray(mine.tiers) && mine.tiers.length ? `<div class="stack" style="gap:8px"><span class="label">Deine Antworten · ${Number(mine.score)||0} Punkte</span>
        <ol class="drows mineonly" lang="de">${d.qids.map((id,j)=>{ const i=qIndex(id), t=Number.isInteger(mine.tiers[j])?mine.tiers[j]:-1;

  }
  view.innerHTML=`<section class="card stack narrow duelcard${anim?" anim":""}" id="duelCardBox">

    ${d.live && d.final && role ? `<p class="fb bad" id="rmErr" role="alert" style="min-height:0"></p>` : ""}
    <div class="row">

      <button class="btn ghost small" id="menu3" type="button">Zum Start</button>
    </div>
  </section>`;
  const liveFin=!!(d.live && d.final && role);
  $("duRematch").onclick=liveFin ? ()=>liveRematch(d.code) : ()=>{ state={screen:"duelnew"}; render(); };
  if (liveFin) paintRematch();
  $("freeGo").onclick=startRound;
  $("menu3").onclick=()=>{ state={screen:"start"}; render(); };
  if (role==="a" && !B) wireShare(d.code, A.name);
  wirePidLinks(view);
  if (anim) [A, B].forEach(x=>{ if (x && x.pid) avAt.delete(x.pid); });

}
/* Auswertung Frage für Frage aufdecken, die Zähler laufen mit */
async function animateDuel(an, d){
  const s=state, o=an.o, tok={skip:false}, card=$("duelCardBox");
  const bump=el=>{ if (el){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); } };
  if (card) card.addEventListener("click", ()=>{ tok.skip=true; card.classList.remove("anim"); }, {once:true});
  let wa=0, wb=0, sa=0, sb=0;
  await pause(450, tok);
  for (const r of o.rows){
    await pause(270, tok);
    if (state!==s) return;
    if (r.win===1) wa++; if (r.win===2) wb++;
    sa+=r.pa; sb+=r.pb;
    const vr=$("vrounds"), va=$("vscore_a"), vb=$("vscore_b");
    if (vr) vr.textContent=wa+":"+wb;
    if (va) va.textContent=sa;
    if (vb) vb.textContent=sb;
    if (r.win){ bump(vr); bump(r.win===1?va:vb); }
    if (!tok.skip){
      const mine = d.role==="a" ? r.win===1 : d.role==="b" ? r.win===2 : r.win>0;
      sfx(r.win && mine ? "point" : "nopoint");
    }
    await pause(250, tok);
  }
  await pause(350, tok);
  if (state!==s) return;
  const h=$("duelHead"); if (h){ h.innerHTML=an.head; h.classList.add("pop"); }
  const wside=o.winner ? $("vside_"+o.winner) : null;
  if (wside) wside.classList.add("won");
  const won=!!o.winner && o.winner===d.role;
  sfx(!o.winner ? "draw" : (won || !d.role) ? "win" : "lose");
  if (wside && (won || !d.role)) confetti(wside, 64);
  buzz(won ? [30,40,80] : 20);
}

/* ======================= Live-Duell in Lobbys: 2 bis 9 Spieler, gemeinsame Uhr =======================
   Eine Lobby ist privat (nur mit Code oder Link) oder öffentlich (steht in der Liste). Der Gastgeber kann
   Spieler entfernen und startet das Spiel. Die Uhr führt die Datenbank: Sie nennt den Start jeder Frage
   und jeder Auflösung. Die Seite fragt den Stand etwa einmal pro Sekunde ab (lobby_poll), rechnet die
   Serverzeit auf die eigene Uhr um und zeigt danach Countdown, Frage und Auflösung. Was die anderen
   geantwortet haben, kommt erst zur Auflösung. */
const roomOk=v=>/^\d{4}$/.test(String(v||""));
const LIVE_ERR={not_found:"Diese Lobby gibt es nicht (mehr). Prüf den Code.", full:"Diese Lobby ist schon voll.",
  kicked:"Der Gastgeber hat dich aus dieser Lobby entfernt.", not_host:"Das kann nur der Gastgeber.",
  need_players:"Zum Starten muss mindestens ein Gegner in der Lobby sein.", already_started:"Das Spiel läuft schon.",
  cap_too_small:"So wenige Plätze gehen nicht – es sind schon mehr Spieler in der Lobby.", bad_nq:"Es gehen 3 bis 10 Fragen.", bad_cap:"Es gehen 2 bis 9 Spieler.",
  need_account:"Dafür brauchst du ein Profil. Bitte melde dich an.", too_many:"Du hast heute schon sehr viele Lobbys geöffnet. Morgen geht’s weiter.",
  network:"Keine Verbindung. Prüf dein Internet und versuch es nochmal.", not_done:"Das Spiel läuft noch.", not_allowed:"Du warst bei diesem Spiel nicht dabei.",
  gone:"Dieses Spiel nutzt Fragen, die deine Seite nicht kennt. Lade die Seite neu und versuch es nochmal."};
const liveErr=e=>(e && e.status===404) ? "Die Lobbys sind noch nicht eingerichtet: In Supabase muss einmal das Skript setup.sql laufen."
  : LIVE_ERR[e && e.code] || "Das hat nicht geklappt. Versuch es nochmal.";
let live=null;
function setDuelParam(code){ try{ history.replaceState(null, "", location.pathname+"?duell="+encodeURIComponent(code)+location.hash); }catch(e){} }
const liveNow=()=>Date.now()+(live ? live.off : 0);
const LOBBY_MAX_OPP=8, LOBBY_MIN_Q=3, LOBBY_MAX_Q=10;
const ZU_N={2:"zweit", 3:"dritt", 4:"viert", 5:"fünft", 6:"sechst", 7:"siebt", 8:"acht", 9:"neunt"};
const LBKEY="heuhaufen:lobby";
function lobbyPref(){ const d={pub:false, opp:1, nq:ROUND_LEN}; try{ const o=JSON.parse(localStorage.getItem(LBKEY)||"{}"); if (o && typeof o==="object"){ d.pub=!!o.pub; const n=Math.round(Number(o.opp)); if (n>=1 && n<=LOBBY_MAX_OPP) d.opp=n; const q=Math.round(Number(o.nq)); if (q>=LOBBY_MIN_Q && q<=LOBBY_MAX_Q) d.nq=q; } }catch(e){} return d; }
const nQ=d=>(d && Array.isArray(d.qids) ? d.qids.length : 0) || ROUND_LEN;
const fragen=n=>`${n} ${n===1?"Frage":"Fragen"}`;
function saveLobbyPref(p){ try{ localStorage.setItem(LBKEY, JSON.stringify(p)); }catch(e){} }

/* Lobby öffnen / betreten */
async function createRoom(pub, opp, nq){
  let r;
  const q=Math.min(LOBBY_MAX_Q, Math.max(LOBBY_MIN_Q, nq|0 || ROUND_LEN));
  try{ r=await rpc("lobby_create", {p_player:local.playerId, p_qids:pickDuelQs(LOBBY_MAX_Q).map(qidOf), p_public:!!pub, p_cap:Math.min(LOBBY_MAX_OPP, Math.max(1, opp|0))+1, p_nq:q}); }catch(e){ return liveErr(e); }
  if (!r || !r.code) return liveErr(null);
  openLive(r.code);
  return "";
}
async function joinRoom(room){
  if (!dailyAvailable()){ state={screen:"duelnew"}; render(); return; }
  if (!account()) return openAuth({to:"join", code:room}, "register", "Zum Mitspielen brauchst du ein Profil – das geht in ein paar Sekunden.");
  state={screen:"duelload", code:room}; render();
  let r=null, err=null;
  try{ r=await rpc("lobby_join", {p_player:local.playerId, p_room:room}); }catch(e){ err=e; }
  if (state.screen!=="duelload" || state.code!==room) return;
  if (err || !r || !r.code){ state={screen:"duelerr", msg:liveErr(err)}; render(); return; }
  openLive(r.code);
}
function openLive(code){
  liveStop();
  state={screen:"live", code, tries:[], fb:"", fbBad:false};
  live={code, d:null, qs:null, off:0, samples:[], t:null, iv:null, busy:false, again:false, fails:0, lastOk:Date.now(), keep:false,
        sig:"", qi:-1, mine:{}, played:{}, oppAns:{}, tok:null, cnt:null, tickSec:null, rk:-1, fresh:false, rejoin:false, n0:0};
  setDuelParam(code);
  render();
  live.iv=setInterval(liveFrame, 100);
  livePoll();
}
let liveTitle0=null;
function liveTitle(t){ try{ if (t){ if (liveTitle0==null) liveTitle0=document.title; document.title=t+" – Heuhaufen"; } else if (liveTitle0!=null){ document.title=liveTitle0; liveTitle0=null; } }catch(e){} }
function liveStop(){
  const L=live; if (!L) return;
  live=null; liveTitle(null);
  clearTimeout(L.t); clearInterval(L.iv);
  if (L.tok) L.tok.skip=true;
  // Vor dem Start weggegangen: Platz freigeben (geht der Gastgeber, übernimmt der Nächste – oder die Lobby schließt).
  if (!L.keep && L.d && L.d.in && L.d.q_at==null) rpc("lobby_leave", {p_code:L.code, p_player:local.playerId}).catch(()=>{});
}

/* Abfragen */
function liveDelay(){
  const ph=liveView().ph;
  return ph==="revwait" ? 250 : ph==="reveal" ? 2500 : ph==="ask" ? 900 : ph==="load" ? 600 : 1000;
}
function liveKick(){ const L=live; if (!L) return; if (L.busy){ L.again=true; return; } clearTimeout(L.t); L.t=null; livePoll(); }
function liveFail(msg){ const L=live; if (L) L.keep=true; state={screen:"duelerr", msg}; render(); }
async function livePoll(){
  const L=live; if (!L || L.busy) return;
  L.busy=true; clearTimeout(L.t); L.t=null;
  const t0=Date.now(); let d, err=null;
  const here=!!(L.d && L.d.q_at!=null) || document.visibilityState!=="hidden";      // vor dem Start zählt nur, wer die Seite vor sich hat
  try{ d=await rpc("lobby_poll", {p_code:L.code, p_player:local.playerId, p_here:here}); }catch(e){ err=e; }
  const t1=Date.now();
  if (live!==L) return;
  L.busy=false;
  if (err){
    L.fails++;
    if (err.status===404 || (!L.d && L.fails>=3)) return liveFail(liveErr(err));
  } else if (!d){
    return liveFail(L.d && !L.d.host ? "Die Lobby wurde geschlossen." : "Diese Lobby gibt es nicht mehr.");
  } else if (!d.in){
    if (d.kicked) return liveFail(LIVE_ERR.kicked);
    if (d.phase==="open" && !L.rejoin){
      L.rejoin=true;                                   // Platz verloren (z. B. Seite länger im Hintergrund): einmal wieder hinein
      try{ await rpc("lobby_join", {p_player:local.playerId, p_room:d.room}); }catch(e){ if (live===L) return liveFail(liveErr(e)); }
      if (live!==L) return;
    } else { const code=L.code; L.keep=true; liveStop(); openDuel(code); return; }       // läuft ohne mich: nur zuschauen
  } else { L.fails=0; L.lastOk=t1; L.rejoin=false; liveApply(d, t0, t1); }
  if (live!==L) return;
  const again=L.again; L.again=false;
  L.t=setTimeout(livePoll, again ? 0 : liveDelay());
}
function liveApply(d, t0, t1){
  const L=live; if (!L || !d || typeof d.now!=="number" || !Array.isArray(d.players)) return;
  if (t1>=t0){
    L.samples.push({rtt:t1-t0, off:d.now-(t0+t1)/2}); if (L.samples.length>8) L.samples.shift();
    L.off=L.samples.reduce((b,s)=>s.rtt<b.rtt ? s : b).off;       // die schnellste Abfrage misst die Uhr am genauesten
  }
  if (L.d && d.now<L.d.now) return;                               // ältere Antwort, die später ankam
  const prev=L.d; L.d=d;
  const qsig=(d.qids||[]).join(",");
  if (!L.qs || L.qsig!==qsig){
    L.qsig=qsig;
    L.qs=(d.qids||[]).map(id=>{ const i=qIndex(id); return i===undefined ? null : getQ(i); });
    if (!L.qs.length || L.qs.some(q=>!q)) return liveFail(LIVE_ERR.gone);
  }
  if (prev && d.q_at==null && d.players.length>prev.players.length){      // jemand ist dazugekommen
    sfx("up"); buzz(30);
    if (document.visibilityState==="hidden"){ const nu=d.players.find(p=>!prev.players.some(q=>q.pid===p.pid)); liveTitle(`${nu ? nu.name : "Jemand"} ist da!`); }
  }
  if (d.q_at!=null && !duelLocal[d.code]){ duelLocal[d.code]={role:"a", secret:null, at:Date.now(), status:"done"}; saveDuelLocal(); }
  liveFrame();
}

/* Wo stehen wir gerade? Aus dem letzten Stand der Datenbank und der Uhr berechnet. */
function liveView(){
  const L=live, d=L && L.d;
  if (!d) return {ph:"load"};
  if (d.q_at==null) return {ph:"open"};
  const now=liveNow();
  let i=d.i, q=d.q_at, rev=d.rev_at;
  for (;;){
    if (now<q) return {ph:"count", i, q};
    const revT = rev!=null ? rev : q+d.ask_ms+d.grace_ms;
    if (now<revT) return {ph:"ask", i, q, end:q+d.ask_ms, revT};
    if (!(d.open>i)) return {ph:"revwait", i, q, end:q+d.ask_ms, revT};     // Auflösung fällig, die Antworten fehlen noch
    if (now<revT+d.reveal_ms) return {ph:"reveal", i, revT, next:revT+d.reveal_ms, last:i>=nQ(d)-1};
    if (i>=nQ(d)-1) return {ph:"done"};
    i++; q=revT+d.reveal_ms; rev=null;                                       // die nächste Frage beginnt nach fester Zeit
  }
}
const liveMeIdx=d=>d.players.findIndex(p=>p.me);
function liveMine(i){
  const L=live; if (!L) return null;
  if (L.mine[i]) return L.mine[i];
  const me=L.d && L.d.players.find(p=>p.me);
  if (me && Array.isArray(me.tiers) && me.tiers.length>i) return (L.mine[i]={tier:me.tiers[i], name:(me.answers||[])[i]||"", typed:"", how:me.tiers[i]<0?"pass":"", sent:true});
  return null;
}
/* Wertung der ersten n Fragen: gleiche Antworten zählen für keinen; die Runde holt, wer als Einziger am tiefsten landet. */
function lobbyOutcome(d, n){
  const P=d.players, N=P.length;
  const tot=P.map(()=>({rounds:0, pts:0}));
  const rows=[];
  for (let j=0;j<n;j++){
    const qi=qIndex((d.qids||[])[j]);
    const per=P.map(p=>{ const t=Number.isInteger(p.tiers && p.tiers[j]) ? p.tiers[j] : -1; return {t, a:String((p.answers && p.answers[j])||""), dup:false, vt:-1, pts:0, win:false}; });
    const seen=new Map();
    per.forEach(x=>{ if (x.t>=0 && x.a){ const k=norm(x.a)||x.a.toLowerCase(); seen.set(k, (seen.get(k)||0)+1); } });
    per.forEach(x=>{ if (x.t>=0 && x.a){ const k=norm(x.a)||x.a.toLowerCase(); x.dup=seen.get(k)>1; } x.vt=(x.t>=0 && !x.dup) ? x.t : -1; x.pts=x.vt>=0 ? TIERS[x.vt].pts : 0; });
    const top=Math.max(-1, ...per.map(x=>x.vt)), at=per.filter(x=>x.vt===top).length;
    const win=top>=0 && at===1 ? per.findIndex(x=>x.vt===top) : -1;
    if (win>=0){ per[win].win=true; tot[win].rounds++; }
    per.forEach((x,k)=>{ tot[k].pts+=x.pts; });
    rows.push({q:qi===undefined ? "(Diese Frage gibt es nicht mehr)" : BANK[qi].q, per, top, win, anyDup:per.some(x=>x.dup), anyHit:per.some(x=>x.t>=0)});
  }
  const order=P.map((_,k)=>k).sort((a,b)=>tot[b].rounds-tot[a].rounds || tot[b].pts-tot[a].pts || a-b);
  const place=P.map(()=>1);
  order.forEach((k,pos)=>{ const better=order.filter(o=>tot[o].rounds>tot[k].rounds || (tot[o].rounds===tot[k].rounds && tot[o].pts>tot[k].pts)).length; place[k]=better+1; });
  const firsts=order.filter(k=>place[k]===1);
  return {rows, tot, order, place, winner:firsts.length===1 ? firsts[0] : -1, N};
}

/* Zehnmal pro Sekunde: Phase prüfen, bei einem Wechsel neu zeichnen, sonst nur Uhr und Status nachführen. */
function liveFrame(){
  const L=live; if (!L || state.screen!=="live") return;
  const v=liveView(), d=L.d;
  if (v.ph==="done"){
    const code=L.code, data=d; L.keep=true; liveStop(); refreshMe();
    if (data.players.length===2) openDuel(code); else showLobbyResult(data);
    return;
  }
  if (v.ph==="ask" || v.ph==="revwait"){
    if (L.qi!==v.i){ L.qi=v.i; L.tickSec=null; L.fresh=true; state.tries=[]; state.fb=""; state.fbBad=false; sfx("go"); liveKick(); }
    if (!liveMine(v.i) && liveNow()>=v.end){ L.mine[v.i]={tier:-1, name:"", typed:"", how:"timeout", sent:true}; sfx("timeout"); buzz([60,50,60]); }
    if (v.ph==="revwait" && L.rk!==v.i){ L.rk=v.i; liveKick(); }
  }
  const mine = v.ph==="ask" || v.ph==="revwait" ? liveMine(v.i) : null;
  const lob = d && v.ph==="open" ? d.players.map(p=>p.pid+(p.here?"+":"-")+(p.host?"h":"")).join(",")+"|"+d.cap+"|"+(d.public?1:0)+"|"+(d.host?1:0)+"|"+nQ(d) : "";
  const sig=[v.ph==="revwait" ? "ask" : v.ph, v.i, mine ? (mine.how||"ok") : "", d ? d.players.length : 0, lob].join("|");
  if (sig!==L.sig){ L.sig=sig; renderLive(v); }
  else liveDyn(v);
}

function renderLive(v){
  const L=live; if (!L) return;
  if (L.tok){ L.tok.skip=true; L.tok=null; }
  const d=L.d;
  if (!d){ view.innerHTML=`<section class="card stack narrow"><div class="loading"><span class="spin" aria-hidden="true"></span><span>Die Lobby wird geöffnet …</span></div></section>`; return; }
  v=v||liveView();
  sideOverride={pids:[d.players[0] ? d.players[0].pid : null, d.players.length===2 ? d.players[1].pid : null]};
  if (v.ph==="open") liveLobby(d);
  else if (v.ph==="count") liveCount(d, v);
  else if (v.ph==="ask" || v.ph==="revwait") liveAsk(d, v);
  else if (v.ph==="reveal") liveShow(d, v);
  else return;
  loadAvatars(view);
  paintCharms();
  liveDyn(v);
}

/* Die Lobby: Code, Spielerliste, Kicken, Start */
function liveLobby(d){
  const room=String(d.room||""), P=d.players, host=P.find(p=>p.host), n=P.length;
  const rows=P.map(p=>`<li class="lbp${p.me?" me":""}${p.here?"":" away"}">${avatarHTML(p.pid, p.name, "m")}

      <small class="lbst">${p.here ? "bereit" : "gerade nicht da"}</small>
      ${d.host && !p.me ? `<button class="btn ghost small lbkick" type="button" data-kick="${esc(p.pid)}" data-name="${esc(p.name)}">Kicken</button>` : ""}</li>`).join("")
    +Array.from({length:Math.max(0, d.cap-n)}, ()=>`<li class="lbp free"><span class="av m" style="--avc:transparent;--avt:var(--muted)" aria-hidden="true">?</span><span class="lbn hint">frei</span></li>`).join("");
  const ready=P.filter(p=>p.here || p.me).length;
  view.innerHTML=`<section class="card stack narrow livecard">
    <span class="label">Lobby · ${d.public ? "öffentlich" : "privat"} · ${n} von ${d.cap} Spielern · ${fragen(nQ(d))}</span>
    <h2>${d.host ? "Deine Lobby" : `Lobby von ${esc(host ? host.name : "???")}`}</h2>
    <div class="lbtop">
      <div class="roomcode${live && !live.lobbyShown ? " anim" : ""}" role="img" aria-label="Code ${esc(room.split("").join(" "))}">${room.split("").map(c=>`<span>${esc(c)}</span>`).join("")}</div>

function liveSubmit(val){
  const L=live; if (!L) return;
  const v=liveView();
  if (v.ph!=="ask" || liveMine(v.i) || liveNow()>=v.end) return;
  const Q=L.qs[v.i], typed=String(val).trim(), res=judge(Q, typed);
  if (res.type==="empty") return;
  if (res.type==="ok") return liveAnswer(v.i, res.e.tier, res.e.name, typed, "");
  if (res.type==="nope") return bad(res.msg+" Versuch’s nochmal.", typed);
  bad(`„${typed}“ steht nicht auf unserer Liste. Probier was anderes.`, typed);
}
function liveAnswer(i, tier, name, typed, how){
  const L=live; if (!L || liveMine(i)) return;
  const m={tier, name, typed, how:how||"", sent:false}; L.mine[i]=m;
  sfx(tier>=0 ? "lock" : "pass"); buzz(15);
  liveFrame();
  (async function send(n){
    const t0=Date.now(); let d;
    try{ d=await rpc("lobby_answer", {p_code:L.code, p_player:local.playerId, p_i:i, p_tier:tier, p_answer:tier>=0 ? String(name).slice(0,60) : ""}); }
    catch(e){
      if (live!==L) return;
      if (e.code==="already"){ m.sent=true; return; }
      if (e.code==="too_late"){ if (tier>=0){ L.mine[i]={tier:-1, name:"", typed:"", how:"late", sent:true}; liveFrame(); } return; }
      if (e.code==="network" || (e.status>=500 && e.status<600)){ if (n<40) setTimeout(()=>{ if (live===L && !L.played[i]) send(n+1); }, 600); }
      return;
    }
    if (live!==L) return;
    m.sent=true; liveApply(d, t0, Date.now());
  })(0);
}

/* Auflösung: Alle Nadeln sinken gleichzeitig. Zu zweit in zwei großen Schächten, sonst in Bahnen nebeneinander. */
function liveVerdict(d, r){
  const P=d.players, mi=liveMeIdx(d), two=P.length===2;
  if (two && r.per[0].dup) return {cls:"same", t:"Gleiche Antwort!", s:"Die zählt für keinen."};
  if (!r.anyHit) return {cls:"none", t:"Keiner trifft.", s:"Diese Runde bleibt ohne Sieger."};
  const dupNote=r.anyDup ? " Gleiche Antworten zählen nicht." : "";
  if (r.win<0) return r.top<0 ? {cls:"same", t:"Alle gestrichen!", s:"Gleiche Antworten zählen für keinen."}
    : {cls:"tie", t:"Gleich tief!", s:(two ? "Beide Nadeln stecken in derselben Schicht – unentschieden." : "Mehrere stecken gleich tief – niemand holt die Runde.")+dupNote};
  const wn=esc(P[r.win].name);
  if (r.win===mi) return {cls:"win", t:"Die Runde geht an dich!", s:(two ? (r.per[1-mi].t<0 ? `${esc(P[1-mi].name)} hat nichts gefunden.` : "Deine Nadel steckt tiefer.") : "Deine Nadel steckt am tiefsten.")+dupNote};
  return {cls:"lose", t:`Die Runde geht an ${wn}.`, s:(two ? (mi>=0 && r.per[mi].t<0 ? "Du hast diesmal nichts gefunden." : `Die Nadel von ${wn} steckt tiefer.`) : `Die Nadel von ${wn} steckt am tiefsten.`)+dupNote};
}
const liveAnsHTML=(t, a)=>t>=0 && a ? `<q>${esc(a)}</q>` : `<span class="hint">keine Antwort</span>`;
const LN_START=40, LN_CELL=40;
function liveShow(d, v){
  const L=live, i=v.i, Q=L.qs[i], P=d.players, two=P.length===2, o=lobbyOutcome(d, i+1), r=o.rows[i], mi=liveMeIdx(d);

  const res=k=>{ const x=r.per[k]; return (x.t<0 ? " miss" : "")+(x.dup ? " same" : x.win ? " won" : (r.win>=0 && x.t>=0) ? " lost" : ""); };
  let stage;
  if (two){
    stage=`<div class="duo" id="lvDuo">${P.map((x,k)=>{ const y=r.per[k]; return `<div class="dig lvdig${animate?"":res(k)}" id="lvdig_${k}">
      <div class="digtop"><div class="lvdn">${avatarHTML(x.pid, x.name, "s")}<span class="tagname"${nmAttr(x.pid)}>${esc(x.name)}</span>${x.me?`<span class="you">Du</span>`:""}</div><div class="dd right"><b id="lvpts_${k}">+${animate?0:y.pts}</b></div></div>
      <div class="shaft" id="lvshaft_${k}">
        ${TIERS.map((x2,j)=>`<div class="band${!animate && j===y.t?" active":""}${!animate && j<y.t?" passed":""}" data-i="${j}" style="${tierVars(j)}">${tierIcon(j)}<span class="bn">${x2.name}</span><span class="bp">+${x2.pts}</span></div>`).join("")}

      ${P.map((x,k)=>{ const y=r.per[k]; return `<div class="ln${x.me?" me":""}${animate?"":res(k)}" id="lvdig_${k}"><div class="lntrack" id="lvshaft_${k}"><div class="lnstart"></div>${TIERS.map((_,j)=>`<i class="lncell${!animate && j===y.t?" active":""}" data-i="${j}" style="${tierVars(j)}"></i>`).join("")}<div class="lnpin" id="lvprobe_${k}" style="top:${animate ? LN_START/2 : pinTop(y.t)}px">${avatarHTML(x.pid, x.name, "s")}</div></div></div>`; }).join("")}
    </div>
    <ol class="lnlist">${P.map((x,k)=>{ const y=r.per[k]; return `<li class="lnrow${x.me?" me":""}${animate?"":res(k)}" id="lnrow_${k}">${avatarHTML(x.pid, x.name, "s")}<span class="lnn"><span class="tagname"${nmAttr(x.pid)}>${esc(x.name)}</span>${x.me?`<span class="you">Du</span>`:""}</span><span class="lnans" id="lvans_${k}">${animate ? `<span class="hint">…</span>` : liveAnsHTML(y.t, y.a)}</span><b class="lnpts" id="lvpts_${k}">${animate ? "" : "+"+y.pts}</b></li>`; }).join("")}</ol>`;
  }

    </div>
    <div class="lvqt">${esc(Q.q)}</div>

    <div class="lvnext"><div class="lvnbar"><i id="lvNbar"></i></div><span id="lvNtxt"></span></div>
    <div class="stack lvrare" id="lvRare" style="gap:8px"${animate?" hidden":""}>${rare.length ? `<span class="label">${myT<0 ? "Das hätte Punkte gebracht" : "Noch seltener wären gewesen"}</span>${chipsHTML(rare)}` : myT===4 ? `<p class="your"><b>Seltener geht’s nicht.</b> Du hast die Nadel gefunden.</p>` : `<p class="your"><b>Seltener geht’s bei dieser Frage nicht.</b></p>`}</div>
    <p class="hint lvnet" id="lvNet" hidden>Verbindung unterbrochen – ich versuche es weiter …</p>
  </section>`;
  if (animate) liveRun(d, r, o);
}
async function liveRun(d, r, o){
  const L=live, tok={skip:false}; L.tok=tok;
  const alive=()=>live===L && L.tok===tok && state.screen==="live";
  const P=d.players, two=P.length===2, mi=liveMeIdx(d), SPEED=1/620;                 // Schichten pro Millisekunde – für alle Nadeln gleich
  const sides=P.map((x,k)=>{ const y=r.per[k]; return {k, t:y.t, a:y.a, per:y, landed:y.t<0, entered:-1,
    target:two ? (y.t>=0 ? y.t+.5 : 0) : (y.t>=0 ? (LN_START/2)/LN_CELL+y.t+.5 : 0),
    dig:$("lvdig_"+k), shaft:$("lvshaft_"+k), probe:$("lvprobe_"+k), pts:$("lvpts_"+k), ans:$("lvans_"+k), row:$("lnrow_"+k)}; });
  if (sides.some(s=>!s.dig || !s.shaft || !s.probe)) return;
  sides.forEach(s=>{ s.bands=[...s.shaft.querySelectorAll(two ? ".band" : ".lncell")]; if (s.t<0){ s.dig.classList.add("miss"); if (s.row) s.row.classList.add("miss"); if (s.ans) s.ans.innerHTML=liveAnsHTML(-1, ""); if (s.pts && !two) s.pts.textContent="+0"; } });
  await pause(550, tok);
  if (!alive()) return;
  const t0=performance.now();
  await new Promise(res=>{ (function f(now){
    if (!alive()) return res();
    const el=tok.skip ? 1e9 : now-t0; let all=true, layer=-1, land=-1;
    for (const s of sides){
      if (s.t<0 || s.landed) continue;
      const y=Math.min(s.target, el*SPEED);
      let band;
      if (two){ s.probe.style.top=(y*20)+"%"; band=y>0.02 ? Math.min(4, Math.floor(y)) : -1; }
      else { const px=LN_START/2+y*LN_CELL; s.probe.style.top=px+"px"; band=px>=LN_START ? Math.min(4, Math.floor((px-LN_START)/LN_CELL)) : -1; }
      if (band>s.entered){
        s.entered=band;
        s.bands.forEach((b,j)=>{ b.classList.toggle("active", j===band); b.classList.toggle("passed", j<band); });
        if (s.pts && two){ s.pts.textContent="+"+TIERS[band].pts; s.pts.classList.remove("bump"); void s.pts.offsetWidth; s.pts.classList.add("bump"); }

    if (all) res(); else requestAnimationFrame(f);
  })(t0); });
  if (!alive()) return;
  await pause(420, tok);
  if (!alive()) return;
  const won=r.win>=0 && r.win===mi;

  const vd=$("lvVerdict"); if (vd) vd.classList.add("show");

  if (L.tok===tok) L.tok=null;

/* Uhr, Status und Countdown nachführen, ohne neu zu zeichnen */
function liveDyn(v){
  const L=live, d=L && L.d; if (!d) return;
  const now=liveNow(), P=d.players, two=P.length===2, mi=liveMeIdx(d);
  const net=$("lvNet"); if (net) net.hidden=Date.now()-L.lastOk<4500;
  const st=(k, txt, cls)=>{ const el=$("lvst_"+k); if (!el) return; if (el.textContent!==txt) el.textContent=txt; el.className="lvst"+(cls ? " "+cls : ""); };
  if (v.ph==="count"){
    const n=Math.max(1, Math.ceil((v.q-now)/1000)), el=$("lvCount");
    if (el && el.textContent!==String(n)){ el.textContent=n; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    if (L.cnt!==n){ L.cnt=n; sfx("tick"); }
  } else if (v.ph==="ask" || v.ph==="revwait"){
    const left=Math.max(0, v.end-now), mine=liveMine(v.i), sec=Math.ceil(left/1000);
    const ring=$("ring"), fg=$("rfg"), num=$("tnum");
    if (fg) fg.setAttribute("stroke-dashoffset", (CIRC*(1-left/d.ask_ms)).toFixed(2));
    if (num) num.textContent=sec;
    if (ring){ ring.classList.toggle("low", !mine && left>0 && left<8000); ring.classList.toggle("frozen", left<=0); }
    if (!mine && left>0 && sec<=5 && sec!==L.tickSec){ L.tickSec=sec; sfx("tick"); }
    const cur=v.i===d.i, sm=!!(NARROW && NARROW.matches);                    // auf dem Handy ist neben dem Rundenstand wenig Platz
    let done=0, others=0;
    P.forEach((p,k)=>{
      if (k===mi){
        if (two) st(k, mine ? (mine.tier>=0 ? (sm ? "✓ steht" : "✓ Antwort steht") : mine.how==="pass" ? "gepasst" : (sm ? "–" : "keine Antwort")) : "du bist dran", mine && mine.tier>=0 ? "ok" : "");
        else st(k, mine ? (mine.tier>=0 ? "✓" : "–") : "…", mine && mine.tier>=0 ? "ok" : "");
        return;
      }
      others++;
      const oa=cur && !!p.answered; if (oa) done++;
      if (two) st(k, oa ? (sm ? "✓ fertig" : "✓ hat geantwortet") : !p.here ? (sm ? "offline" : "nicht verbunden") : left<=0 ? (sm ? "–" : "keine Antwort") : "überlegt …", oa ? "ok" : !p.here ? "off" : "");
      else st(k, oa ? "✓" : !p.here ? "×" : left<=0 ? "–" : "…", oa ? "ok" : !p.here ? "off" : "");
      const chip=$("lvp_"+k); if (chip) chip.classList.toggle("off", !p.here && !oa);
    });
    if (done>(L.oppAns[v.i]||0)){ L.oppAns[v.i]=done; if (v.ph==="ask"){ sfx("opp"); if (two){ const p=$("lvp_"+(1-mi)); if (p){ p.classList.remove("pulse"); void p.offsetWidth; p.classList.add("pulse"); } } } }
    const hurry=$("lvHurry"), ht=$("lvHurryTxt");
    if (hurry){ hurry.hidden=done===0; if (ht && done>0){ const t=two ? `${P[1-mi].name} hat schon geantwortet!` : `${done} von ${others} Gegnern ${done===1?"hat":"haben"} schon geantwortet!`; if (ht.textContent!==t) ht.textContent=t; } }
    const w=$("lvWait"); if (w){ const all=done>=others; const txt=(v.ph==="revwait" || all || left<=0) ? "Gleich kommt die Auflösung …" : two ? `Warte auf ${P[1-mi].name} … noch ${sec} s` : `${done} von ${others} Gegnern ${done===1?"hat":"haben"} geantwortet … noch ${sec} s`; if (w.textContent!==txt) w.textContent=txt; }
  } else if (v.ph==="reveal"){
    const left=Math.max(0, v.next-now), bar=$("lvNbar"), txt=$("lvNtxt");
    if (bar) bar.style.width=(100*left/d.reveal_ms).toFixed(1)+"%";
    if (txt){ const t=`${v.last ? "Endstand" : "Nächste Frage"} in ${Math.max(1, Math.ceil(left/1000))} s`; if (txt.textContent!==t) txt.textContent=t; }
    P.forEach((_,k)=>st(k, "", ""));
  }
}

function openAuth(after, mode, msg){ state={screen:"auth", mode:mode||"register", after:after||null, msg:msg||""}; render(); }
function adoptIdentity(player, name, pid){
  if (player!==local.playerId){ local.playerId=player; local.days={}; duelLocal={}; saveDuelLocal(); }
  local.account={name};
  if (typeof pid==="string" && /^[0-9a-f]{12}$/.test(pid)) local.account.pid=pid;
  me=null; shopData=null; saveLocal(); updateHeader(); refreshMe(true);
}
function logout(){
  local.playerId=newId(); local.account=null; local.days={}; saveLocal();
  duelLocal={}; saveDuelLocal(); me=null; shopData=null; meTok++; updateHeader();
  goStart();
}
function continueAfterAuth(after){
  const to=after && after.to;
  if (to==="daily") return openDaily();
  if (to==="duelnew"){ state={screen:"duelnew"}; render(); return; }

  goStart();
}
const AUTH_ERR={name_taken:"Diesen Namen gibt es schon. Nimm einen anderen – oder melde dich an, wenn es deiner ist.",
  bad_name:"Der Name braucht 2–10 Zeichen: Buchstaben, Zahlen, _ . oder -.", bad_password:"Das Passwort braucht mindestens 6 Zeichen.",
  wrong_login:"Name oder Passwort stimmt nicht.", network:"Keine Verbindung. Prüf dein Internet und versuch es nochmal."};
function renderAuth(){
  const reg=state.mode!=="login";
  view.innerHTML=`<section class="card stack narrow">
    <span class="label">Profil</span>
    <h2>${reg?"Erstell dein Profil.":"Willkommen zurück!"}</h2>

      <input id="auName" name="username" maxlength="10" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
      ${reg?`<span class="hint">2–10 Zeichen: Buchstaben, Zahlen, _ . oder -</span>`:""}
      <label for="auPw">Passwort</label>
      <input id="auPw" name="password" type="password" maxlength="72" autocomplete="${reg?"new-password":"current-password"}" enterkeyhint="go">
      ${reg?`<span class="hint">Mindestens 6 Zeichen. Merk es dir gut – ohne E-Mail lässt es sich nicht zurücksetzen.</span>`:""}
      <div class="row"><button class="btn" id="auGo" type="submit">${reg?"Profil erstellen":"Anmelden"}</button></div>
      <p class="fb bad" id="auErr" role="alert"></p>
    </form>
    <p class="hint">${reg?"Mit Profil spielst du Tagesrätsel und Duelle unter deinem Namen und kannst dich auf jedem Gerät anmelden. Was du auf diesem Gerät schon gespielt hast, wird übernommen."
      :"Danach spielst du auf diesem Gerät mit deinem Profil – mit all deinen Statistiken und Duellen."}</p>
    <div class="row"><button class="btn ghost small" id="menu3" type="button">Zurück</button></div>
  </section>`;
  $("menu3").onclick=goStart;
  $("auReg").onclick=()=>{ state.mode="register"; render(); };
  $("auLog").onclick=()=>{ state.mode="login"; render(); };
  const nm=$("auName"), pw=$("auPw"), err=$("auErr"), btn=$("auGo");
  nm.oninput=()=>{ const c=cleanName(nm.value); if (c!==nm.value) nm.value=c; };
  nm.focus({preventScroll:true});
  $("authForm").onsubmit=async ev=>{
    ev.preventDefault();
    const name=cleanName(nm.value), pass=pw.value;
    if (!NAME_RE.test(name)){ err.textContent=reg ? AUTH_ERR.bad_name : AUTH_ERR.wrong_login; return; }
    if (pass.length<6){ err.textContent=reg ? AUTH_ERR.bad_password : AUTH_ERR.wrong_login; return; }
    btn.disabled=true; err.textContent="";
    const tok=state;
    try{
      if (reg){
        let r;
        try{ r=await rpc("register", {p_player:local.playerId, p_name:name, p_password:pass}); }
        catch(e){
          if (e.code!=="device_has_account") throw e;
          local.playerId=newId(); local.days={}; saveLocal();
          r=await rpc("register", {p_player:local.playerId, p_name:name, p_password:pass});
        }
        if (state!==tok) return;
        adoptIdentity(local.playerId, (r && r.name) || name, r && r.pid);
      } else {
        const r=await rpc("login", {p_name:name, p_password:pass});
        if (state!==tok) return;
        if (!r || !r.ok){
          btn.disabled=false;
          err.textContent = r && r.error==="locked" ? `Zu viele falsche Versuche. Versuch es in ${Number(r.wait)||15} Minuten nochmal.` : AUTH_ERR.wrong_login;
          return;
        }
        adoptIdentity(r.player, r.name, r.pid);
      }
      continueAfterAuth(tok.after);
    }catch(e){
      if (state!==tok) return;
      btn.disabled=false;
      const code=e && e.code;
      err.textContent = AUTH_ERR[code]
        || (e && e.status===404 ? "Die Datenbank ist noch nicht fertig eingerichtet: In Supabase muss einmal das Skript setup.sql laufen."
        : `Das hat nicht geklappt. (${String(code||"unbekannter Fehler").slice(0,140)})`);
    }
  };
}

let actx=null;
const soundOn=()=>stats.sound!==false;
function audio(){
  if (!soundOn()) return null;
  try{
    if (!actx){ const C=window.AudioContext||window.webkitAudioContext; if (!C) return null; actx=new C(); }
    if (actx.state==="suspended") actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(f, at, dur, type, vol, to){
  const c=audio(); if (!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+(at||0);
    o.type=type||"sine"; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t+dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||.1, t+.015);
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
const SFX={
  tap:()=>tone(520,0,.06,"triangle",.05),
  go:()=>{ tone(392,0,.1,"triangle",.09); tone(523,.08,.1,"triangle",.09); tone(784,.16,.18,"triangle",.1); },
  layer:i=>tone(250+i*75,0,.14,"sine",.09,170+i*60),
  land:t=>{
    const seq=[[262],[262,330],[262,330,392],[330,392,523,659],[392,523,659,784,1047]][t]||[262];
    seq.forEach((f,k)=>tone(f, k*.085, t===4?.34:.22, "triangle", .1));
    if (t===4){ tone(1568,.46,.5,"sine",.06); tone(2093,.58,.6,"sine",.05); }
  },
  wrong:()=>tone(170,0,.17,"sawtooth",.07,115),
  tick:()=>tone(880,0,.05,"square",.03),
  timeout:()=>{ tone(330,0,.2,"triangle",.09,262); tone(220,.18,.34,"triangle",.09,160); },
  pass:()=>tone(294,0,.18,"sine",.07,215),
  win:()=>{ [523,659,784,1047].forEach((f,k)=>tone(f, k*.11, .24, "triangle", .11)); tone(1319,.46,.55,"triangle",.1); },
  lose:()=>{ [392,349,311,262].forEach((f,k)=>tone(f, k*.14, .26, "triangle", .09)); },
  draw:()=>{ tone(392,0,.2,"triangle",.09); tone(392,.22,.3,"triangle",.09); },
  up:()=>{ [523,784,1047,1568].forEach((f,k)=>tone(f, k*.07, .22, "sine", .09)); },
  point:()=>tone(659,0,.11,"triangle",.08,880),
  nopoint:()=>tone(330,0,.11,"triangle",.06,262),
  lock:()=>{ tone(523,0,.07,"triangle",.08); tone(784,.07,.13,"triangle",.08); },
  opp:()=>{ tone(988,0,.06,"sine",.06); tone(1319,.08,.11,"sine",.06); }
};

function toast(html, icon, ms){
  let box=$("toasts");
  if (!box){ box=document.createElement("div"); box.id="toasts"; box.setAttribute("role","status"); box.setAttribute("aria-live","polite"); document.body.appendChild(box); }
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=(icon||"")+`<span>${html}</span>`;
  box.appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(), 420); }, ms||3200);
}
function confetti(el, n){
  if (REDUCED || !el) return;
  const b=el.getBoundingClientRect();
  const fx=document.createElement("div"); fx.className="fx"; fx.setAttribute("aria-hidden","true");
  for (let k=0;k<n;k++){
    const s=document.createElement("i");
    s.style.left=(b.left+b.width*(.1+Math.random()*.8))+"px"; s.style.top=(b.top+b.height*.5)+"px";
    const ang=Math.random()*Math.PI*2, dist=70+Math.random()*230;
    s.style.setProperty("--dx",(Math.cos(ang)*dist).toFixed(0)+"px");
    s.style.setProperty("--dy",(Math.sin(ang)*dist-50).toFixed(0)+"px");
    s.style.setProperty("--r",(Math.random()*720-360).toFixed(0)+"deg");
    s.style.setProperty("--c",["var(--gold)","var(--hot)","var(--t3)","var(--t4)","var(--t2)"][Math.floor(Math.random()*5)]);
    s.style.animationDelay=(Math.random()*160).toFixed(0)+"ms";
    fx.appendChild(s);
  }
  document.body.appendChild(fx); setTimeout(()=>fx.remove(), 1600);
}
function countUp(el, to, ms){
  if (!el) return;
  if (REDUCED || !(to>0)){ el.textContent=to; return; }
  const t0=performance.now();
  (function f(now){
    if (!el.isConnected) return;
    const p=Math.min(1, Math.max(0, (now-t0)/ms));
    el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
    if (p<1) requestAnimationFrame(f);
  })(t0);
}

const lvlNeed=L=>50*(L-1)*(L+2);
function levelOf(xp){
  xp=Math.max(0, Math.round(Number(xp)||0));
  let L=1; while (L<99 && lvlNeed(L+1)<=xp) L++;
  const a=lvlNeed(L), b=lvlNeed(L+1);
  return {lvl:L, xp, into:xp-a, span:b-a, left:b-xp, pct:Math.max(0, Math.min(100, Math.round((xp-a)*100/(b-a))))};
}

const AV_DATA_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/]+=*$/;
const AV_ICON_RE=/^icon:([a-z0-9]{1,16}):(\d{1,2})$/;
const avCache=new Map(), avAt=new Map();
const avBusy=new Set();
let avOff=false;
const AV_TTL=5*60*1000;
function avSet(pid, val){ avCache.set(pid, typeof val==="string" && val ? val : null); avAt.set(pid, Date.now()); }
const initials=name=>{ const s=String(name||"").replace(/[^A-Za-z0-9ÄÖÜäöüß]/g,""); return (s.slice(0,2)||"?").toUpperCase(); };
const avStyle=c=>`--avc:${AV_COLORS[c]};--avt:${AV_INK[c]}`;
const avSeed=name=>hashStr(String(name||"?").toLowerCase())%AV_COLORS.length;
function avParts(av, name){
  if (typeof av==="string" && av.length<=60000 && AV_DATA_RE.test(av)) return {style:"", html:`<img src="${av}" alt="" draggable="false">`};
  const m=typeof av==="string" ? AV_ICON_RE.exec(av) : null;
  if (m && AV_ICONS[m[1]]) return {style:avStyle((+m[2])%AV_COLORS.length), html:svg(AV_ICONS[m[1]])};
  if (m && m[1]==="abc") return {style:avStyle((+m[2])%AV_COLORS.length), html:esc(initials(name))};
  return {style:avStyle(avSeed(name)), html:esc(initials(name))};
}
function avatarHTML(pid, name, cls, av){
  const val = av!==undefined ? av : (pid && avCache.has(pid) ? avCache.get(pid) : null);
  const p=avParts(val, name);
  return `<span class="av${cls?" "+cls:""}" style="${p.style}"${pid?` data-av="${esc(pid)}" data-avn="${esc(name||"")}"`:""} aria-hidden="true">${p.html}</span>`;
}
function paintAvatars(pids){
  document.querySelectorAll("[data-av]").forEach(el=>{
    const p=el.dataset.av;
    if ((pids && !pids.includes(p)) || !avCache.has(p)) return;
    const r=avParts(avCache.get(p), el.dataset.avn);
    el.setAttribute("style", r.style); el.innerHTML=r.html;
  });
}
async function loadAvatars(root){
  if (avOff || !dailyAvailable()) return;
  const need=[...new Set([...(root||document).querySelectorAll("[data-av]")].map(e=>e.dataset.av))]
    .filter(p=>/^[0-9a-f]{12}$/.test(p) && !avBusy.has(p) && (!avCache.has(p) || Date.now()-(avAt.get(p)||0)>AV_TTL));
  if (!need.length) return;
  need.forEach(p=>avBusy.add(p));
  const got=[];
  try{
    for (let i=0;i<need.length;i+=40){
      const part=need.slice(i, i+40);
      let r=null;
      if (!looksOff){
        try{ r=await rpc("get_looks", {p_pids:part}); }
        catch(e){ if (e && e.status===404) looksOff=true; else throw e; }
      }
      if (looksOff) r=await rpc("get_avatars", {p_pids:part});
      part.forEach(p=>{ const old=avCache.get(p), v=r ? r[p] : null; lookSet(p, v==null ? null : v); if (old!==avCache.get(p)) got.push(p); });
    }
  }catch(e){ if (e && e.status===404) avOff=true; }
  finally{ need.forEach(p=>avBusy.delete(p)); }
  if (got.length) paintAvatars(got);
  paintNames(); paintCharms();
}

  if (d.bonus && typeof d.bonus.day==="string" && a.bonusDay!==d.bonus.day){ a.bonusDay=d.bonus.day; bonus=d.bonus; }

  if (bonus && Number(bonus.tokens)>0) toast(`Tagesrätsel vom ${esc(dayLabel(bonus.day))}: Platz ${Number(bonus.pos)||"?"} – <b>+${Number(bonus.tokens)} Token</b>`, I_COIN, 5200);

function openAvatarEditor(){

  const isPhoto=typeof cur==="string" && AV_DATA_RE.test(cur);
  const m0=typeof cur==="string" ? AV_ICON_RE.exec(cur) : null;
  const st={tab:isPhoto?"photo":"icon", icon:m0 && AV_ICONS[m0[1]] ? m0[1] : "abc", color:m0 ? (+m0[2])%AV_COLORS.length : avSeed(name),
    img:null, zoom:1, ox:0, oy:0, photo:isPhoto?cur:null, dirty:false};
  const wrap=document.createElement("div");
  wrap.className="modal"; wrap.id="avModal"; wrap.setAttribute("role","dialog"); wrap.setAttribute("aria-modal","true"); wrap.setAttribute("aria-label","Profilbild aussuchen");
  wrap.innerHTML=`<div class="mcard">
    <div class="mhead"><h2>Dein Profilbild</h2><button class="iconbtn" id="avClose" type="button" aria-label="Schließen">${I_X}</button></div>
    <div class="row"><div class="seg" role="group" aria-label="Art des Profilbilds">
      <button type="button" id="avTabIcon">Symbol</button><button type="button" id="avTabPhoto">Eigenes Foto</button>
    </div></div>
    <div id="avPaneIcon" class="stack" style="gap:12px">
      <div class="avprev"><span class="av xl" id="avPrev"></span></div>
      <span class="label">Symbol</span>
      <div class="avicons" id="avIcons"><button type="button" data-ic="abc" aria-label="Anfangsbuchstaben"><b>${esc(initials(name))}</b></button>${Object.keys(AV_ICONS).map(k=>`<button type="button" data-ic="${k}" aria-label="${k}">${svg(AV_ICONS[k].replace(/var\(--avc\)/g,"var(--surface-2)"))}</button>`).join("")}</div>

    </div>
    <div id="avPanePhoto" class="cropwrap" hidden>
      <div class="cropper" id="cropper"><canvas id="cropCv" width="480" height="480"></canvas></div>
      <input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
      <label class="btn ghost small filebtn">Foto auswählen<input type="file" id="avFile" accept="image/*"></label>
      <p class="hint" style="text-align:center">Zieh das Bild zurecht und zoom mit dem Regler. Hochgeladen wird nur der kleine runde Ausschnitt.</p>
    </div>
    <p class="fb bad" id="avErr" role="alert" style="min-height:0"></p>
    <div class="row"><button class="btn" id="avSave" type="button">Speichern</button><button class="btn ghost small" id="avRemove" type="button">Bild entfernen</button></div>
    <p class="hint">Dein Profilbild sehen alle – in Bestenliste, Duellen und auf deinem Profil.</p>
  </div>`;
  document.body.appendChild(wrap);
  const q=id=>wrap.querySelector("#"+id);
  const err=q("avErr"), cv=q("cropCv"), ctx=cv.getContext("2d"), zoomEl=q("cropZoom"), crop=q("cropper");
  const draw=(c, size)=>{
    c.fillStyle="#1D1705"; c.fillRect(0,0,size,size);
    const img=st.img; if (!img) return;
    const s=size/Math.min(img.width, img.height)*st.zoom, w=img.width*s, h=img.height*s;
    const mx=Math.max(0,(w-size)/2), my=Math.max(0,(h-size)/2);
    const ox=Math.max(-mx, Math.min(mx, st.ox*size)), oy=Math.max(-my, Math.min(my, st.oy*size));
    st.ox=ox/size; st.oy=oy/size;
    c.imageSmoothingEnabled=true; c.imageSmoothingQuality="high";
    c.drawImage(img, (size-w)/2+ox, (size-h)/2+oy, w, h);
  };
  const redraw=()=>{
    if (st.tab==="photo"){
      draw(ctx, 480);
      if (!st.img){ ctx.fillStyle="#FFF0C0"; ctx.font="600 30px sans-serif"; ctx.textAlign="center"; ctx.fillText("Noch kein Foto", 240, 250); }
    } else {
      const p=avParts(`icon:${st.icon}:${st.color}`, name), el=q("avPrev");
      el.setAttribute("style", p.style); el.innerHTML=p.html;
    }
  };
  const paint=()=>{
    q("avTabIcon").setAttribute("aria-pressed", String(st.tab==="icon"));
    q("avTabPhoto").setAttribute("aria-pressed", String(st.tab==="photo"));
    q("avPaneIcon").hidden = st.tab!=="icon"; q("avPanePhoto").hidden = st.tab!=="photo";
    wrap.querySelectorAll("#avIcons button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.ic===st.icon)));
    wrap.querySelectorAll("#avColors button").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.c===st.color)));
    err.textContent=""; redraw();
  };
  const useImage=src=>new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>(img.width && img.height) ? res(img) : rej(new Error("leer")); img.onerror=()=>rej(new Error("laden")); img.src=src; });
  q("avTabIcon").onclick=()=>{ st.tab="icon"; paint(); };
  q("avTabPhoto").onclick=()=>{ st.tab="photo"; paint(); };
  wrap.querySelectorAll("#avIcons button").forEach(b=>{ b.onclick=()=>{ st.icon=b.dataset.ic; sfx("tap"); paint(); }; });
  wrap.querySelectorAll("#avColors button").forEach(b=>{ b.onclick=()=>{ st.color=+b.dataset.c; sfx("tap"); paint(); }; });
  q("avFile").onchange=async ev=>{
    const f=ev.target.files && ev.target.files[0]; if (!f) return;
    err.textContent="";
    let url="";
    try{
      url=URL.createObjectURL(f);
      st.img=await useImage(url); st.zoom=1; st.ox=0; st.oy=0; st.dirty=true; zoomEl.value="1"; redraw();
    }catch(e){ err.textContent="Dieses Bild konnte nicht geladen werden. Nimm ein JPG oder PNG."; }
    finally{ if (url) try{ URL.revokeObjectURL(url); }catch(e){} }
  };
  zoomEl.oninput=()=>{ st.zoom=Math.max(1, Math.min(4, Number(zoomEl.value)||1)); st.dirty=true; redraw(); };
  const pts=new Map(); let pinch=0;
  const dist=()=>{ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); };
  crop.onpointerdown=ev=>{ if (!st.img) return; try{ crop.setPointerCapture(ev.pointerId); }catch(e){} pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY}); if (pts.size===2) pinch=dist(); };
  crop.onpointermove=ev=>{
    const p=pts.get(ev.pointerId); if (!p || !st.img) return;
    const size=crop.clientWidth||240;
    if (pts.size===1){ st.ox+=(ev.clientX-p.x)/size; st.oy+=(ev.clientY-p.y)/size; }
    p.x=ev.clientX; p.y=ev.clientY;
    if (pts.size===2){ const d=dist(); if (pinch>0){ st.zoom=Math.max(1, Math.min(4, st.zoom*d/pinch)); zoomEl.value=String(st.zoom); } pinch=d; }
    st.dirty=true; redraw();
  };
  crop.onpointerup=crop.onpointercancel=ev=>{ pts.delete(ev.pointerId); pinch=0; };
  crop.onwheel=ev=>{ if (!st.img) return; ev.preventDefault(); st.zoom=Math.max(1, Math.min(4, st.zoom*(ev.deltaY<0?1.08:.93))); zoomEl.value=String(st.zoom); st.dirty=true; redraw(); };
  const exportPhoto=()=>{
    const c=document.createElement("canvas"); c.width=c.height=192;
    draw(c.getContext("2d"), 192);
    for (const ql of [.86,.78,.68,.56,.44]){ const u=c.toDataURL("image/jpeg", ql); if (u.length<=45000 && AV_DATA_RE.test(u)) return u; }
    return null;
  };
  const send=async val=>{
    const save=q("avSave"), rem=q("avRemove");
    save.disabled=true; rem.disabled=true; err.textContent="";
    try{ await rpc("set_avatar", {p_player:local.playerId, p_avatar:val}); }
    catch(e){
      save.disabled=false; rem.disabled=false;
      err.textContent = e && e.status===404 ? "Profilbilder sind noch nicht eingerichtet: In Supabase muss einmal das Skript setup.sql laufen."
        : e && e.code==="need_account" ? "Bitte melde dich nochmal an."
        : e && e.code==="network" ? "Keine Verbindung. Prüf dein Internet und versuch es nochmal."
        : "Das hat nicht geklappt. Versuch es nochmal.";
      return;
    }
    const p=myPid();
    if (p){ avSet(p, val); paintAvatars([p]); }
    if (me) me.avatar=val||null;
    closeModal();
    toast(val ? "Profilbild gespeichert." : "Profilbild entfernt.", I_CHECK); sfx("point");
    if (!p) refreshMe(true);
    if (state.screen==="profile" && state.data && state.data.me){ state.data.avatar=val||null; render(); }
    else if (state.screen==="start") updateMeCard();
  };
  q("avSave").onclick=()=>{
    if (st.tab==="icon") return send(`icon:${st.icon}:${st.color}`);
    if (!st.img){ err.textContent="Such zuerst ein Foto aus."; return; }
    const val = st.dirty || !st.photo ? exportPhoto() : st.photo;
    if (!val){ err.textContent="Dieses Bild lässt sich nicht verkleinern. Nimm ein anderes."; return; }
    send(val);
  };
  q("avRemove").onclick=()=>send("");
  q("avClose").onclick=closeModal;
  wrap.onclick=ev=>{ if (ev.target===wrap) closeModal(); };
  modalKey=ev=>{ if (ev.key==="Escape") closeModal(); };
  document.addEventListener("keydown", modalKey);
  paint();
  try{ q("avClose").focus({preventScroll:true}); }catch(e){}
  if (st.photo) useImage(st.photo).then(img=>{ if (!st.img && $("avModal")===wrap){ st.img=img; redraw(); } }, ()=>{});
}

/* ======================= Namen ändern (einmal pro Woche) ======================= */
const fmtWhen=ts=>{ try{ return new Intl.DateTimeFormat("de-DE", {timeZone:TZ, weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"}).format(new Date(ts))+" Uhr"; }catch(e){ return ""; } };
function openNameEditor(next){
  if (!dailyAvailable() || !account()) return;
  closeModal();
  const cur=account().name;
  const wait=Number(next)>Date.now() ? Number(next) : 0;
  const wrap=document.createElement("div");
  wrap.className="modal"; wrap.id="nmModal"; wrap.setAttribute("role","dialog"); wrap.setAttribute("aria-modal","true"); wrap.setAttribute("aria-label","Name ändern");
  wrap.innerHTML=`<div class="mcard">
    <div class="mhead"><h2>Name ändern</h2><button class="iconbtn" id="nmClose" type="button" aria-label="Schließen">${I_X}</button></div>
    ${wait ? noteHTML(I_CLOCK, `Du hast deinen Namen vor Kurzem geändert. Das geht <b>einmal pro Woche</b> – wieder ab <b>${esc(fmtWhen(wait))}</b>.`)
      : `<form class="authform" id="nmForm" novalidate>
        <label for="nmIn">Neuer Name</label>
        <input id="nmIn" maxlength="10" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" value="${esc(cur)}">
        <span class="hint">2–10 Zeichen: Buchstaben, Zahlen, _ . oder -</span>
        <p class="fb bad" id="nmErr" role="alert" style="min-height:0"></p>
        <div class="row"><button class="btn" id="nmGo" type="submit">Namen ändern</button></div>
      </form>
      <p class="hint">Das geht <b>einmal pro Woche</b>. Der neue Name gilt überall – auch in alten Bestenlisten und Duellen. Danach meldest du dich mit dem neuen Namen an, dein Passwort bleibt gleich.</p>`}
  </div>`;
  document.body.appendChild(wrap);
  const q=id=>wrap.querySelector("#"+id);
  q("nmClose").onclick=closeModal;
  wrap.onclick=ev=>{ if (ev.target===wrap) closeModal(); };
  modalKey=ev=>{ if (ev.key==="Escape") closeModal(); };
  document.addEventListener("keydown", modalKey);
  if (wait){ try{ q("nmClose").focus({preventScroll:true}); }catch(e){} return; }
  const inp=q("nmIn"), err=q("nmErr"), btn=q("nmGo");
  inp.oninput=()=>{ const c=cleanName(inp.value); if (c!==inp.value) inp.value=c; };
  try{ inp.focus({preventScroll:true}); inp.select(); }catch(e){}
  q("nmForm").onsubmit=async ev=>{
    ev.preventDefault();
    if (btn.disabled) return;
    const name=cleanName(inp.value);
    if (!NAME_RE.test(name)){ err.textContent=AUTH_ERR.bad_name; return; }
    if (name===cur){ err.textContent="Das ist schon dein Name."; return; }
    btn.disabled=true; err.textContent="";
    const player=local.playerId;
    let r=null;
    try{ r=await rpc("change_name", {p_player:player, p_name:name}); }
    catch(e){
      btn.disabled=false;
      const code=e && e.code;
      err.textContent = code==="name_taken" ? "Diesen Namen gibt es schon. Nimm einen anderen."
        : code==="bad_name" ? AUTH_ERR.bad_name
        : code==="same_name" ? "Das ist schon dein Name."
        : code==="need_account" ? "Bitte melde dich nochmal an."
        : code==="network" ? AUTH_ERR.network
        : e && e.status===404 ? "Namen ändern ist noch nicht eingerichtet: In Supabase muss einmal das Skript setup.sql laufen."
        : "Das hat nicht geklappt. Versuch es nochmal.";
      return;
    }
    if (!r || !r.ok){
      btn.disabled=false;
      err.textContent = r && r.error==="too_soon" ? `Du kannst deinen Namen erst wieder ab ${fmtWhen(r.next)} ändern.` : "Das hat nicht geklappt. Versuch es nochmal.";
      return;
    }
    if (!account() || local.playerId!==player){ closeModal(); return; }
    const neu=cleanName(r.name)||name;
    local.account.name=neu;
    Object.values(local.days).forEach(e=>{ if (e && e.name) e.name=neu; });
    saveLocal();
    if (me) me.name=neu;
    closeModal(); updateHeader();
    toast(`Du heißt jetzt <b>${esc(neu)}</b>.`, I_CHECK); sfx("point");
    if (state.screen==="profile") openProfile(state.pid||null);
    else if (state.screen==="start") render();
  };
}

    if (st.anim) css+=`${s}{animation:nmflow ${st.anim} linear infinite}\n`;

/* ======================= Wer ist gerade online =======================
   Läuft über Supabase Realtime (Presence): jede offene Seite meldet sich in einem gemeinsamen Kanal an,
   gezählt werden die angemeldeten Geräte. Dafür ist kein Datenbank-Skript nötig. Übertragen wird nur
   ein zufälliger Geräte-Schlüssel – kein Name und nicht die geheime Spieler-ID.
   Ist die Seite länger als eine Minute im Hintergrund, meldet sie sich ab und beim Zurückkommen wieder an. */
const ON_TOPIC="realtime:heuhaufen-online", ON_BEAT=25000, ON_IDLE=60000;
const onl={ws:null, ref:0, joinRef:null, beat:null, beatRef:null, watch:null, retry:null, gone:null, idle:null, probe:null, tries:0, synced:false, pending:[], map:new Map(), n:null, key:null, wired:false};
function onlineKey(){
  if (onl.key) return onl.key;
  let k=null;
  try{ k=localStorage.getItem("heuhaufen:oid"); }catch(e){}
  if (!/^[0-9a-f]{16}$/.test(k||"")){
    try{ const a=new Uint8Array(8); crypto.getRandomValues(a); k=[...a].map(x=>x.toString(16).padStart(2,"0")).join(""); }
    catch(e){ k=(Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2)+"0000000000000000").slice(0,16); }
    try{ localStorage.setItem("heuhaufen:oid", k); }catch(e){}
  }
  return onl.key=k;
}
function onlinePaint(){
  const el=$("onPill"), num=$("onNum"); if (!el || !num) return;
  if (onl.n==null){ el.hidden=true; return; }
  const txt=fmtNum(onl.n), changed=!el.hidden && num.textContent!==txt;
  num.textContent=txt; el.hidden=false;
  el.title=onl.n===1 ? "Gerade ist 1 Spieler online – das bist du" : `Gerade sind ${txt} Spieler online`;
  if (changed){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}
function onlineCount(){ const s=new Set(onl.map.keys()); s.add(onlineKey()); onl.n=s.size; clearTimeout(onl.gone); onl.gone=null; onlinePaint(); }
function onlineDiff(d){
  const j=(d && d.joins)||{}, l=(d && d.leaves)||{};
  for (const k of Object.keys(j)){ let s=onl.map.get(k); if (!s){ s=new Set(); onl.map.set(k,s); } for (const m of ((j[k] && j[k].metas)||[])) s.add(m.phx_ref); if (!s.size) onl.map.delete(k); }
  for (const k of Object.keys(l)){ const s=onl.map.get(k); if (!s) continue; for (const m of ((l[k] && l[k].metas)||[])) s.delete(m.phx_ref); if (!s.size) onl.map.delete(k); }
}
function onlineState(st){
  onl.map.clear();
  for (const k of Object.keys(st||{})){ const s=new Set(((st[k] && st[k].metas)||[]).map(m=>m.phx_ref)); if (s.size) onl.map.set(k,s); }
  const p=onl.pending; onl.pending=[]; onl.synced=true; p.forEach(onlineDiff);   // Änderungen, die vor der Liste kamen, nachholen
}
function onlineSend(topic, event, payload){
  const w=onl.ws; if (!w || w.readyState!==1) return null;
  const ref=String(++onl.ref), m={topic, event, payload, ref};
  if (topic===ON_TOPIC) m.join_ref=onl.joinRef;
  try{ w.send(JSON.stringify(m)); }catch(e){ return null; }
  return ref;
}
function onlineStop(){
  const w=onl.ws; onl.ws=null; onl.synced=false; onl.pending=[]; onl.beatRef=null;
  clearInterval(onl.beat); onl.beat=null; clearTimeout(onl.watch); onl.watch=null; clearTimeout(onl.probe); onl.probe=null;
  if (w){ w.onopen=w.onmessage=w.onclose=w.onerror=null; try{ w.close(); }catch(e){} }
}
function onlineRetry(){
  clearTimeout(onl.retry); onl.retry=null;
  if (!onl.gone) onl.gone=setTimeout(()=>{ onl.gone=null; if (!(onl.ws && onl.synced)){ onl.n=null; onlinePaint(); } }, 8000);   // kurze Aussetzer nicht anzeigen
  if (document.visibilityState==="hidden") return;      // geht weiter, sobald die Seite wieder zu sehen ist
  const wait=onl.tries>=8 ? 300000 : Math.min(60000, 2000*Math.pow(2, onl.tries));
  onl.tries++;
  onl.retry=setTimeout(onlineConnect, Math.round(wait*(0.75+Math.random()*0.5)));
}
function onlineDrop(){ onlineStop(); onlineRetry(); }
function onlineMsg(m){
  if (!m || typeof m!=="object") return;
  if (m.topic==="phoenix"){ if (m.event==="phx_reply" && m.ref===onl.beatRef) onl.beatRef=null; return; }
  if (m.topic!==ON_TOPIC) return;
  const p=m.payload||{};
  if (m.event==="phx_reply" && m.ref===onl.joinRef){
    if (p.status==="ok") onlineSend(ON_TOPIC, "presence", {type:"presence", event:"track", payload:{}});
    else onlineDrop();
  }
  else if (m.event==="presence_state"){ onlineState(p); onl.tries=0; clearTimeout(onl.watch); onl.watch=null; onlineCount(); }
  else if (m.event==="presence_diff"){ if (onl.synced){ onlineDiff(p); onlineCount(); } else onl.pending.push(p); }
  else if (m.event==="phx_error" || m.event==="phx_close" || (m.event==="system" && p.status==="error")) onlineDrop();
}
function onlineConnect(){
  clearTimeout(onl.retry); onl.retry=null;
  if (onl.ws || !dailyAvailable() || typeof WebSocket!=="function") return;
  if (document.visibilityState==="hidden") return;
  let w;
  try{ w=new WebSocket(SB_URL.replace(/^http/,"ws")+"/realtime/v1/websocket?apikey="+encodeURIComponent(SB_KEY)+"&vsn=1.0.0"); }
  catch(e){ onlineRetry(); return; }
  onl.ws=w; onl.synced=false; onl.pending=[]; onl.beatRef=null;
  onl.watch=setTimeout(()=>{ if (onl.ws===w && !onl.synced) onlineDrop(); }, 15000);      // keine Antwort: neu versuchen
  w.onopen=()=>{
    if (onl.ws!==w) return;
    onl.joinRef=String(++onl.ref);
    try{ w.send(JSON.stringify({topic:ON_TOPIC, event:"phx_join", payload:{config:{broadcast:{ack:false, self:false}, presence:{key:onlineKey()}, postgres_changes:[], private:false}}, ref:onl.joinRef, join_ref:onl.joinRef})); }
    catch(e){ onlineDrop(); return; }
    onl.beat=setInterval(()=>{ if (onl.beatRef){ onlineDrop(); return; } onl.beatRef=onlineSend("phoenix", "heartbeat", {}); }, ON_BEAT);
  };
  w.onmessage=ev=>{ if (onl.ws!==w) return; let m=null; try{ m=JSON.parse(ev.data); }catch(e){ return; } onlineMsg(m); };
  w.onclose=()=>{ if (onl.ws===w) onlineDrop(); };
  w.onerror=()=>{};
}
function onlineWake(){
  clearTimeout(onl.idle); onl.idle=null;
  if (document.visibilityState==="hidden"){
    onl.idle=setTimeout(()=>{ onl.idle=null; onlineStop(); clearTimeout(onl.retry); onl.retry=null; }, ON_IDLE);
    return;
  }
  if (!onl.ws){ onl.tries=0; onlineConnect(); return; }
  if (onl.ws.readyState>1){ onl.tries=0; onlineStop(); onlineConnect(); return; }
  if (onl.ws.readyState===1 && !onl.beatRef){          // war die Seite weg: prüfen, ob die Verbindung noch lebt
    const w=onl.ws, ref=onl.beatRef=onlineSend("phoenix", "heartbeat", {});
    clearTimeout(onl.probe);
    onl.probe=setTimeout(()=>{ onl.probe=null; if (onl.ws===w && ref && onl.beatRef===ref){ onl.tries=0; onlineStop(); onlineConnect(); } }, 5000);
  }
}
function onlineStart(){
  if (onl.wired || !dailyAvailable() || typeof WebSocket!=="function") return;
  onl.wired=true;
  document.addEventListener("visibilitychange", onlineWake);
  addEventListener("pagehide", ()=>{ clearTimeout(onl.idle); onl.idle=null; clearTimeout(onl.retry); onl.retry=null; onlineStop(); });
  addEventListener("pageshow", ev=>{ if (ev.persisted) onlineWake(); });
  addEventListener("online", ()=>{ if (!onl.ws && document.visibilityState!=="hidden"){ onl.tries=0; onlineConnect(); } });
  onlineConnect();
}

  </section>`;
  $("cancel").onclick=()=>{ state.abort=true; source="bank"; beginWith(drawBank()); };
}

async function startRound(){
  if (source==="ai" && sampleOK()){
    state={screen:"loading", abort:false};
    render();
    const token=state;
    try{
      const qs=await drawAI();
      if (token.abort || state!==token) return;
      beginWith(qs);
    }catch(e){
      if (token.abort || state!==token) return;
      const code=e && e.code;
      if (code==="not_granted") aiDenied=true;
      source="bank";
      beginWith(drawBank(), code==="not_granted" ? "Claude wurde nicht erlaubt – wir spielen klassisch."
        : code==="rate_limited" ? "Claude braucht gerade eine Pause – diese Runde spielen wir klassisch."
        : "Die neuen Fragen haben nicht geklappt – diese Runde spielen wir klassisch.");
    }
    return;
  }
  beginWith(drawBank());
}

function beginWith(qs, notice, daily, duel){
  state={screen:"play", qs, i:0, results:[], phase:"ask", fb:notice||"", fbBad:false, tries:[], checking:false, daily:daily||null, duel:duel||null};
  sfx("go");
  startQuestion();
}
function startQuestion(){
  state.phase="ask"; state.tries=[]; state.checking=false; state.checkTok=null; state.fresh=true; state.tickSec=null;
  deadline=Date.now()+SECONDS*1000;
  render();
  try{ window.scrollTo(0, 0); }catch(e){}
}

function ringHTML(left, cls){

  return `<div class="ring ${cls||""}" id="ring" role="timer" aria-label="Verbleibende Sekunden">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="rbg" cx="32" cy="32" r="27"/><circle class="rfg" id="rfg" cx="32" cy="32" r="27" stroke-dasharray="${CIRC}" stroke-dashoffset="${off}" transform="rotate(-90 32 32)"/></svg>
    <span id="tnum">${Math.ceil(left)}</span></div>`;
}

function questionHTML(text){
  const cut=text.indexOf(" – ");
  if (cut<0) return `<div class="question">${esc(text)}</div>`;
  const main=text.slice(0,cut)+".", cond=text.slice(cut+3).replace(/\.$/,"");
  return `<div class="question">${esc(main)}</div><div class="cond">${I_FLAG}<span>${esc(cond.charAt(0).toUpperCase()+cond.slice(1))}</span></div>`;
}
function renderPlay(){

  const pips=state.qs.map((_,j)=>`<span class="pip${j<state.i?" done":j===state.i?" now":""}"></span>`).join("");

        <input id="ans" name="ans" type="text" placeholder="Deine Antwort …" aria-label="Deine Antwort" autocapitalize="sentences" spellcheck="false" enterkeyhint="send" maxlength="80">

  view.innerHTML=`
  <section class="card stack playcard${fresh?" qenter":""}">
    <div class="qhead">
      <span class="chip">${catIcon(Q.k)}${esc(Q.k)}${Q.src==="ai"?" · von Claude":""}</span>
      <div class="row" style="gap:10px"><div class="pips" aria-hidden="true">${pips}</div><span class="prog">${state.daily?"Tagesrätsel · ":state.duel?"Duell · ":"Classic · "}Frage ${state.i+1}/${state.qs.length} · <b${bumpPts?' class="bump"':""}>${total}</b> Pkt.</span></div>
    </div>
    <div class="playgrid">
    <div class="pq">
    <div class="qrow">
      <div class="cat" aria-hidden="true">${catIcon(Q.k)}</div>
      <div class="qtext">${questionHTML(Q.q)}</div>
      ${ringHTML(leftNow, state.phase==="ask"?"":"frozen")}
    </div>
    <p class="known">${I_BOOK}<span>Wir kennen ${known} richtige Antworten${aiCheckOn()?" – alle anderen prüft Claude":""}.</span></p>
    </div>
    ${body}
    </div>
  </section>`;
  if (state.phase==="ask"){
    const inp=$("ans");
    inp.focus({preventScroll:true});
    $("ansForm").onsubmit=ev=>{ ev.preventDefault(); submit(inp.value); };
    $("pass").onclick=()=>finish(null,"pass");
    tick(); timerId=setInterval(tick,100);
  } else {
    $("next").onclick=next;
    if (state.animDone){
      const nx=$("next");
      nx.focus({preventScroll:true});
      try{ if (nx.getBoundingClientRect().bottom>window.innerHeight-12) nx.scrollIntoView({behavior:REDUCED?"auto":"smooth", block:"end"}); }catch(e){}
      if (state.celebrate){ state.celebrate=false; celebrate(state.results[state.i].tier); }
    } else runDig(state.results[state.i]);
